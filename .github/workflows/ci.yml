# Intégration continue d'Ora : à chaque push et à chaque pull request, on teste, on construit et on teste
# l'app construite dans un vrai navigateur. Sur la branche main, si tout passe, dist/ est publié sur GitHub Pages.
name: Ora

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests du moteur et des données
        run: npm test
      - name: Build
        run: npm run build
      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  publication:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
