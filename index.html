  // La mer de nuages du bas est peinte une fois par ambiance, puis recopiée à chaque page.
  var merBasCache = {};
  function peindreMerBas(cle) {
    var z = document.getElementById('mer-bas'); if (!z) return;
    var cache = merBasCache[cle];
    if (cache && cache.largeur === z.clientWidth) { cache.calques.forEach(function (n) { z.appendChild(n); }); return; }
    var tmp = document.createElement('div'); tmp.style.cssText = 'position:absolute;inset:0';
    z.appendChild(tmp);
    OraAquarelle.peindre(tmp, 'bas-' + cle, false);
    var calques = Array.prototype.slice.call(tmp.children);
    calques.forEach(function (n) { z.appendChild(n); });
    tmp.remove();
    merBasCache[cle] = { largeur: z.clientWidth, calques: calques };
  }

  function aller(vue) { etat.pile.push({ vue: etat.vue, guide: etat.guide, etape: etat.etape, bible: etat.bible }); etat.vue = vue; rendre(); window.scrollTo(0, 0); }

  function feuille(titre, corpsHtml) {
    fermerFeuille();
    var voile = document.createElement('div'); voile.className = 'voile'; voile.setAttribute('data-action', 'fermer');
    var f = document.createElement('div'); f.className = 'feuille'; f.setAttribute('role', 'dialog'); f.setAttribute('aria-modal', 'true'); f.setAttribute('aria-label', titre);
    f.innerHTML = '<div class="poignee"></div><h2>' + esc(titre) + '</h2>' + corpsHtml + '<div class="actions" style="margin-top:20px"><button class="bouton leger" data-action="fermer">Fermer</button></div>';
    document.body.appendChild(voile); document.body.appendChild(f);
    var b = f.querySelector('button'); if (b) b.focus();
  }
  function fermerFeuille() { document.querySelectorAll('.voile,.feuille').forEach(function (n) { n.remove(); }); }

  function ouvrirPassage(id) {
    var p = id.split('|');
    var cible = { l: p[0], c: +p[1], du: +p[2], au: +p[3] };
    etat.pile.push({ vue: etat.vue, guide: etat.guide, etape: etat.etape, bible: etat.bible });
    etat.vue = 'bible-chapitre'; etat.bible = cible; rendre();
    var el = cible.du && document.getElementById('v' + cible.du);
    if (el) setTimeout(function () { window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - 140)); }, 30);
    else window.scrollTo(0, 0);
    if (!BIBLE) chargerBible().then(function () { setTimeout(function () { var e2 = cible.du && document.getElementById('v' + cible.du); if (e2) window.scrollTo(0, Math.max(0, e2.getBoundingClientRect().top + window.scrollY - 140)); }, 60); });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]'); if (!el) return;
    var act = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    if (act === 'mot') {
      var m = D.lexique.mots.filter(function (x) { return x.id === id; })[0];
      if (m) feuille(m.mot, '<p>' + esc(m.def) + '</p>');
    } else if (act === 'fermer') fermerFeuille();
    else if (act === 'haut') window.scrollTo({ top: 0, behavior: 'smooth' });
    else if (act === 'onglet') { etat.pile = []; etat.vue = id; fermerFeuille(); rendre(); window.scrollTo(0, 0); }
    else if (act === 'aller') aller(id);
    else if (act === 'priere') aller('priere:' + id);
    else if (act === 'lecture') aller('lecture:' + id);
    else if (act === 'livre') { etat.livreOuvert = etat.livreOuvert === id ? null : id; var yb = window.scrollY; rendre(); window.scrollTo(0, yb); }
    else if (act === 'passage') ouvrirPassage(id);
    else if (act === 'verset') {
      var b = etat.bible, v = +id, ms = lireMarques(), L = livre(b.l), i = -1;
      ms.forEach(function (x, k) { if (x.l === L.abr && x.c === b.c && x.v === v) i = k; });
      if (i >= 0) ms.splice(i, 1); else ms.push({ l: L.abr, c: b.c, v: v });
      ecrireMarques(ms); el.classList.toggle('marque', i < 0);
    }
    else if (act === 'guide') { etat.pile.push({ vue: etat.vue, guide: etat.guide, etape: etat.etape, bible: etat.bible }); etat.vue = 'guide'; etat.guide = id; etat.etape = 0; rendre(); window.scrollTo(0, 0); }
    else if (act === 'etape') { etat.etape = +id; rendre(); }
    else if (act === 'retour') { var p = etat.pile.pop() || { vue: 'accueil' }; etat.vue = p.vue; etat.guide = p.guide; etat.bible = p.bible; etat.etape = 0; rendre(); window.scrollTo(0, 0); }
    else if (act === 'niveau') { R.niveau = id; ecrireReglages(); var y = window.scrollY; rendre(); window.scrollTo(0, y); }
    else if (act === 'reglage') { R[el.getAttribute('data-cle')] = id; ecrireReglages(); var y2 = window.scrollY; rendre(); window.scrollTo(0, y2); majVivant(); }
    else if (act === 'explication') {
      var a = aujourdhui(), e = a.expl || a.explSaison, nom = a.expl ? a.j.celebration.nom : a.j.saison.nom;
      feuille(nom, '<div class="bloc" style="border:0;margin-top:8px;padding:0"><h3>Ce que c\'est</h3><p>' + lexique(e.quoi) + '</p></div><div class="bloc"><h3>Pourquoi c\'est important</h3><p>' + lexique(e.pourquoi) + '</p></div><div class="bloc"><h3>Une idée à vivre</h3><p>' + lexique(e.idee) + '</p></div>');
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fermerFeuille(); });
  window.addEventListener('scroll', majDefile, { passive: true });

  // Passe au soir à 19 h (et au jour à 6 h) sans recharger ; change de jour à minuit.
  var jourAffiche = new Date().toDateString();
  setInterval(function () {
    if (document.querySelector('.feuille')) return;
    var change = (estNuit() ? 'nuit' : 'jour') !== dernierCiel || new Date().toDateString() !== jourAffiche;
    if (change) { jourAffiche = new Date().toDateString(); var y = window.scrollY; rendre(); window.scrollTo(0, y); }
  }, 30000);
  var tempo; window.addEventListener('resize', function () {
    clearTimeout(tempo);
    tempo = setTimeout(function () { merBasCache = {}; OraAquarelle.peindre(document.getElementById('couches'), dernierCiel, false, function () { cielPret = true; majVivant(); }); var z = document.getElementById('mer-bas'); if (z) { z.innerHTML = ''; peindreMerBas(dernierCiel); } }, 250);
  });

  // ---------- Chargement des données ----------
  function charger() {
    if (window.ORA_DATA) return Promise.resolve(window.ORA_DATA);
    var f = ['fetes', 'explications', 'prieres', 'lexique', 'conseils', 'jours'];
    return Promise.all(f.map(function (n) { return fetch('data/' + n + '.json').then(function (r) { return r.json(); }); }))
      .then(function (x) { var o = {}; f.forEach(function (n, i) { o[n] = x[i]; }); return o; });
  }
  charger().then(function (d) {
    D = d; rendre();
    // La Bible se charge discrètement en arrière-plan, pour être prête (et gardée hors ligne).
    setTimeout(function () { chargerBible().catch(function () {}); }, 4000);
  }).catch(function () {
    document.getElementById('app').innerHTML = '<section class="vue page" style="padding-top:120px"><h2>Oups</h2><p class="chapeau">Les contenus n\'ont pas pu être chargés. Réessaie dans un instant.</p></section>';
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname.indexOf('github.io') >= 0) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne indisponible ici */ });
  }
})();

</script>
