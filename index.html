es anges de te garder dans toutes tes voies.","es":"Pues Él te ha encomendado a sus ángeles, para que te guarden en todos tus caminos.","en":"For he hath given his angels charge over thee; to keep thee in all thy ways.","src":{"fr":"Ps 91, 11","es":"Sal 91, 11","en":"Ps 91:11"}}},"2027-05-30":{"jour":{"id":"ps23-1","fr":"Le Seigneur est mon pasteur ; je ne manquerai de rien.","es":"El Señor es mi pastor, nada me faltará.","en":"The Lord ruleth me: and I shall want nothing.","src":{"fr":"Ps 23, 1","es":"Sal 23, 1","en":"Ps 23:1"}},"soir":{"id":"ps28-7","fr":"Le Seigneur est ma force et mon bouclier ; en lui s’est confié mon cœur. J’ai été secouru ; aussi mon cœur est dans l’allégresse, et je le louerai par mes cantiques.","es":"El Señor es mi fortaleza y mi escudo; en Él confió mi corazón y fui socorrido. Por eso mi corazón salta de gozo y lo alabo con mi cántico.","en":"The Lord is my helper and my protector: in him hath my heart confided, and I have been helped. And my flesh hath flourished again, and with my will I will give praise to him.","src":{"fr":"Ps 28, 7","es":"Sal 28, 7","en":"Ps 28:7"}},"enfantJour":{"id":"signe-de-croix","fr":"Au nom du Père, et du Fils, et du Saint-Esprit. Amen.","es":"En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.","en":"In the name of the Father, and of the Son, and of the Holy Spirit. Amen.","src":{"fr":"Le signe de croix","es":"La señal de la cruz","en":"The Sign of the Cross"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2027-05-31":{"jour":{"id":"ps62-2","fr":"Oui, à Dieu mon âme en paix s’abandonne, de lui vient mon secours. Oui, il est mon rocher et mon salut ; il est ma forteresse : je ne serai pas tout à fait ébranlé.","es":"Solo en Dios se descansa, oh alma mía, porque la salud viene de Él. Él solo es mi roca, mi salvación, mi defensa: nunca seré conmovido.","en":"Shall not my soul be subject to God? for from him is my salvation. For he is my God and my saviour: he is my protector, I shall be moved no more.","src":{"fr":"Ps 62, 2-3","es":"Sal 62, 2-3","en":"Ps 62:2-3"}},"soir":{"id":"ps31-15","fr":"Et moi, je me confie en toi, Seigneur ; je dis : « Tu es mon Dieu ! » Mes destinées sont dans ta main ; délivre-moi de la main de mes ennemis et de mes persécuteurs !","es":"Pero yo confío en Ti, Señor; digo: “Tú eres mi Dios.” Mi destino está en tu mano; sácame del poder de mis enemigos y de mis perseguidores.","en":"But I have put my trust in thee, O Lord: I said: Thou art my God. My lots are in thy hands. Deliver me out of the hands of my enemies; and from them that persecute me.","src":{"fr":"Ps 31, 15-16","es":"Sal 31, 15-16","en":"Ps 31:15-16"}},"enfantJour":{"id":"1s3-10","fr":"Parlez, car votre serviteur écoute.","es":"Habla, tu siervo escucha.","en":"Speak, Lord, for thy servant heareth.","src":{"fr":"1 S 3, 10","es":"1 Sam 3, 10","en":"1 Sm 3:10"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2027-06-01":{"jour":{"id":"ps73-25","fr":"Quel autre que toi ai-je au ciel ? Avec toi, je ne désire rien sur la terre. Ma chair et mon cœur se consument : le rocher de mon cœur et mon partage, c’est Dieu à jamais.","es":"¿Quién hay para mí en el cielo sino Tú? Y si contigo estoy ¿qué podrá deleitarme en la tierra? La carne y el corazón mío desfallecen, la roca de mi corazón es Dios, herencia mía para siempre.","en":"For what have I in heaven? and besides thee what do I desire upon earth? For thee my flesh and my heart hath fainted away: thou art the God of my heart, and the God that is my portion for ever.","src":{"fr":"Ps 73, 25-26","es":"Sal 73, 25-26","en":"Ps 73:25-26"}},"soir":{"id":"ps37-5","fr":"Remets ton sort au Seigneur et confie-toi en lui : il agira .","es":"Entrega al Señor tu camino; confíate a Él y déjale obrar.","en":"Commit thy way to the Lord, and trust in him, and he will do it.","src":{"fr":"Ps 37, 5","es":"Sal 37, 5","en":"Ps 37:5"}},"enfantJour":{"id":"ps118-24","fr":"Voici le jour que le Seigneur a fait ; livrons-nous à l’allégresse et à la joie.","es":"Este es el día que hizo Señor; alegrémonos por él y celebrémoslo.","en":"This is the day which the Lord hath made: let us be glad and rejoice therein.","src":{"fr":"Ps 118, 24","es":"Sal 118, 24","en":"Ps 118:24"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2027-06-02":{"jour":{"id":"ps84-2","fr":"Que tes demeures sont aimables, Seigneur des armées ! Mon âme s’épuise en soupirant après les parvis de Seigneur ; mon cœur et ma chair tressaillent vers le Dieu vivant.","es":"¡Oh cuan amable es tu morada, Señor de los ejércitos! Suspirando, desfalleciendo, anhela mi alma los atrios del Señor. Mi corazón y mi carne claman ansiosos hacia el Dios vivo.","en":"How lovely are thy tabernacles, O Lord of hosts! my soul longeth and fainteth for the courts of the Lord. My heart and my flesh have rejoiced in the living God.","src":{"fr":"Ps 84, 2-3","es":"Sal 84, 2-3","en":"Ps 84:2-3"}},"soir":{"id":"ps55-23","fr":"Remets ton sort à Seigneur, et il te soutiendra ; il ne laissera pas à jamais chanceler le juste.","es":"Deja tu cuidado a cargo de Señor, y Él te sostendrá. Nunca permitirá que el justo caiga.","en":"Cast thy care upon the Lord, and he shall sustain thee: he shall not suffer the just to waver for ever.","src":{"fr":"Ps 55, 23","es":"Sal 55, 23","en":"Ps 55:23"}},"enfantJour":{"id":"ps136-1","fr":"Célébrez Seigneur, car il est bon, car sa miséricorde est éternelle.","es":"¡Hallelú Yah! Alabad al Señor porque es bueno, porque su misericordia es para siempre.","en":"Alleluia. Praise the Lord, for he is good: for his mercy endureth for ever.","src":{"fr":"Ps 136, 1","es":"Sal 136, 1","en":"Ps 136:1"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2027-06-03":{"jour":{"id":"ps103-1","fr":"Mon âme, bénis Seigneur, et que tout ce qui est en moi bénisse son saint nom ! Mon âme, bénis Seigneur, et n’oublie pas ses nombreux bienfaits.","es":"Bendice a Señor, alma mía, y todo cuanto hay en mí bendiga su santo Nombre. Bendice a Señor, alma mía, y no quieras olvidar todos sus favores.","en":"Bless the Lord, O my soul: and let all that is within me bless his holy name. Bless the Lord, O my soul, and never forget all he hath done for thee.","src":{"fr":"Ps 103, 1-2","es":"Sal 103, 1-2","en":"Ps 103:1-2"}},"soir":{"id":"ps56-4","fr":"Quand je suis dans la crainte, je me confie en toi.","es":"El día en que me invada el temor, confiaré en Ti.","en":"I will trust in thee.","src":{"fr":"Ps 56, 4","es":"Sal 56, 4","en":"Ps 56:4"}},"enfantJour":{"id":"ps139-14","fr":"Je te loue d’avoir fait de moi une créature si merveilleuse ; tes œuvres sont admirables, et mon âme se plaît à le reconnaître.","es":"Te alabo porque te has mostrado maravilloso, porque tus obras son admirables; largamente conoces mi alma.","en":"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.","src":{"fr":"Ps 139, 14","es":"Sal 139, 14","en":"Ps 139:14"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2027-06-04":{"jour":{"id":"ps104-1","fr":"Mon âme, bénis Seigneur ! Seigneur, mon Dieu, tu es infiniment grand, Tu es revêtu de majesté et de splendeur !","es":"¡Bendice a Señor, alma mía! ¡Señor, Dios mío, cuán grande eres! Te has vestido de majestad y de belleza.","en":"Bless the Lord, O my soul: O Lord my God, thou art exceedingly great. Thou hast put on praise and beauty.","src":{"fr":"Ps 104, 1","es":"Sal 104, 1","en":"Ps 104:1"}},"soir":{"id":"ps94-19","fr":"Quand les angoisses s’agitent en foule dans ma pensée, tes consolations réjouissent mon âme.","es":"Cuando las ansiedades se multiplican en mi corazón, tus consuelos deleitan mi alma.","en":"According to the multitude of my sorrows in my heart, thy comforts have given joy to my soul.","src":{"fr":"Ps 94, 19","es":"Sal 94, 19","en":"Ps 94:19"}},"enfantJour":{"id":"gloire-au-pere","fr":"Gloire au Père, et au Fils, et au Saint-Esprit,\ncomme il était au commencement, maintenant et toujours,\net pour les siècles des siècles. Amen.","es":"Gloria al Padre, y al Hijo, y al Espíritu Santo.\nComo era en el principio, ahora y siempre,\npor los siglos de los siglos. Amén.","en":"Glory be to the Father, and to the Son, and to the Holy Spirit,\nas it was in the beginning, is now, and ever shall be,\nworld without end. Amen.","src":{"fr":"Gloire au Père","es":"Gloria","en":"Glory Be"}},"enfantSoir":{"id":"ps121-8","fr":"Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 8","es":"Sal 121, 8","en":"Ps 121:8"}}},"2027-06-05":{"jour":{"id":"ps113-1","fr":"Alleluia ! Louez, serviteurs de Seigneur, louez le nom de Seigneur, Que le nom du Seigneur soit béni, dès maintenant et à jamais ! Du lever du soleil jusqu’à son couchant, loué soit le nom de Seigneur !","es":"¡Hallelú Yah! Alabad, siervos de Señor, alabad el Nombre del Señor. Sea bendito el Nombre de Señor, desde ahora y para siempre. Desde el nacimiento del sol hasta su ocaso sea ensalzado el Nombre del Señor.","en":"Praise the Lord, ye children: praise ye the name of the Lord. Blessed be the name of the Lord, from henceforth now and for ever. From the rising of the sun unto the going down of the same, the name of the Lord is worthy of praise.","src":{"fr":"Ps 113, 1-3","es":"Sal 113, 1-3","en":"Ps 113:1-3"}},"soir":{"id":"ps123-1","fr":"J’élève mes yeux vers toi, ô toi qui siège dans les cieux !","es":"Levanto mis ojos a Ti que habitas en los cielos.","en":"To thee have I lifted up my eyes, who dwellest in heaven.","src":{"fr":"Ps 123, 1","es":"Sal 123, 1","en":"Ps 123:1"}},"enfantJour":{"id":"ps150-6","fr":"Que tout ce qui respire loue Seigneur ! Alleluia.","es":"¡Todo lo que respira alabe al Señor! ¡Hallelú Yah!","en":"Let every spirit praise the Lord. Alleluia.","src":{"fr":"Ps 150, 6","es":"Sal 150, 6","en":"Ps 150:5"}},"enfantSoir":{"id":"ps56-4","fr":"Quand je suis dans la crainte, je me confie en toi.","es":"El día en que me invada el temor, confiaré en Ti.","en":"I will trust in thee.","src":{"fr":"Ps 56, 4","es":"Sal 56, 4","en":"Ps 56:4"}}},"2027-06-06":{"jour":{"id":"ps117","fr":"Nations, louez toutes Seigneur ; peuples, célébrez-le tous ! Car sa bonté pour nous est grande, et la vérité du Seigneur subsiste à jamais. Alleluia !","es":"¡Hallelú Yah! Alabad a Señor, naciones todas, celebradle todos los pueblos; pues su misericordia se ha confirmado sobre nosotros, y la fidelidad del Señor permanece para siempre.","en":"O Praise the Lord, all ye nations: praise him, all ye people. For his mercy is confirmed upon us: and the truth of the Lord remaineth for ever.","src":{"fr":"Ps 117, 1-2","es":"Sal 117, 1-2","en":"Ps 117:1-2"}},"soir":{"id":"ps138-8","fr":"Le Seigneur achèvera ce qu’il a fait pour moi. Seigneur, ta bonté est éternelle : n’abandonne pas l’ouvrage de tes mains !","es":"El Señor acabará para mí lo que ha comenzado. Señor, tu misericordia permanece eternamente; no abandones la obra de tus manos.","en":"The Lord will repay for me: thy mercy, O Lord, endureth for ever: O despise not the works of thy hands.","src":{"fr":"Ps 138, 8","es":"Sal 138, 8","en":"Ps 138:8"}},"enfantJour":{"id":"ps23-1","fr":"Le Seigneur est mon pasteur ; je ne manquerai de rien.","es":"El Señor es mi pastor, nada me faltará.","en":"The Lord ruleth me: and I shall want nothing.","src":{"fr":"Ps 23, 1","es":"Sal 23, 1","en":"Ps 23:1"}},"enfantSoir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el día.","en":"Stay with us, because it is towards evening and the day is now far spent.","src":{"fr":"Lc 24, 29","es":"Lc 24, 29","en":"Lk 24:29"}}},"2027-06-07":{"jour":{"id":"ps146-2","fr":"Toute ma vie, je veux louer Seigneur, tant que je serai, je veux chanter mon Dieu.","es":"Toda mi vida alabaré a Señor; cantaré salmos a mi Dios mientras yo viva.","en":"Praise the Lord, O my soul, in my life I will praise the Lord: I will sing to my God as long as I shall be. Put not your trust in princes.","src":{"fr":"Ps 146, 2","es":"Sal 146, 2","en":"Ps 146:2"}},"soir":{"id":"ps23-4","fr":"Même quand je marche dans une vallée d’ombre mortelle, je ne crains aucun mal, car tu es avec moi : ta houlette et ton bâton me rassurent.","es":"Aunque atraviese un valle de tinieblas, no temeré ningún mal, porque Tú vas conmigo. Tu bastón y tu cayado me infunden aliento.","en":"For though I should walk in the midst of the shadow of death, I will fear no evils, for thou art with me. Thy rod and thy staff, they have comforted me.","src":{"fr":"Ps 23, 4","es":"Sal 23, 4","en":"Ps 23:4"}},"enfantJour":{"id":"ps121-2","fr":"Mon secours viendra de Seigneur, qui a fait le ciel et la terre.","es":"Mi socorro viene del Señor que creó el cielo y la tierra.","en":"My help is from the Lord, who made heaven and earth.","src":{"fr":"Ps 121, 2","es":"Sal 121, 2","en":"Ps 121:2"}},"enfantSoir":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}}},"2027-06-08":{"jour":{"id":"ps150-6","fr":"Que tout ce qui respire loue Seigneur ! Alleluia.","es":"¡Todo lo que respira alabe al Señor! ¡Hallelú Yah!","en":"Let every spirit praise the Lord. Alleluia.","src":{"fr":"Ps 150, 6","es":"Sal 150, 6","en":"Ps 150:5"}},"soir":{"id":"ps27-13","fr":"Ah ! si je ne croyais pas voir la bonté de Seigneur, dans la terre des vivants… Espère dans le Seigneur ! Aie courage et que ton cœur soit ferme ! Espère dans le Seigneur !","es":"¡Ah, si no creyera yo que veré los bienes del Señor en la tierra de los vivientes! ¡Aguarda al Señor y ten ánimo; aliéntese tu corazón y aguarde a Señor!","en":"I believe to see the good things of the Lord in the land of the living. Expect the Lord, do manfully, and let thy heart take courage, and wait thou for the Lord.","src":{"fr":"Ps 27, 13-14","es":"Sal 27, 13-14","en":"Ps 27:13-14"}},"enfantJour":{"id":"jn21-17","fr":"Seigneur, vous connaissez toutes choses, vous savez bien que je vous aime.","es":"Señor, Tú lo sabes todo. Tú sabes que yo te quiero.","en":"Lord, thou knowest all things: thou knowest that I love thee.","src":{"fr":"Jn 21, 17","es":"Jn 21, 17","en":"Jn 21:17"}},"enfantSoir":{"id":"ps91-11","fr":"Car il ordonnera à ses anges de te garder dans toutes tes voies.","es":"Pues Él te ha encomendado a sus ángeles, para que te guarden en todos tus caminos.","en":"For he hath given his angels charge over thee; to keep thee in all thy ways.","src":{"fr":"Ps 91, 11","es":"Sal 91, 11","en":"Ps 91:11"}}},"2027-06-09":{"jour":{"id":"ps8-2","fr":"Seigneur, notre Seigneur, que ton nom est glorieux sur toute la terre ! Toi qui as revêtu les cieux de ta majesté !","es":"¡Oh Señor, Señor nuestro, cuán admirable es tu Nombre en toda la tierra! Tú, cuya gloria cantan los cielos.","en":"O Lord, our Lord, how admirable is thy name in the whole earth! For thy magnificence is elevated above the heavens.","src":{"fr":"Ps 8, 2","es":"Sal 8, 2","en":"Ps 8:2"}},"soir":{"id":"ps130-3","fr":"Si tu gardes le souvenir de l’iniquité, Seigneur, Seigneur, qui pourra subsister ? Mais auprès de toi est le pardon, afin qu’on te révère.","es":"Si Tú recordaras las iniquidades, oh Yah, Señor ¿quién quedaría en pie? Mas en Ti esta el perdón de los pecados, a fin de que se te venere.","en":"If thou, O Lord, wilt mark iniquities: Lord, who shall stand it. For with thee there is merciful forgiveness: and by reason of thy law, I have waited for thee, O Lord. My soul hath relied on his word.","src":{"fr":"Ps 130, 3-4","es":"Sal 130, 3-4","en":"Ps 130:3-4"}},"enfantJour":{"id":"ps8-2","fr":"Seigneur, notre Seigneur, que ton nom est glorieux sur toute la terre ! Toi qui as revêtu les cieux de ta majesté !","es":"¡Oh Señor, Señor nuestro, cuán admirable es tu Nombre en toda la tierra! Tú, cuya gloria cantan los cielos.","en":"O Lord, our Lord, how admirable is thy name in the whole earth! For thy magnificence is elevated above the heavens.","src":{"fr":"Ps 8, 2","es":"Sal 8, 2","en":"Ps 8:2"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2027-06-10":{"jour":{"id":"ps33-22","fr":"Seigneur, que ta grâce soit sur nous, comme nous espérons en toi !","es":"Sea, Señor, sobre nosotros tu misericordia, según lo esperamos de Ti.","en":"Let thy mercy, O Lord, be upon us, as we have hoped in thee.","src":{"fr":"Ps 33, 22","es":"Sal 33, 22","en":"Ps 33:22"}},"soir":{"id":"ps102-2","fr":"Le Seigneur écoute ma prière, et que mon cri arrive jusqu’à toi.","es":"Escucha, Señor, mi oración, y llegue a Ti mi clamor.","en":"Hear, O Lord, my prayer: and let my cry come to thee.","src":{"fr":"Ps 102, 2","es":"Sal 102, 2","en":"Ps 102:2"}},"enfantJour":{"id":"ps100-2","fr":"Servez le Seigneur avec joie, venez en sa présence avec allégresse !","es":"Aclamad a Señor, tierras todas, servid al Señor con alegría, llegaos a su presencia con exultación.","en":"Sing joyfully to God, all the earth: serve ye the Lord with gladness. Come in before his presence with exceeding great joy.","src":{"fr":"Ps 100, 2","es":"Sal 100, 2","en":"Ps 100:2"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2027-06-11":{"jour":{"id":"ps34-2","fr":"Je veux bénir le Seigneur en tout temps ; sa louange sera toujours dans ma bouche.","es":"Quiero bendecir al Señor en todo tiempo, tener siempre en mi boca su alabanza.","en":"I will bless the Lord at all times, his praise shall be always in my mouth.","src":{"fr":"Ps 34, 2","es":"Sal 34, 2","en":"Ps 34:2"}},"soir":{"id":"ps39-5","fr":"Fais-moi connaître, Seigneur, quel est le terme de ma vie ; quelle est la mesure de mes jours ; que je sache combien je suis périssable.","es":"Hazme saber, Señor, cuál es mi fin, y cuál el número de mis días, para que entienda cuan caduco soy.","en":"O Lord, make me know my end. And what is the number of my days: that I may know what is wanting to me.","src":{"fr":"Ps 39, 5","es":"Sal 39, 5","en":"Ps 39:5"}},"enfantJour":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2027-06-12":{"jour":{"id":"ps36-6","fr":"Seigneur, ta bonté atteint jusqu’aux cieux, ta fidélité jusqu’aux nues.","es":"Señor, tu misericordia toca el cielo; tu fidelidad, las nubes.","en":"O Lord, thy mercy is in heaven, and thy truth reacheth even to the clouds.","src":{"fr":"Ps 36, 6","es":"Sal 36, 6","en":"Ps 36:6"}},"soir":{"id":"ps142-6","fr":"Je crie vers toi, Seigneur, je dis : Tu es mon refuge, mon partage sur la terre des vivants !","es":"A Ti, pues, clamo, Señor, diciendo: “Mi refugio eres Tú, herencia mía en la tierra de los vivientes.","en":"I cried to thee, O Lord: I said: Thou art my hope, my portion in the land of the living.","src":{"fr":"Ps 142, 6","es":"Sal 142, 6","en":"Ps 142:6"}},"enfantJour":{"id":"ps34-2","fr":"Je veux bénir le Seigneur en tout temps ; sa louange sera toujours dans ma bouche.","es":"Quiero bendecir al Señor en todo tiempo, tener siempre en mi boca su alabanza.","en":"I will bless the Lord at all times, his praise shall be always in my mouth.","src":{"fr":"Ps 34, 2","es":"Sal 34, 2","en":"Ps 34:2"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2027-06-13":{"jour":{"id":"ps42-2","fr":"Comme le cerf soupire après les sources d’eau, ainsi mon âme soupire après toi, ô Dieu. Mon âme a soif de Dieu, du Dieu vivant : quand irai-je et paraîtrai-je devant la face de Dieu ?","es":"Como el ciervo ansía las corrientes de aguas, así mi alma suspira por Ti, oh Dios, porque mi alma tiene sed de Dios, del Dios vivo. ¿Cuándo vendré y estaré en la presencia de Dios?","en":"As the hart panteth after the fountains of water; so my soul panteth after thee, O God. My soul hath thirsted after the strong living God; when shall I come and appear before the face of God?","src":{"fr":"Ps 42, 2-3","es":"Sal 42, 2-3","en":"Ps 42:2-3"}},"soir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}},"enfantJour":{"id":"signe-de-croix","fr":"Au nom du Père, et du Fils, et du Saint-Esprit. Amen.","es":"En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.","en":"In the name of the Father, and of the Son, and of the Holy Spirit. Amen.","src":{"fr":"Le signe de croix","es":"La señal de la cruz","en":"The Sign of the Cross"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2027-06-14":{"jour":{"id":"ps61-2","fr":"Ô Dieu, entends mes cris, sois attentif à ma prière. De l’extrémité de la terre je crie vers toi, dans l’angoisse de mon cœur ; conduis-moi sur le rocher que je ne puis atteindre.","es":"Escucha, oh Dios, mi grito, atiende a mi oración. Desde los confines de la tierra clamo a Ti, con el corazón desfallecido; Tú me alzarás hasta la roca, me darás el reposo.","en":"Hear, O God, my supplication: be attentive to my prayer. To thee have I cried from the ends of the earth: when my heart was in anguish, thou hast exalted me on a rock. Thou hast conducted me.","src":{"fr":"Ps 61, 2-3","es":"Sal 61, 2-3","en":"Ps 61:2-3"}},"soir":{"id":"ps141-2","fr":"Que ma prière soit devant ta face comme l’encens, et l’élévation de mes mains comme l’offrande du soir !","es":"Como el incienso, suba hacia Ti mi oración; sea la elevación de mis manos el sacrificio vespertino.","en":"Let my prayer be directed as incense in thy sight; the lifting up of my hands, as evening sacrifice.","src":{"fr":"Ps 141, 2","es":"Sal 141, 2","en":"Ps 141:2"}},"enfantJour":{"id":"1s3-10","fr":"Parlez, car votre serviteur écoute.","es":"Habla, tu siervo escucha.","en":"Speak, Lord, for thy servant heareth.","src":{"fr":"1 S 3, 10","es":"1 Sam 3, 10","en":"1 Sm 3:10"}},"enfantSoir":{"id":"ps121-8","fr":"Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 8","es":"Sal 121, 8","en":"Ps 121:8"}}},"2027-06-15":{"jour":{"id":"ps67-2","fr":"Que Dieu nous soit favorable et qu’il nous bénisse ! qu’il fasse luire sur nous sa face.","es":"Dios tenga misericordia de nosotros y bendíganos; vuelva hacia nosotros su rostro sereno.","en":"May God have mercy on us, and bless us: may he cause the light of his countenance to shine upon us, and may he have mercy on us.","src":{"fr":"Ps 67, 2","es":"Sal 67, 2","en":"Ps 67:2"}},"soir":{"id":"ps31-6","fr":"Entre tes mains je remets mon esprit ; tu me délivreras, Seigneur, Dieu de vérité !","es":"En tus manos encomiendo mi espíritu. ¡Tú me redimirás, oh Señor, Dios fiel!","en":"Into thy hands I commend my spirit: thou hast redeemed me, O Lord, the God of truth.","src":{"fr":"Ps 31, 6","es":"Sal 31, 6","en":"Ps 31:6"}},"enfantJour":{"id":"ps118-24","fr":"Voici le jour que le Seigneur a fait ; livrons-nous à l’allégresse et à la joie.","es":"Este es el día que hizo Señor; alegrémonos por él y celebrémoslo.","en":"This is the day which the Lord hath made: let us be glad and rejoice therein.","src":{"fr":"Ps 118, 24","es":"Sal 118, 24","en":"Ps 118:24"}},"enfantSoir":{"id":"ps56-4","fr":"Quand je suis dans la crainte, je me confie en toi.","es":"El día en que me invada el temor, confiaré en Ti.","en":"I will trust in thee.","src":{"fr":"Ps 56, 4","es":"Sal 56, 4","en":"Ps 56:4"}}},"2027-06-16":{"jour":{"id":"ps85-8","fr":"Seigneur, fais-nous voir ta bonté, et accorde-nous ton salut.","es":"Muéstranos, Señor, tu misericordia y envíanos tu salvación.","en":"Shew us, O Lord, thy mercy; and grant us thy salvation.","src":{"fr":"Ps 85, 8","es":"Sal 85, 8","en":"Ps 85:8"}},"soir":{"id":"ps91-1","fr":"Celui qui s’abrite sous la protection du Très-Haut repose à l’ombre du Tout-Puissant. Je dis au Seigneur : « Tu es mon refuge et ma forteresse, mon Dieu en qui je me confie.","es":"Tú que te abrigas en el retiro del Altísimo, y descansas a la sombra del Omnipotente, di al Señor: “¡Refugio mío y fortaleza mía, mi Dios, en quien confío!","en":"He that dwelleth in the aid of the most High, shall abide under the protection of the God of Jacob. He shall say to the Lord: Thou art my protector, and my refuge: my God, in him will I trust.","src":{"fr":"Ps 91, 1-2","es":"Sal 91, 1-2","en":"Ps 91:1-2"}},"enfantJour":{"id":"ps136-1","fr":"Célébrez Seigneur, car il est bon, car sa miséricorde est éternelle.","es":"¡Hallelú Yah! Alabad al Señor porque es bueno, porque su misericordia es para siempre.","en":"Alleluia. Praise the Lord, for he is good: for his mercy endureth for ever.","src":{"fr":"Ps 136, 1","es":"Sal 136, 1","en":"Ps 136:1"}},"enfantSoir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el día.","en":"Stay with us, because it is towards evening and the day is now far spent.","src":{"fr":"Lc 24, 29","es":"Lc 24, 29","en":"Lk 24:29"}}},"2027-06-17":{"jour":{"id":"ps89-2","fr":"Je veux chanter à jamais les bontés de Seigneur ; à toutes les générations ma bouche fera connaître ta fidélité.","es":"Quiero cantar eternamente las misericordias de Señor; que mi boca anuncie tu fidelidad de generación en generación.","en":"The mercies of the Lord I will sing for ever. I will shew forth thy truth with my mouth to generation and generation.","src":{"fr":"Ps 89, 2","es":"Sal 89, 2","en":"Ps 89:2"}},"soir":{"id":"ps16-1","fr":"Garde-moi ô Dieu, car près de toi je me réfugie.","es":"Presérvame, oh Dios, pues me refugio en Ti.","en":"Preserve me, O Lord, for I have put my trust in thee.","src":{"fr":"Ps 16, 1","es":"Sal 16, 1","en":"Ps 16:1"}},"enfantJour":{"id":"ps139-14","fr":"Je te loue d’avoir fait de moi une créature si merveilleuse ; tes œuvres sont admirables, et mon âme se plaît à le reconnaître.","es":"Te alabo porque te has mostrado maravilloso, porque tus obras son admirables; largamente conoces mi alma.","en":"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.","src":{"fr":"Ps 139, 14","es":"Sal 139, 14","en":"Ps 139:14"}},"enfantSoir":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}}},"2027-06-18":{"jour":{"id":"ps95-1","fr":"Venez, chantons avec allégresse à Seigneur ! Poussons des cris de joie vers le Rocher de notre salut !","es":"Venid, alegrémonos para Señor; aclamemos a la Roca de nuestra salvación.","en":"Come let us praise the Lord with joy: let us joyfully sing to God our saviour.","src":{"fr":"Ps 95, 1","es":"Sal 95, 1","en":"Ps 95:1"}},"soir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}},"enfantJour":{"id":"gloire-au-pere","fr":"Gloire au Père, et au Fils, et au Saint-Esprit,\ncomme il était au commencement, maintenant et toujours,\net pour les siècles des siècles. Amen.","es":"Gloria al Padre, y al Hijo, y al Espíritu Santo.\nComo era en el principio, ahora y siempre,\npor los siglos de los siglos. Amén.","en":"Glory be to the Father, and to the Son, and to the Holy Spirit,\nas it was in the beginning, is now, and ever shall be,\nworld without end. Amen.","src":{"fr":"Gloire au Père","es":"Gloria","en":"Glory Be"}},"enfantSoir":{"id":"ps91-11","fr":"Car il ordonnera à ses anges de te garder dans toutes tes voies.","es":"Pues Él te ha encomendado a sus ángeles, para que te guarden en todos tus caminos.","en":"For he hath given his angels charge over thee; to keep thee in all thy ways.","src":{"fr":"Ps 91, 11","es":"Sal 91, 11","en":"Ps 91:11"}}},"2027-06-19":{"jour":{"id":"ps100-1","fr":"Poussez des cris de joie vers Seigneur, vous, habitants de toute la terre ! Servez le Seigneur avec joie, venez en sa présence avec allégresse !","es":"Aclamad a Señor, tierras todas, servid al Señor con alegría, llegaos a su presencia con exultación.","en":"Sing joyfully to God, all the earth: serve ye the Lord with gladness. Come in before his presence with exceeding great joy.","src":{"fr":"Ps 100, 1-2","es":"Sal 100, 1-2","en":"Ps 100:1-2"}},"soir":{"id":"ps63-7","fr":"Quand je pense à toi sur ma couche, je médite sur toi pendant les veilles de la nuit. Car tu es mon secours, et je suis dans l’allégresse à l’ombre de tes ailes.","es":"Cada vez que me acuerde de Ti en mi lecho y en mis insomnios medite sobre Ti; porque en verdad Tú te hiciste mi amparo, y a la sombra de tus alas me siento feliz.","en":"If I have remembered thee upon my bed, I will meditate on thee in the morning: Because thou hast been my helper. And I will rejoice under the cover of thy wings.","src":{"fr":"Ps 63, 7-8","es":"Sal 63, 7-8","en":"Ps 63:7-8"}},"enfantJour":{"id":"ps150-6","fr":"Que tout ce qui respire loue Seigneur ! Alleluia.","es":"¡Todo lo que respira alabe al Señor! ¡Hallelú Yah!","en":"Let every spirit praise the Lord. Alleluia.","src":{"fr":"Ps 150, 6","es":"Sal 150, 6","en":"Ps 150:5"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2027-06-20":{"jour":{"id":"ps116-1","fr":"Je l’aime, car le Seigneur entend ma voix, mes supplications. Car il a incliné vers moi son oreille, et toute ma vie, je l’invoquerai.","es":"¡Hallelú Yah! Yo lo amo, porque el Señor escucha mi voz, mi súplica; porque inclinó hacia mí su oído el día en que lo invoqué.","en":"I have loved, because the Lord will hear the voice of my prayer. Because he hath inclined his ear unto me: and in my days I will call upon him.","src":{"fr":"Ps 116, 1-2","es":"Sal 116, 1-2","en":"Ps 116:1-2"}},"soir":{"id":"ps119-55","fr":"La nuit je me rappelle ton nom, Seigneur, et j’observe ta loi.","es":"Durante la noche me acuerdo de tu nombre, oh Señor, y guardaré tu Ley.","en":"In the night I have remembered thy name, O Lord: and have kept thy law.","src":{"fr":"Ps 119, 55","es":"Sal 119, 55","en":"Ps 119:55"}},"enfantJour":{"id":"ps23-1","fr":"Le Seigneur est mon pasteur ; je ne manquerai de rien.","es":"El Señor es mi pastor, nada me faltará.","en":"The Lord ruleth me: and I shall want nothing.","src":{"fr":"Ps 23, 1","es":"Sal 23, 1","en":"Ps 23:1"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2027-06-21":{"jour":{"id":"ps119-18","fr":"Ouvre mes yeux, pour que je contemple les merveilles de ta loi.","es":"Quita el velo a mis ojos, para que descubra las maravillas de tu Ley.","en":"Open thou my eyes: and I will consider the wondrous things of thy law.","src":{"fr":"Ps 119, 18","es":"Sal 119, 18","en":"Ps 119:18"}},"soir":{"id":"ps121-7","fr":"Le Seigneur te gardera de tout mal, il gardera ton âme : Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"Presérvete el Señor de todo mal; Él guarde tu alma. El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"The Lord keepeth thee from all evil: may the Lord keep thy soul. May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 7-8","es":"Sal 121, 7-8","en":"Ps 121:7-8"}},"enfantJour":{"id":"ps121-2","fr":"Mon secours viendra de Seigneur, qui a fait le ciel et la terre.","es":"Mi socorro viene del Señor que creó el cielo y la tierra.","en":"My help is from the Lord, who made heaven and earth.","src":{"fr":"Ps 121, 2","es":"Sal 121, 2","en":"Ps 121:2"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2027-06-22":{"jour":{"id":"ps121-1","fr":"Je lève les yeux vers les montagnes : d’où me viendra le secours ? Mon secours viendra de Seigneur, qui a fait le ciel et la terre.","es":"Alzo mis ojos hacia los montes: ¿De dónde me vendrá el socorro? Mi socorro viene del Señor que creó el cielo y la tierra.","en":"I have lifted up my eyes to the mountains, from whence help shall come to me. My help is from the Lord, who made heaven and earth.","src":{"fr":"Ps 121, 1-2","es":"Sal 121, 1-2","en":"Ps 121:1-2"}},"soir":{"id":"ps134","fr":"Voici donc, bénissez Seigneur, vous tous, serviteurs de Seigneur, qui êtes de service dans la maison de Seigneur, pendant les nuits !… Levez les mains vers le sanctuaire, et bénissez le Seigneur.","es":"Ea, bendecid a Señor, todos los siervos de Señor, los que estáis en la casa de Señor, en las horas de la noche. Alzad vuestras manos hacia el Santuario, y bendecid al Señor.","en":"Behold now bless ye the Lord, all ye servants of the Lord: Who stand in the house of the Lord, in the courts of the house of our God. In the nights lift up your hands to the holy places, and bless ye the Lord.","src":{"fr":"Ps 134, 1-2","es":"Sal 134, 1-2","en":"Ps 134:1-2"}},"enfantJour":{"id":"jn21-17","fr":"Seigneur, vous connaissez toutes choses, vous savez bien que je vous aime.","es":"Señor, Tú lo sabes todo. Tú sabes que yo te quiero.","en":"Lord, thou knowest all things: thou knowest that I love thee.","src":{"fr":"Jn 21, 17","es":"Jn 21, 17","en":"Jn 21:17"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2027-06-23":{"jour":{"id":"ps122-1","fr":"J’ai été dans la joie quand on m’a dit : « Allons à la maison de Seigneur !","es":"Me llené de gozo cuando me dijeron: “Iremos a la Casa del Señor.","en":"I rejoiced at the things that were said to me: We shall go into the house of the Lord.","src":{"fr":"Ps 122, 1","es":"Sal 122, 1","en":"Ps 122:1"}},"soir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}},"enfantJour":{"id":"ps8-2","fr":"Seigneur, notre Seigneur, que ton nom est glorieux sur toute la terre ! Toi qui as revêtu les cieux de ta majesté !","es":"¡Oh Señor, Señor nuestro, cuán admirable es tu Nombre en toda la tierra! Tú, cuya gloria cantan los cielos.","en":"O Lord, our Lord, how admirable is thy name in the whole earth! For thy magnificence is elevated above the heavens.","src":{"fr":"Ps 8, 2","es":"Sal 8, 2","en":"Ps 8:2"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2027-06-24":{"jour":{"id":"ps131-1","fr":"Seigneur, mon cœur ne s’est pas enflé d’orgueil, et mes regards n’ont pas été hautains. Je ne recherche point les grandes choses, ni ce qui est élevé au-dessus de moi. Non ! Je tiens mon âme dans le calme et le silence. Comme un enfant sevré sur le sein de sa mère, comme l’enfant sevré mon âme est en moi.","es":"Señor, mi corazón (ya) no se engríe ni son altaneros mis ojos. No ando tras de grandezas ni en planes muy difíciles para mí; lejos de eso, he hecho a mi alma quieta y apaciguada como un niño que se recuesta sobre el pecho de su madre; como ese niño, está mi alma en mí.","en":"Lord, my heart is not exalted: nor are my eyes lofty. Neither have I walked in great matters, nor in wonderful things above me. If I was not humbly minded, but exalted my soul: As a child that is weaned is towards his mother, so reward in my soul.","src":{"fr":"Ps 131, 1-2","es":"Sal 131, 1-2","en":"Ps 131:1-2"}},"soir":{"id":"ps51-3","fr":"Aie pitié de moi, ô Dieu, selon ta bonté ; selon ta grande miséricorde efface mes transgressions. Lave-moi complètement de mon iniquité, et purifie-moi de mon péché.","es":"Ten compasión de mí, oh Dios, en la medida de tu misericordia; según la grandeza de tus bondades, borra mi iniquidad. Lávame a fondo de mi culpa, límpiame de mi pecado.","en":"Have mercy on me, O God, according to thy great mercy. And according to the multitude of thy tender mercies blot out my iniquity. Wash me yet more from my iniquity, and cleanse me from my sin.","src":{"fr":"Ps 51, 3-4","es":"Sal 51, 3-4","en":"Ps 51:3-4"}},"enfantJour":{"id":"ps100-2","fr":"Servez le Seigneur avec joie, venez en sa présence avec allégresse !","es":"Aclamad a Señor, tierras todas, servid al Señor con alegría, llegaos a su presencia con exultación.","en":"Sing joyfully to God, all the earth: serve ye the Lord with gladness. Come in before his presence with exceeding great joy.","src":{"fr":"Ps 100, 2","es":"Sal 100, 2","en":"Ps 100:2"}},"enfantSoir":{"id":"ps121-8","fr":"Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 8","es":"Sal 121, 8","en":"Ps 121:8"}}},"2027-06-25":{"jour":{"id":"ps139-1","fr":"Seigneur, tu me sondes et tu me connais, tu sais quand je suis assis ou levé, tu découvres ma pensée de loin. Tu m’observes quand je suis en marche ou couché, et toutes mes voies te sont familières.","es":"Señor, Tú me penetras y me conoces. Sabes cuando me siento y cuando me levanto; de lejos disciernes mis pensamientos. Si ando y si descanso Tú lo percibes, y todos mis caminos te son familiares.","en":"Lord, thou hast proved me, and known me: Thou hast known my sitting down, and my rising up. Thou hast understood my thoughts afar off: my path and my line thou hast searched out.","src":{"fr":"Ps 139, 1-3","es":"Sal 139, 1-3","en":"Ps 139:1-3"}},"soir":{"id":"ps86-1","fr":"Prête l’oreille, Seigneur, exauce-moi, car je suis malheureux et indigent. Garde mon âme, car je suis pieux ; sauve ton serviteur, ô mon Dieu ; il met sa confiance en toi.","es":"Inclina, Señor, tu oído y escúchame, porque soy desvalido y necesitado. Preserva mi vida porque soy santo; salva a tu siervo que espera en Ti.","en":"Incline thy ear, O Lord, and hear me: for I am needy and poor. Preserve my soul, for I am holy: save thy servant, O my God, that trusteth in thee.","src":{"fr":"Ps 86, 1-2","es":"Sal 86, 1-2","en":"Ps 86:1-2"}},"enfantJour":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}},"enfantSoir":{"id":"ps56-4","fr":"Quand je suis dans la crainte, je me confie en toi.","es":"El día en que me invada el temor, confiaré en Ti.","en":"I will trust in thee.","src":{"fr":"Ps 56, 4","es":"Sal 56, 4","en":"Ps 56:4"}}},"2027-06-26":{"jour":{"id":"ps141-3","fr":"Seigneur, mets une garde à ma bouche, une sentinelle à la porte de mes lèvres.","es":"Pon, Señor, una guardia ante mi boca, un cerrojo en la puerta de mis labios.","en":"Set a watch, O Lord, before my mouth: and a door round about my lips.","src":{"fr":"Ps 141, 3","es":"Sal 141, 3","en":"Ps 141:3"}},"soir":{"id":"ps88-2","fr":"Seigneur, Dieu de mon salut, quand je crie la nuit devant toi, que ma prière arrive en ta présence, prête l’oreille à mes supplications !","es":"Señor, Dios de mi salud, día y noche clamo en tu presencia. Llegue hasta Ti mi oración, inclina tu oído a mi clamor.","en":"O Lord, the God of my salvation: I have cried in the day, and in the night before thee. Let my prayer come in before thee: incline thy ear to my petition.","src":{"fr":"Ps 88, 2-3","es":"Sal 88, 2-3","en":"Ps 88:2-3"}},"enfantJour":{"id":"ps34-2","fr":"Je veux bénir le Seigneur en tout temps ; sa louange sera toujours dans ma bouche.","es":"Quiero bendecir al Señor en todo tiempo, tener siempre en mi boca su alabanza.","en":"I will bless the Lord at all times, his praise shall be always in my mouth.","src":{"fr":"Ps 34, 2","es":"Sal 34, 2","en":"Ps 34:2"}},"enfantSoir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el día.","en":"Stay with us, because it is towards evening and the day is now far spent.","src":{"fr":"Lc 24, 29","es":"Lc 24, 29","en":"Lk 24:29"}}},"2027-06-27":{"jour":{"id":"ps148-1","fr":"Alleluia ! Louez le Seigneur du haut des cieux, louez-le dans les hauteurs !","es":"¡Hallelú Yah! Alabad al Señor desde los cielos, alabadlo en las alturas.","en":"Praise ye the Lord from the heavens: praise ye him in the high places.","src":{"fr":"Ps 148, 1","es":"Sal 148, 1","en":"Ps 148:1"}},"soir":{"id":"ps103-13","fr":"Comme un père a compassion de ses enfants, Seigneur a compassion de ceux qui le craignent.","es":"Como un padre que se apiada de sus hijos, así el Señor se compadece de los que le temen.","en":"As a father hath compassion on his children, so hath the Lord compassion on them that fear him.","src":{"fr":"Ps 103, 13","es":"Sal 103, 13","en":"Ps 103:13"}},"enfantJour":{"id":"signe-de-croix","fr":"Au nom du Père, et du Fils, et du Saint-Esprit. Amen.","es":"En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.","en":"In the name of the Father, and of the Son, and of the Holy Spirit. Amen.","src":{"fr":"Le signe de croix","es":"La señal de la cruz","en":"The Sign of the Cross"}},"enfantSoir":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}}},"2027-06-28":{"jour":{"id":"ps57-8","fr":"Mon cœur est affermi, ô Dieu, mon cœur est affermi ; je chanterai et ferai retentir de joyeux instruments. Éveille-toi, ma gloire ! Éveillez-vous, ma lyre et ma harpe ! Que j’éveille l’aurore !","es":"Mi corazón está pronto, oh Dios; firme está mi corazón; quiero cantar y entonar salmos. Despierta, oh alma mía; salterio y cítara despertaos; despertaré a la aurora.","en":"My heart is ready, O God, my heart is ready: I will sing, and rehearse a psalm. Arise, O my glory, arise psaltery and harp: I will arise early.","src":{"fr":"Ps 57, 8-9","es":"Sal 57, 8-9","en":"Ps 57:8-9"}},"soir":{"id":"ps116-7","fr":"Mon âme, retourne à ton repos ; car le Seigneur te comble de biens.","es":"Vuelve, alma mía, a tu sosiego, porque el Señor te ha favorecido.","en":"Turn, O my soul, into thy rest: for the Lord hath been bountiful to thee.","src":{"fr":"Ps 116, 7","es":"Sal 116, 7","en":"Ps 116:7"}},"enfantJour":{"id":"1s3-10","fr":"Parlez, car votre serviteur écoute.","es":"Habla, tu siervo escucha.","en":"Speak, Lord, for thy servant heareth.","src":{"fr":"1 S 3, 10","es":"1 Sam 3, 10","en":"1 Sm 3:10"}},"enfantSoir":{"id":"ps91-11","fr":"Car il ordonnera à ses anges de te garder dans toutes tes voies.","es":"Pues Él te ha encomendado a sus ángeles, para que te guarden en todos tus caminos.","en":"For he hath given his angels charge over thee; to keep thee in all thy ways.","src":{"fr":"Ps 91, 11","es":"Sal 91, 11","en":"Ps 91:11"}}},"2027-06-29":{"jour":{"id":"ps31-4","fr":"Car tu es mon rocher, ma forteresse, et à cause de ton nom tu me conduiras et me dirigeras.","es":"Porque Tú eres mi peña y mi baluarte, y por la gloria de tu nombre, cuidarás de mí y me conducirás.","en":"For thou art my strength and my refuge; and for thy name's sake thou wilt lead me, and nourish me.","src":{"fr":"Ps 31, 4","es":"Sal 31, 4","en":"Ps 31:4"}},"soir":{"id":"ps130-1","fr":"Du fond de l’abîme je crie vers toi, Seigneur. Seigneur, écoute ma voix ; que tes oreilles soient attentives aux accents de ma prière !","es":"Desde lo más profundo clamo a Ti, Señor, Señor, oye mi voz. Estén tus oídos atentos al grito de mi súplica.","en":"Out of the depths I have cried to thee, O Lord: Lord, hear my voice. Let thy ears be attentive to the voice of my supplication.","src":{"fr":"Ps 130, 1-2","es":"Sal 130, 1-2","en":"Ps 130:1-2"}},"enfantJour":{"id":"ps118-24","fr":"Voici le jour que le Seigneur a fait ; livrons-nous à l’allégresse et à la joie.","es":"Este es el día que hizo Señor; alegrémonos por él y celebrémoslo.","en":"This is the day which the Lord hath made: let us be glad and rejoice therein.","src":{"fr":"Ps 118, 24","es":"Sal 118, 24","en":"Ps 118:24"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2027-06-30":{"jour":{"id":"lc1-46","fr":"Mon âme glorifie le Seigneur. Et mon esprit tressaille de joie en Dieu, mon Sauveur.","es":"Glorifica mi alma al Señor, y mi espíritu se goza en Dios mi Salvador.","en":"My soul doth magnify the Lord. And my spirit hath rejoiced in God my Saviour.","src":{"fr":"Lc 1, 46-47","es":"Lc 1, 46-47","en":"Lk 1:46-47"}},"soir":{"id":"ps130-5","fr":"J’espère dans le Seigneur ; mon âme espère, et j’attends sa parole. Mon âme aspire après le Seigneur plus que les guetteurs n’aspirent après l’aurore.","es":"Espero en el Señor, mi alma confía en su palabra. Aguardando está mi alma al Señor, más que los centinelas el alba. Más que los centinelas con la aurora.","en":"My soul hath hoped in the Lord. From the morning watch even until night, let Israel hope in the Lord.","src":{"fr":"Ps 130, 5-6","es":"Sal 130, 5-6","en":"Ps 130:5-6"}},"enfantJour":{"id":"ps136-1","fr":"Célébrez Seigneur, car il est bon, car sa miséricorde est éternelle.","es":"¡Hallelú Yah! Alabad al Señor porque es bueno, porque su misericordia es para siempre.","en":"Alleluia. Praise the Lord, for he is good: for his mercy endureth for ever.","src":{"fr":"Ps 136, 1","es":"Sal 136, 1","en":"Ps 136:1"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2027-07-01":{"jour":{"id":"1s3-10","fr":"Parlez, car votre serviteur écoute.","es":"Habla, tu siervo escucha.","en":"Speak, Lord, for thy servant heareth.","src":{"fr":"1 S 3, 10","es":"1 Sam 3, 10","en":"1 Sm 3:10"}},"soir":{"id":"ps131-2","fr":"Non ! Je tiens mon âme dans le calme et le silence. Comme un enfant sevré sur le sein de sa mère, comme l’enfant sevré mon âme est en moi.","es":"Lejos de eso, he hecho a mi alma quieta y apaciguada como un niño que se recuesta sobre el pecho de su madre; como ese niño, está mi alma en mí.","en":"As a child that is weaned is towards his mother, so reward in my soul.","src":{"fr":"Ps 131, 2","es":"Sal 131, 2","en":"Ps 131:2"}},"enfantJour":{"id":"ps139-14","fr":"Je te loue d’avoir fait de moi une créature si merveilleuse ; tes œuvres sont admirables, et mon âme se plaît à le reconnaître.","es":"Te alabo porque te has mostrado maravilloso, porque tus obras son admirables; largamente conoces mi alma.","en":"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.","src":{"fr":"Ps 139, 14","es":"Sal 139, 14","en":"Ps 139:14"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2027-07-02":{"jour":{"id":"mc9-24","fr":"Je crois (Seigneur) ; venez au secours de mon incrédulité.","es":"¡Creo! ¡Ven en ayuda de mi falta de fe!","en":"Deaf and dumb spirit, I command thee, go out of him and enter not any more into him.","src":{"fr":"Mc 9, 23","es":"Mc 9, 24","en":"Mk 9:24"}},"soir":{"id":"ps143-1","fr":"Seigneur, écoute ma prière ; prête l’oreille à mes supplications ; exauce-moi dans ta vérité et dans ta justice.","es":"Señor, escucha mi oración, presta oído a mi súplica según tu fidelidad; óyeme por tu justicia.","en":"Hear, O Lord, my prayer: give ear to my supplication in thy truth: hear me in thy justice.","src":{"fr":"Ps 143, 1","es":"Sal 143, 1","en":"Ps 143:1"}},"enfantJour":{"id":"gloire-au-pere","fr":"Gloire au Père, et au Fils, et au Saint-Esprit,\ncomme il était au commencement, maintenant et toujours,\net pour les siècles des siècles. Amen.","es":"Gloria al Padre, y al Hijo, y al Espíritu Santo.\nComo era en el principio, ahora y siempre,\npor los siglos de los siglos. Amén.","en":"Glory be to the Father, and to the Son, and to the Holy Spirit,\nas it was in the beginning, is now, and ever shall be,\nworld without end. Amen.","src":{"fr":"Gloire au Père","es":"Gloria","en":"Glory Be"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2027-07-03":{"jour":{"id":"lc17-5","fr":"Augmentez notre foi.","es":"Añádenos fe.","en":"Increase our faith.","src":{"fr":"Lc 17, 5","es":"Lc 17, 5","en":"Lk 17:5"}},"soir":{"id":"ps143-10","fr":"Apprends-moi à faire ta volonté, car tu es mon Dieu. Que ton bon esprit me conduise dans la voie droite !","es":"Enséñame a hacer tu voluntad, porque Tú eres mi Dios. Tu Espíritu es bueno; guíame, pues, por camino llano.","en":"Teach me to do thy will, for thou art my God. Thy good spirit shall lead me into the right land.","src":{"fr":"Ps 143, 10","es":"Sal 143, 10","en":"Ps 143:10"}},"enfantJour":{"id":"ps150-6","fr":"Que tout ce qui respire loue Seigneur ! Alleluia.","es":"¡Todo lo que respira alabe al Señor! ¡Hallelú Yah!","en":"Let every spirit praise the Lord. Alleluia.","src":{"fr":"Ps 150, 6","es":"Sal 150, 6","en":"Ps 150:5"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2027-07-04":{"jour":{"id":"jn6-68","fr":"Seigneur, à qui irions-nous ? Vous avez les paroles de la vie éternelle. Et nous, nous avons cru et nous avons connu que vous êtes le Saint de Dieu.","es":"Señor, ¿a quién iríamos? Tú tienes palabras de vida eterna. Y nosotros hemos creído y sabemos que Tú eres el Santo de Dios.","en":"Lord, to whom shall we go? Thou hast the words of eternal life.","src":{"fr":"Jn 6, 68-69","es":"Jn 6, 68-69","en":"Jn 6:68-69"}},"soir":{"id":"ps145-18","fr":"Le Seigneur est près de tous ceux qui l’invoquent, de tous ceux qui l’invoquent d’un cœur sincère.","es":"El Señor cerca está de cuantos le invocan, de todos los que le invocan de veras.","en":"The Lord is nigh unto all them that call upon him: to all that call upon him in truth.","src":{"fr":"Ps 145, 18","es":"Sal 145, 18","en":"Ps 145:18"}},"enfantJour":{"id":"ps23-1","fr":"Le Seigneur est mon pasteur ; je ne manquerai de rien.","es":"El Señor es mi pastor, nada me faltará.","en":"The Lord ruleth me: and I shall want nothing.","src":{"fr":"Ps 23, 1","es":"Sal 23, 1","en":"Ps 23:1"}},"enfantSoir":{"id":"ps121-8","fr":"Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 8","es":"Sal 121, 8","en":"Ps 121:8"}}},"2027-07-05":{"jour":{"id":"jn20-28","fr":"Mon Seigneur, et mon Dieu !","es":"¡Señor mío y Dios mío!","en":"My Lord and my God.","src":{"fr":"Jn 20, 28","es":"Jn 20, 28","en":"Jn 20:28"}},"soir":{"id":"ps147-3","fr":"Il guérit ceux qui ont le cœur brisé, et il panse leurs blessures.","es":"Él quien sana a los de corazón llagado, y venda sus heridas.","en":"Who healeth the broken of heart, and bindeth up their bruises.","src":{"fr":"Ps 147, 3","es":"Sal 147, 3","en":"Ps 147:3"}},"enfantJour":{"id":"ps121-2","fr":"Mon secours viendra de Seigneur, qui a fait le ciel et la terre.","es":"Mi socorro viene del Señor que creó el cielo y la tierra.","en":"My help is from the Lord, who made heaven and earth.","src":{"fr":"Ps 121, 2","es":"Sal 121, 2","en":"Ps 121:2"}},"enfantSoir":{"id":"ps56-4","fr":"Quand je suis dans la crainte, je me confie en toi.","es":"El día en que me invada el temor, confiaré en Ti.","en":"I will trust in thee.","src":{"fr":"Ps 56, 4","es":"Sal 56, 4","en":"Ps 56:4"}}},"2027-07-06":{"jour":{"id":"lc11-1","fr":"Seigneur, apprenez-nous à prier, comme Jean l’a appris à ses disciples.","es":"Señor, enséñanos a orar, como Juan lo enseñó a sus discípulos.","en":"Lord, teach us to pray, as John also taught his disciples.","src":{"fr":"Lc 11, 1","es":"Lc 11, 1","en":"Lk 11:1"}},"soir":{"id":"lc2-29","fr":"Maintenant, ô Maître, vous laissez partir votre serviteur En paix, selon votre parole ; Puisque mes yeux ont vu votre salut, Que vous avez préparé à la face de tous les peuples : Lumière qui doit dissiper les ténèbres des Nations Et gloire d’Israël, votre peuple.","es":"Ahora, Señor, despides a tu siervo en paz, según tu palabra, porque han visto mis ojos tu salvación, que preparaste a la faz de todos los pueblos. Luz para revelarse a los gentiles, y para gloria de Israel, tu pueblo.","en":"Now thou dost dismiss thy servant, O Lord, according to thy word in peace: Because my eyes have seen thy salvation, Which thou hast prepared before the face of all peoples: A light to the revelation of the Gentiles and the glory of thy people Israel.","src":{"fr":"Lc 2, 29-32","es":"Lc 2, 29-32","en":"Lk 2:29-32"}},"enfantJour":{"id":"jn21-17","fr":"Seigneur, vous connaissez toutes choses, vous savez bien que je vous aime.","es":"Señor, Tú lo sabes todo. Tú sabes que yo te quiero.","en":"Lord, thou knowest all things: thou knowest that I love thee.","src":{"fr":"Jn 21, 17","es":"Jn 21, 17","en":"Jn 21:17"}},"enfantSoir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el día.","en":"Stay with us, because it is towards evening and the day is now far spent.","src":{"fr":"Lc 24, 29","es":"Lc 24, 29","en":"Lk 24:29"}}},"2027-07-07":{"jour":{"id":"is6-8","fr":"Me voici, envoyez-moi.","es":"Heme aquí; envíame a mí.","en":"Lo, here am I, send me.","src":{"fr":"Is 6, 8","es":"Is 6, 8","en":"Is 6:8"}},"soir":{"id":"lc23-46","fr":"Père, je remets mon esprit entre vos mains.","es":"Padre, en tus manos entrego mi espíritu.","en":"Father, into thy hands I commend my spirit.","src":{"fr":"Lc 23, 46","es":"Lc 23, 46","en":"Lk 23:46"}},"enfantJour":{"id":"ps8-2","fr":"Seigneur, notre Seigneur, que ton nom est glorieux sur toute la terre ! Toi qui as revêtu les cieux de ta majesté !","es":"¡Oh Señor, Señor nuestro, cuán admirable es tu Nombre en toda la tierra! Tú, cuya gloria cantan los cielos.","en":"O Lord, our Lord, how admirable is thy name in the whole earth! For thy magnificence is elevated above the heavens.","src":{"fr":"Ps 8, 2","es":"Sal 8, 2","en":"Ps 8:2"}},"enfantSoir":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}}},"2027-07-08":{"jour":{"id":"jr17-14","fr":"Guéris-moi, Seigneur, et je serai guéri ; sauve-moi, et je serai sauvé, car tu es ma louange.","es":"¡Sáname, Señor, y quedaré sano; sálvame, y seré salvo; porque Tú eres mi gloria!","en":"Heal me, O Lord, and I shall be healed: save me, and I shall be saved: for thou art my praise.","src":{"fr":"Jr 17, 14","es":"Jer 17, 14","en":"Jer 17:14"}},"soir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el día.","en":"Stay with us, because it is towards evening and the day is now far spent.","src":{"fr":"Lc 24, 29","es":"Lc 24, 29","en":"Lk 24:29"}},"enfantJour":{"id":"ps100-2","fr":"Servez le Seigneur avec joie, venez en sa présence avec allégresse !","es":"Aclamad a Señor, tierras todas, servid al Señor con alegría, llegaos a su presencia con exultación.","en":"Sing joyfully to God, all the earth: serve ye the Lord with gladness. Come in before his presence with exceeding great joy.","src":{"fr":"Ps 100, 2","es":"Sal 100, 2","en":"Ps 100:2"}},"enfantSoir":{"id":"ps91-11","fr":"Car il ordonnera à ses anges de te garder dans toutes tes voies.","es":"Pues Él te ha encomendado a sus ángeles, para que te guarden en todos tus caminos.","en":"For he hath given his angels charge over thee; to keep thee in all thy ways.","src":{"fr":"Ps 91, 11","es":"Sal 91, 11","en":"Ps 91:11"}}},"2027-07-09":{"jour":{"id":"lc1-38","fr":"Voici la servante du Seigneur, qu’il me soit fait selon votre parole.","es":"He aquí la esclava del Señor: Séame hecho según tu palabra.","en":"Behold the handmaid of the Lord: be it done to me according to thy word.","src":{"fr":"Lc 1, 38","es":"Lc 1, 38","en":"Lk 1:38"}},"soir":{"id":"lc23-42","fr":"Seigneur, souvenez-vous de moi, quand vous serez parvenu dans votre royaume.","es":"Jesús, acuérdate de mí, cuando vengas en tu reino.","en":"Lord, remember me when thou shalt come into thy kingdom.","src":{"fr":"Lc 23, 42","es":"Lc 23, 42","en":"Lk 23:42"}},"enfantJour":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2027-07-10":{"jour":{"id":"ps40-9","fr":"Je veux faire ta volonté, ô mon Dieu, et ta loi est au fond de mon cœur.","es":"Hacer tu voluntad; tal es mi deleite, Dios mío, y tu Ley está en el fondo de mi corazón.","en":"That I should do thy will: O my God, I have desired it, and thy law in the midst of my heart.","src":{"fr":"Ps 40, 9","es":"Sal 40, 9","en":"Ps 40:9"}},"soir":{"id":"lc18-13","fr":"Ô Dieu, ayez pitié de moi qui suis un pécheur !","es":"Oh Dios, compadécete de mí, el pecador.","en":"O God, be merciful to me a sinner.","src":{"fr":"Lc 18, 13","es":"Lc 18, 13","en":"Lk 18:13"}},"enfantJour":{"id":"ps34-2","fr":"Je veux bénir le Seigneur en tout temps ; sa louange sera toujours dans ma bouche.","es":"Quiero bendecir al Señor en todo tiempo, tener siempre en mi boca su alabanza.","en":"I will bless the Lord at all times, his praise shall be always in my mouth.","src":{"fr":"Ps 34, 2","es":"Sal 34, 2","en":"Ps 34:2"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2027-07-11":{"jour":{"id":"ps71-1","fr":"Seigneur, en toi j’ai placé mon refuge ; que jamais je ne sois confondu !","es":"En Ti, Señor, me refugio, no me vea nunca confundido.","en":"In thee, O Lord, I have hoped, let me never be put to confusion.","src":{"fr":"Ps 71, 1","es":"Sal 71, 1","en":"Ps 71:1"}},"soir":{"id":"jn21-17","fr":"Seigneur, vous connaissez toutes choses, vous savez bien que je vous aime.","es":"Señor, Tú lo sabes todo. Tú sabes que yo te quiero.","en":"Lord, thou knowest all things: thou knowest that I love thee.","src":{"fr":"Jn 21, 17","es":"Jn 21, 17","en":"Jn 21:17"}},"enfantJour":{"id":"signe-de-croix","fr":"Au nom du Père, et du Fils, et du Saint-Esprit. Amen.","es":"En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.","en":"In the name of the Father, and of the Son, and of the Holy Spirit. Amen.","src":{"fr":"Le signe de croix","es":"La señal de la cruz","en":"The Sign of the Cross"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2027-07-12":{"jour":{"id":"ps86-5","fr":"Car tu es bon, Seigneur, et clément, et plein de compassion pour tous ceux qui t’invoquent.","es":"Porque Tú eres un Señor bueno y pronto a perdonar, lleno de gracia para todos los que te invocan.","en":"For thou, O Lord, art sweet and mild: and plenteous in mercy to all that call upon thee.","src":{"fr":"Ps 86, 5","es":"Sal 86, 5","en":"Ps 86:5"}},"soir":{"id":"ps25-6","fr":"Souviens-toi de ta miséricorde, Seigneur, et de ta bonté car elles sont éternelles. Ne te souviens pas des péchés de ma jeunesse ni de mes transgressions ; souviens-toi de moi selon ta miséricorde, à cause de ta bonté, ô Seigneur.","es":"Acuérdate, Señor, de tus misericordias, y de tus bondades de todos los tiempos. No recuerdes los pecados de mi mocedad, ni mis ofensas; según tu benevolencia acuérdate de mí, por tu bondad, oh Señor.","en":"Remember, O Lord, thy bowels of compassion; and thy mercies that are from the beginning of the world. The sins of my youth and my ignorances do not remember. According to thy mercy remember thou me: for thy goodness' sake, O Lord.","src":{"fr":"Ps 25, 6-7","es":"Sal 25, 6-7","en":"Ps 25:6-7"}},"enfantJour":{"id":"1s3-10","fr":"Parlez, car votre serviteur écoute.","es":"Habla, tu siervo escucha.","en":"Speak, Lord, for thy servant heareth.","src":{"fr":"1 S 3, 10","es":"1 Sam 3, 10","en":"1 Sm 3:10"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2027-07-13":{"jour":{"id":"ps108-2","fr":"Mon cœur est affermi, ô Dieu, je chanterai et ferai retentir de joyeux instruments. Debout, ma gloire !","es":"Mi corazón está pronto, oh Dios; quiero cantar y entonar salmos; mi alma está despierta.","en":"My heart is ready, O God, my heart is ready: I will sing, and will give praise, with my glory.","src":{"fr":"Ps 108, 2","es":"Sal 108, 2","en":"Ps 108:2"}},"soir":{"id":"ps32-5","fr":"Je t’ai fait connaître mon péché, je n’ai point caché mon iniquité ; j’ai dit : « Je veux confesser au Seigneur mes transgressions » et toi, tu as remis l’iniquité de mon péché.","es":"Entonces te manifesté mi delito, y no te oculté mi culpa; dije: “confesaré mi iniquidad al Señor” y Tú remitiste la culpa de mi pecado.","en":"I have acknowledged my sin to thee, and my injustice I have not concealed. I said I will confess against my self my injustice to the Lord: and thou hast forgiven the wickedness of my sin.","src":{"fr":"Ps 32, 5","es":"Sal 32, 5","en":"Ps 32:5"}},"enfantJour":{"id":"ps118-24","fr":"Voici le jour que le Seigneur a fait ; livrons-nous à l’allégresse et à la joie.","es":"Este es el día que hizo Señor; alegrémonos por él y celebrémoslo.","en":"This is the day which the Lord hath made: let us be glad and rejoice therein.","src":{"fr":"Ps 118, 24","es":"Sal 118, 24","en":"Ps 118:24"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2027-07-14":{"jour":{"id":"ps136-1","fr":"Célébrez Seigneur, car il est bon, car sa miséricorde est éternelle.","es":"¡Hallelú Yah! Alabad al Señor porque es bueno, porque su misericordia es para siempre.","en":"Alleluia. Praise the Lord, for he is good: for his mercy endureth for ever.","src":{"fr":"Ps 136, 1","es":"Sal 136, 1","en":"Ps 136:1"}},"soir":{"id":"ps34-19","fr":"Le Seigneur est près de ceux qui ont le cœur brisé, il sauve ceux dont l’esprit est abattu.","es":"El Señor está junto a los que tienen el corazón atribulado y salva a los de espíritu compungido.","en":"The Lord is nigh unto them that are of a contrite heart: and he will save the humble of spirit.","src":{"fr":"Ps 34, 19","es":"Sal 34, 19","en":"Ps 34:19"}},"enfantJour":{"id":"ps136-1","fr":"Célébrez Seigneur, car il est bon, car sa miséricorde est éternelle.","es":"¡Hallelú Yah! Alabad al Señor porque es bueno, porque su misericordia es para siempre.","en":"Alleluia. Praise the Lord, for he is good: for his mercy endureth for ever.","src":{"fr":"Ps 136, 1","es":"Sal 136, 1","en":"Ps 136:1"}},"enfantSoir":{"id":"ps121-8","fr":"Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 8","es":"Sal 121, 8","en":"Ps 121:8"}}},"2027-07-15":{"jour":{"id":"ps70-2","fr":"Ô Dieu, hâte-toi de me délivrer ! Seigneur, hâte-toi de me secourir !","es"
