},"citation":{"debutant":{"texte":"I want to spend my heaven in doing good on earth.","auteur":"Saint Thérèse of Lisieux","source":"Last Conversations, July 17, 1897","auteurId":"therese-de-lisieux"},"initie":{"texte":"To be a Saint requires neither extraordinary actions or works nor the possession of exceptional charisms.","auteur":"Benedict XVI","source":"Homily of November 1, 2006","auteurId":"benoit-xvi"},"erudit":{"texte":"When I think of them, I feel myself inflamed by a tremendous yearning.","auteur":"Saint Bernard of Clairvaux","source":"Sermon 2 for All Saints, read in the Office of Readings on November 1","auteurId":"bernard-de-clairvaux"}},"reflexion":{"titre":"Día de los Muertos: looking death in the face","accroche":"In Mexico, these days, families decorate graves and prepare flower-covered altars for their dead. And what is our own relationship with death?","fait":"On November 1 and 2, Mexico celebrates the Día de los Muertos. Families set up altars (ofrendas) with photos of the departed, candles, orange cempasúchil marigolds and the dishes they loved. This feast, blending indigenous traditions and Catholic faith, has been on UNESCO's list of the Intangible Cultural Heritage of Humanity since 2008. In Catalonia it is the Castanyada: families share chestnuts and panellets.","citations":[{"texte":"I am the resurrection and the life: he that believeth in me, although he be dead, shall live.","source":"John 11:25"},{"texte":"To keep death daily before one's eyes.","source":"Rule of Saint Benedict, chapter 4, verse 47 (c. 530), translated from the Latin “mortem cotidie ante oculos suspectam habere”","niveaux":["initie","erudit"]}],"piste":{"debutant":"In our culture we often avoid talking about death. Christians dare to look at it without fear: Jesus promised that death does not have the last word. Mexicans celebrate with their dead; Christians hope to see them again.","initie":"Christians have always chosen to look death in the face: it is the “memento mori”, “remember that you will die”. Not to be afraid, but to live each day as a gift. Mexicans celebrate with their dead; Christians hope to see them again, because Christ is risen.","erudit":"Saint Benedict asked his monks to keep “death daily before their eyes”. This is not a gloomy morality: it is a way of putting everything in its place and of not postponing forgiveness, gratitude, love. All Saints and All Souls, side by side, express the same hope: the communion of saints binds together those in heaven, those on the way and us. What would you like to stop putting off?"},"sources":"UNESCO, “Indigenous festivity dedicated to the dead” (inscribed 2008); Rule of Saint Benedict, ch. 4","priere":{"texte":"O Lord, make me know my end. And what is the number of my days: that I may know what is wanting to me.","source":"Ps 39:5"}},"histoire":{"titre":"How a temple of all the gods became the church of all the saints","accroche":"All Saints was born in Rome, in one of the most famous monuments of Antiquity: the Pantheon.","texte":"The Pantheon in Rome was a temple dedicated to all the gods of the Empire. Around 609, Emperor Phocas gave it to Pope Boniface IV, who consecrated it to the Virgin Mary and all the martyrs, as Saint Mary and the Martyrs. May 13, the day of that consecration, became the feast of all martyrs.\n\nIn the 8th century, Pope Gregory III dedicated a chapel in Saint Peter's Basilica to all the saints. Around 835, under Pope Gregory IV, Emperor Louis the Pious extended the November 1 feast to the whole Carolingian empire.\n\nThe Pantheon is still a church today: you can walk in freely, beneath the great opening of its dome, open to the sky.","plusLoin":"Historians still debate the exact role of each: in Ireland and England, all the saints were already celebrated in early November in the 8th century, and the date may have reached the continent from there. The shift from a feast of martyrs to a feast of all saints says something important: holiness is not reserved for those who shed their blood, it is the calling of all the baptized.","source":"Institut catholique de Paris; New Catholic Encyclopedia, “All Saints, Solemnity of”; Vatican News, “All Saints”"},"portrait":{"nom":"Saint Carlo Acutis","dates":"1991-2006","accroche":"A teenager passionate about computers, who died at 15 and became the first saint of the internet generation.","texte":"Carlo was born in London on May 3, 1991, and grew up in Milan. From a young age he loved the Mass: he made his First Communion at 7 and then went every day.\n\nHe was a teenager of his time, surrounded by friends and passionate about computers. He created an exhibition on Eucharistic miracles that still travels the world today.\n\nIn October 2006, a sudden leukemia took him within days, at 15. He rests in Assisi. Pope Leo XIV declared him a saint on September 7, 2025.\n\nHis life expresses the heart of All Saints: you don't need to do extraordinary things to become a saint, it is enough to love God and others in ordinary life.","plusLoin":"Carlo called the Eucharist his “highway to heaven”, and his motto was “Not me, but God”. His holiness echoes what the Second Vatican Council calls “the universal call to holiness” (Lumen Gentium, chapter 5): everyone, in ordinary life, is called to the fullness of love.","source":"Opus Dei, “Carlo Acutis, the first millennial saint” (2025); Associated Press (September 2025)"},"savaisTu":{"titre":"Halloween means “the eve of All Saints”","accroche":"Behind the pumpkins, an old Christian English word.","texte":"“Halloween” is a contraction of All Hallows' Eve, “the eve of all the saints” (hallow is an old English word for “saint”). So at first it was the vigil of All Saints.\n\nHistorians think that older customs, such as the Celtic feast of Samhain, which marked the start of the dark season, blended with this vigil. Costumes and pumpkins came much later, mostly through Ireland and then the United States.","source":"Encyclopædia Britannica, “Halloween”; Oxford English Dictionary, “hallow”"},"enfant":{"evangile":{"explication":"Jesus went up a mountain to teach his friends. He told them who is truly happy: the humble, the gentle, those who love and forgive, those who make peace. That happiness is a gift from God."},"citation":{"texte":"I want to spend my heaven in doing good on earth.","auteur":"Saint Thérèse of Lisieux","auteurId":"therese-de-lisieux"},"reflexion":{"titre":"What is a saint?","texte":"A saint is someone who loved God and others very much. They were not perfect, but they trusted God. Some are famous, like Saint Francis or Saint Thérèse. Many others are known only to God: today we celebrate them all.","question":"Do you know the saint whose name you have?"},"histoire":{"titre":"The church of all the saints","texte":"In Rome there is a very old building, the Pantheon, with a big round hole at the top of its roof, open to the sky. Long ago, the Romans honored their gods there. More than fourteen hundred years ago, the pope turned it into a church dedicated to Mary and the martyrs. It is still there."},"portrait":{"nom":"Saint Carlo Acutis","texte":"Carlo was an Italian boy who loved computers, video games and his friends. He went to Mass every day: he said the Eucharist was his “highway to heaven”. He died at 15 of a serious illness. The Church declared him a saint in 2025.","idee":"Tonight, tell Jesus what you love doing, like Carlo."},"sources":"Catechism of the Catholic Church, nos. 1716-1717; Théobule (Dominican friars), videos on the Beatitudes"}}},"2026-11-02":{"fr":{"evangilePiste":{"debutant":"« Celui qui vient à moi, je ne le jetterai point dehors. » Personne n'est de trop pour Jésus. Aujourd'hui, on peut Lui confier, simplement par leur prénom, ceux qui sont morts et qu'on aime.","initie":"Jésus dit que la volonté de son Père, c'est de ne perdre personne. Prier pour les défunts, c'est entrer dans ce désir de Dieu : nous les confions à sa miséricorde, sans juger, avec confiance. Pense à une personne disparue et dis son prénom dans ta prière.","erudit":"« Que je ne perde aucun de ceux qu'il m'a donnés » : toute l'espérance chrétienne tient dans ce verset. L'Église prie pour les défunts depuis ses origines (Catéchisme, n° 1032), parce qu'elle croit à la purification après la mort et à la force de la prière d'amour. Le jour des défunts n'est pas un jour de tristesse sans espoir (1 Th 4, 13), mais un acte de foi en la résurrection de la chair, que nous confessons dans le Credo."},"citation":{"debutant":{"texte":"Je ne meurs pas, j'entre dans la vie.","auteur":"Sainte Thérèse de Lisieux","source":"Lettre à l'abbé Bellière, 9 juin 1897","auteurId":"therese-de-lisieux"},"initie":{"texte":"Souvenez-vous seulement de moi à l'autel du Seigneur.","auteur":"Sainte Monique, mère de saint Augustin, avant de mourir","source":"Saint Augustin, Confessions, livre IX, chapitre 11","auteurId":"monique"},"erudit":{"texte":"Notre prière pour eux peut non seulement les aider mais aussi rendre efficace leur intercession en notre faveur.","auteur":"Catéchisme de l'Église catholique","source":"n° 958","auteurId":"catechisme"}},"reflexion":{"titre":"Comment parler de la mort à un enfant ?","accroche":"En ces jours où beaucoup de familles vont au cimetière, les enfants posent des questions. Que leur répondre, et que nous répondre à nous-mêmes ?","fait":"Autour du 1er et du 2 novembre, en Espagne comme en France, les cimetières se remplissent de fleurs. Beaucoup d'enfants accompagnent leurs parents et demandent : « Où il est, grand-père ? » ou « Est-ce que toi aussi tu vas mourir ? » Les spécialistes de l'enfance conseillent de ne pas éviter ces questions et d'employer des mots vrais et simples.","citations":[{"texte":"Mais nous ne voulons pas, frères, que vous soyez dans l'ignorance au sujet de ceux qui se sont endormis, afin que vous ne vous affligiez pas, comme les autres hommes qui n'ont pas d'espérance.","source":"1 Thessaloniciens 4, 13"},{"texte":"Les âmes des justes sont dans la main de Dieu, et le tourment ne les atteindra pas.","source":"Sagesse 3, 1","niveaux":["initie","erudit"]}],"piste":{"debutant":"On n'a pas besoin d'avoir toutes les réponses. On peut dire : « Je ne sais pas tout, mais je crois que grand-père est dans les mains de Dieu, et que Dieu l'aime. » Et laisser l'enfant être triste, sans le presser.","initie":"La foi ne supprime pas le chagrin : Jésus Lui-même a pleuré devant la tombe de son ami Lazare (Jn 11, 35). Mais elle lui donne un horizon. Avec un enfant, on peut allumer une bougie, regarder une photo et prier ensemble : les gestes parlent autant que les mots.","erudit":"Saint Paul ne demande pas aux chrétiens de ne pas être tristes, mais de ne pas l'être « comme ceux qui n'ont pas d'espérance ». Parler de la mort à un enfant, c'est souvent revisiter sa propre foi : est-ce que je crois vraiment à la résurrection ? Le jour des défunts est une bonne occasion de reprendre l'article du Credo : « J'attends la résurrection des morts et la vie du monde à venir. »"},"sources":"Diocèse de Paris, « Parler aux enfants de la prière pour les défunts »","priere":{"texte":"Même quand je marche dans une vallée d’ombre mortelle, je ne crains aucun mal, car tu es avec moi : ta houlette et ton bâton me rassurent.","source":"Ps 23, 4"}},"histoire":{"titre":"Cluny, l'an mille et le jour des morts","accroche":"Pourquoi prie-t-on pour les défunts le 2 novembre ? Tout commence dans une grande abbaye de Bourgogne.","texte":"Les chrétiens ont prié pour leurs morts dès les premiers siècles : on retrouve des prières pour les défunts gravées dans les catacombes de Rome.\n\nMais c'est à l'abbaye de Cluny, en Bourgogne, vers l'an mille, que l'abbé Odilon fixa un jour pour tous les défunts : le lendemain de la Toussaint. Cluny dirigeait alors un grand réseau de monastères dans toute l'Europe, et la coutume s'est répandue jusqu'à Rome.\n\nEn 1915, pendant la Première Guerre mondiale, devant les millions de morts, le pape Benoît XV permit à tous les prêtres de célébrer trois messes ce jour-là.","plusLoin":"Le choix du lendemain de la Toussaint n'est pas un hasard : après avoir fêté ceux qui sont déjà dans la lumière de Dieu, l'Église prie pour ceux qui sont encore en chemin vers elle. C'est la communion des saints vécue d'un jour à l'autre : l'Église du ciel, l'Église en purification et l'Église sur la terre ne font qu'une (Catéchisme, n° 954-959).","source":"Diocèse de Paris ; Benoît XV, constitution apostolique Incruentum altaris (10 août 1915) ; Catéchisme de l'Église catholique"},"portrait":{"nom":"Saint Odilon de Cluny","dates":"vers 962-1049","accroche":"Le moine qui a donné au monde le jour des défunts, et qui fit vendre les trésors de son abbaye pour nourrir les affamés.","texte":"Odilon naît en Auvergne vers 962. Il entre à l'abbaye de Cluny et en devient l'abbé en 994, pour plus d'un demi-siècle.\n\nPendant une grande famine, il fit vendre les vases précieux de l'abbaye pour nourrir les pauvres. Il encouragea la « trêve de Dieu », qui interdisait de se battre certains jours de la semaine.\n\nIl institua dans les monastères de Cluny la prière pour tous les défunts, le 2 novembre. Il meurt en 1049 au prieuré de Souvigny, où il repose.","plusLoin":"Avec Odilon, la prière pour les morts devient une œuvre de charité : prier pour ceux que plus personne ne nomme, c'est aimer jusqu'au bout. Son biographe, le moine Jotsald, rapporte qu'il préférait être jugé pour un excès de miséricorde plutôt que pour un excès de dureté.","source":"Encyclopædia Britannica, « Saint Odilo » ; Nominis (Conférence des évêques de France), « Saint Odilon »"},"savaisTu":{"titre":"« Cimetière » veut dire « dortoir »","accroche":"Le mot lui-même dit l'espérance des premiers chrétiens.","texte":"Le mot « cimetière » vient du grec koimêtêrion, qui veut dire « lieu où l'on dort », « dortoir ». Les premiers chrétiens l'ont choisi pour parler des lieux où reposaient leurs morts.\n\nPour eux, la mort était comme un sommeil en attendant la résurrection. Saint Paul parle déjà de « ceux qui se sont endormis » (1 Th 4, 13).","source":"Le Robert, dictionnaire historique de la langue française, « cimetière » ; 1 Thessaloniciens 4, 13"},"enfant":{"evangile":{"explication":"Jésus a dit : « Celui qui vient à moi, je ne le jetterai point dehors. » Jésus garde une place près de Lui pour chacun, pour toujours."},"citation":{"texte":"Je ne meurs pas, j'entre dans la vie.","auteur":"Sainte Thérèse de Lisieux","auteurId":"therese-de-lisieux"},"reflexion":{"titre":"Quand quelqu'un nous manque","texte":"Aujourd'hui, l'Église prie pour tous ceux qui sont morts. C'est normal d'être triste quand quelqu'un qu'on aime est mort. Les chrétiens croient que Dieu accueille ceux qui sont morts et qu'on pourra les retrouver. On peut prier pour eux : c'est une façon de continuer à les aimer.","question":"Y a-t-il quelqu'un à qui tu aimerais penser dans ta prière ce soir ?"},"histoire":{"titre":"Les moines qui priaient pour tout le monde","texte":"Il y a très longtemps, dans un grand monastère qui s'appelle Cluny, vivaient de nombreux moines. Leur abbé, Odilon, a décidé qu'un jour par an, on prierait pour tous ceux qui sont morts, même ceux que tout le monde avait oubliés. Ce jour-là, c'est aujourd'hui."},"portrait":{"nom":"Saint Odilon","texte":"Odilon était l'abbé d'un grand monastère. Une année, il n'y avait plus assez à manger et les gens avaient faim. Odilon a fait vendre les objets précieux du monastère pour acheter de quoi nourrir les pauvres.","idee":"Aujourd'hui, tu peux allumer une bougie avec tes parents et dire le prénom de quelqu'un qui est mort."},"sources":"Diocèse de Paris, « Parler aux enfants de la prière pour les défunts » ; Catéchisme de l'Église catholique, n° 958"}},"es":{"evangilePiste":{"debutant":"«Al que venga a Mí, no lo echaré fuera.» Nadie sobra para Jesús. Hoy podemos confiarle, sencillamente por su nombre, a las personas que han muerto y que amamos.","initie":"Jesús dice que la voluntad de su Padre es no perder a nadie. Rezar por los difuntos es entrar en ese deseo de Dios: los confiamos a su misericordia, sin juzgar, con confianza. Piensa en una persona fallecida y di su nombre en tu oración.","erudit":"«Que no pierda a ninguno de los que Él me ha dado»: toda la esperanza cristiana cabe en este versículo. La Iglesia reza por los difuntos desde sus orígenes (Catecismo, n. 1032), porque cree en la purificación después de la muerte y en la fuerza de la oración hecha con amor. El día de los difuntos no es un día de tristeza sin esperanza (1 Tes 4, 13), sino un acto de fe en la resurrección de la carne, que confesamos en el Credo."},"citation":{"debutant":{"texte":"No muero, entro en la vida.","auteur":"Santa Teresa de Lisieux","source":"Carta al abate Bellière, 9 de junio de 1897","auteurId":"therese-de-lisieux"},"initie":{"texte":"Solo os pido que os acordéis de mí ante el altar del Señor dondequiera que estéis.","auteur":"Santa Mónica, madre de san Agustín, antes de morir","source":"San Agustín, Confesiones, libro IX, capítulo 11","auteurId":"monique"},"erudit":{"texte":"Nuestra oración por ellos puede no solamente ayudarles sino también hacer eficaz su intercesión en nuestro favor.","auteur":"Catecismo de la Iglesia Católica","source":"n. 958","auteurId":"catechisme"}},"reflexion":{"titre":"¿Cómo hablar de la muerte a un niño?","accroche":"En estos días en que muchas familias van al cementerio, los niños hacen preguntas. ¿Qué responderles, y qué respondernos a nosotros mismos?","fait":"En torno al 1 y al 2 de noviembre, en España como en Francia, los cementerios se llenan de flores. Muchos niños acompañan a sus padres y preguntan: «¿Dónde está el abuelo?» o «¿Tú también te vas a morir?». Los especialistas en infancia aconsejan no evitar estas preguntas y usar palabras verdaderas y sencillas.","citations":[{"texte":"No queremos, hermanos, que estéis en ignorancia acerca de los que duermen, para que no os aflijáis como los demás que no tienen esperanza.","source":"1 Tesalonicenses 4, 13"},{"texte":"Mas las almas de los justos están en la mano de Dios; y no llegará a ellas el tormento de la muerte.","source":"Sabiduría 3, 1","niveaux":["initie","erudit"]}],"piste":{"debutant":"No hace falta tener todas las respuestas. Se puede decir: «No lo sé todo, pero creo que el abuelo está en las manos de Dios, y que Dios lo quiere». Y dejar que el niño esté triste, sin meterle prisa.","initie":"La fe no suprime la pena: el mismo Jesús lloró ante la tumba de su amigo Lázaro (Jn 11, 35). Pero le da un horizonte. Con un niño se puede encender una vela, mirar una foto y rezar juntos: los gestos hablan tanto como las palabras.","erudit":"San Pablo no pide a los cristianos que no estén tristes, sino que no lo estén «como los que no tienen esperanza». Hablar de la muerte a un niño es a menudo revisar la propia fe: ¿creo de verdad en la resurrección? El día de los difuntos es una buena ocasión para retomar el artículo del Credo: «Espero la resurrección de los muertos y la vida del mundo futuro»."},"sources":"Diócesis de París, «Hablar a los niños de la oración por los difuntos»","priere":{"texte":"Aunque atraviese un valle de tinieblas, no temeré ningún mal, porque Tú vas conmigo. Tu bastón y tu cayado me infunden aliento.","source":"Sal 23, 4"}},"histoire":{"titre":"Cluny, el año mil y el día de los difuntos","accroche":"¿Por qué se reza por los difuntos el 2 de noviembre? Todo empieza en una gran abadía de Borgoña.","texte":"Los cristianos rezaron por sus muertos desde los primeros siglos: en las catacumbas de Roma se conservan oraciones por los difuntos grabadas en la piedra.\n\nPero fue en la abadía de Cluny, en Borgoña, hacia el año mil, donde el abad Odilón fijó un día para todos los difuntos: el día siguiente a Todos los Santos. Cluny dirigía entonces una gran red de monasterios en toda Europa, y la costumbre se extendió hasta Roma.\n\nEn 1915, durante la Primera Guerra Mundial, ante los millones de muertos, el papa Benedicto XV permitió a todos los sacerdotes celebrar tres misas ese día.","plusLoin":"La elección del día siguiente a Todos los Santos no es casual: después de celebrar a los que ya están en la luz de Dios, la Iglesia reza por los que todavía están en camino hacia ella. Es la comunión de los santos vivida de un día a otro: la Iglesia del cielo, la Iglesia en purificación y la Iglesia en la tierra son una sola (Catecismo, n. 954-959).","source":"Diócesis de París; Benedicto XV, constitución apostólica Incruentum altaris (10 de agosto de 1915); Catecismo de la Iglesia Católica"},"portrait":{"nom":"San Odilón de Cluny","dates":"hacia 962-1049","accroche":"El monje que dio al mundo el día de los difuntos, y que vendió los tesoros de su abadía para alimentar a los hambrientos.","texte":"Odilón nace en Auvernia hacia el año 962. Entra en la abadía de Cluny y llega a ser su abad en 994, durante más de medio siglo.\n\nDurante una gran hambruna, hizo vender los vasos preciosos de la abadía para alimentar a los pobres. Promovió la «tregua de Dios», que prohibía combatir ciertos días de la semana.\n\nInstituyó en los monasterios de Cluny la oración por todos los difuntos, el 2 de noviembre. Muere en 1049 en el priorato de Souvigny, donde descansa.","plusLoin":"Con Odilón, la oración por los muertos se convierte en una obra de caridad: rezar por aquellos a quienes ya nadie nombra es amar hasta el final. Su biógrafo, el monje Jotsaldo, cuenta que prefería ser juzgado por un exceso de misericordia antes que por un exceso de dureza.","source":"Encyclopædia Britannica, «Saint Odilo»; Nominis (Conferencia Episcopal Francesa), «Saint Odilon»"},"savaisTu":{"titre":"«Cementerio» significa «dormitorio»","accroche":"La propia palabra expresa la esperanza de los primeros cristianos.","texte":"La palabra «cementerio» viene del griego koimêtêrion, que significa «lugar donde se duerme», «dormitorio». Los primeros cristianos la eligieron para hablar de los lugares donde descansaban sus muertos.\n\nPara ellos, la muerte era como un sueño a la espera de la resurrección. San Pablo ya habla de «los que duermen» (1 Tes 4, 13).","source":"Diccionario de la lengua española (RAE), «cementerio»; 1 Tesalonicenses 4, 13"},"enfant":{"evangile":{"explication":"Jesús dijo: «Al que venga a Mí, no lo echaré fuera». Jesús guarda un sitio junto a Él para cada uno, para siempre."},"citation":{"texte":"No muero, entro en la vida.","auteur":"Santa Teresa de Lisieux","auteurId":"therese-de-lisieux"},"reflexion":{"titre":"Cuando echamos de menos a alguien","texte":"Hoy la Iglesia reza por todos los que han muerto. Es normal estar triste cuando muere alguien a quien queremos. Los cristianos creen que Dios acoge a los que han muerto y que podremos volver a encontrarlos. Podemos rezar por ellos: es una manera de seguir queriéndolos.","question":"¿Hay alguien en quien te gustaría pensar en tu oración esta noche?"},"histoire":{"titre":"Los monjes que rezaban por todos","texte":"Hace mucho tiempo, en un gran monasterio llamado Cluny, vivían muchos monjes. Su abad, Odilón, decidió que un día al año se rezaría por todos los que han muerto, incluso por aquellos a quienes todo el mundo había olvidado. Ese día es hoy."},"portrait":{"nom":"San Odilón","texte":"Odilón era el abad de un gran monasterio. Un año no había bastante comida y la gente pasaba hambre. Odilón hizo vender los objetos preciosos del monasterio para comprar comida para los pobres.","idee":"Hoy puedes encender una vela con tus padres y decir el nombre de alguien que ha muerto."},"sources":"Diócesis de París, «Hablar a los niños de la oración por los difuntos»; Catecismo de la Iglesia Católica, n. 958"}},"en":{"evangilePiste":{"debutant":"“Him that cometh to me, I will not cast out.” No one is one too many for Jesus. Today we can entrust to him, simply by name, the people we love who have died.","initie":"Jesus says his Father's will is that he should lose no one. Praying for the dead means entering into this desire of God: we entrust them to his mercy, without judging, with trust. Think of someone who has died and say their name in your prayer.","erudit":"“That of all that he hath given me, I should lose nothing”: the whole of Christian hope fits in this verse. The Church has prayed for the dead from the beginning (Catechism, no. 1032), because she believes in purification after death and in the power of prayer offered in love. All Souls is not a day of hopeless sorrow (1 Thes 4:13), but an act of faith in the resurrection of the body, which we profess in the Creed."},"citation":{"debutant":{"texte":"I am not dying; I am entering into life.","auteur":"Saint Thérèse of Lisieux","source":"Letter to Father Bellière, June 9, 1897","auteurId":"therese-de-lisieux"},"initie":{"texte":"Only this I ask of you, that you remember me at the altar of the Lord, wherever you may be.","auteur":"Saint Monica, mother of Saint Augustine, before her death","source":"Saint Augustine, Confessions, Book IX, chapter 11","auteurId":"monique"},"erudit":{"texte":"Our prayer for them is capable not only of helping them, but also of making their intercession for us effective.","auteur":"Catechism of the Catholic Church","source":"no. 958","auteurId":"catechisme"}},"reflexion":{"titre":"How do you talk about death with a child?","accroche":"In these days when many families visit cemeteries, children ask questions. What should we tell them, and what do we tell ourselves?","fait":"Around November 1 and 2, in Spain and in France, cemeteries fill with flowers. Many children go with their parents and ask: “Where is Grandpa?” or “Are you going to die too?” Child specialists advise not avoiding these questions and using true, simple words.","citations":[{"texte":"And we will not have you ignorant brethren, concerning them that are asleep, that you be not sorrowful, even as others who have no hope.","source":"1 Thessalonians 4:12 (Douay-Rheims numbering; 4:13 in modern Bibles)"},{"texte":"But the souls of the just are in the hand of God, and the torment of death shall not touch them.","source":"Wisdom 3:1","niveaux":["initie","erudit"]}],"piste":{"debutant":"You don't need to have all the answers. You can say: “I don't know everything, but I believe Grandpa is in God's hands, and that God loves him.” And let the child be sad, without rushing them.","initie":"Faith does not take away grief: Jesus himself wept at the tomb of his friend Lazarus (Jn 11:35). But it gives grief a horizon. With a child, you can light a candle, look at a photo and pray together: gestures speak as much as words.","erudit":"Saint Paul does not ask Christians not to grieve, but not to grieve “as others who have no hope”. Talking about death with a child often means revisiting our own faith: do I really believe in the resurrection? All Souls is a good occasion to return to the article of the Creed: “I look forward to the resurrection of the dead and the life of the world to come.”"},"sources":"Diocese of Paris, “Talking with children about prayer for the dead”","priere":{"texte":"For though I should walk in the midst of the shadow of death, I will fear no evils, for thou art with me. Thy rod and thy staff, they have comforted me.","source":"Ps 23:4"}},"histoire":{"titre":"Cluny, the year 1000 and the day of the dead","accroche":"Why do we pray for the dead on November 2? It all began in a great abbey in Burgundy.","texte":"Christians prayed for their dead from the earliest centuries: prayers for the departed are carved in the catacombs of Rome.\n\nBut it was at the abbey of Cluny, in Burgundy, around the year 1000, that Abbot Odilo set aside a day for all the dead: the day after All Saints. Cluny then led a vast network of monasteries across Europe, and the custom spread as far as Rome.\n\nIn 1915, during the First World War, faced with millions of deaths, Pope Benedict XV allowed every priest to celebrate three Masses on that day.","plusLoin":"The choice of the day after All Saints is no accident: after celebrating those already in God's light, the Church prays for those still on their way. It is the communion of saints lived from one day to the next: the Church in heaven, the Church being purified and the Church on earth are one (Catechism, nos. 954-959).","source":"Diocese of Paris; Benedict XV, Apostolic Constitution Incruentum altaris (August 10, 1915); Catechism of the Catholic Church"},"portrait":{"nom":"Saint Odilo of Cluny","dates":"c. 962-1049","accroche":"The monk who gave the world All Souls' Day, and who sold his abbey's treasures to feed the hungry.","texte":"Odilo was born in Auvergne around 962. He entered the abbey of Cluny and became its abbot in 994, for more than half a century.\n\nDuring a great famine, he had the abbey's precious vessels sold to feed the poor. He promoted the “Truce of God”, which forbade fighting on certain days of the week.\n\nHe established in the monasteries of Cluny the prayer for all the dead, on November 2. He died in 1049 at the priory of Souvigny, where he rests.","plusLoin":"With Odilo, prayer for the dead becomes a work of charity: praying for those no one names anymore is loving to the very end. His biographer, the monk Jotsald, reports that he preferred to be judged for too much mercy rather than for too much harshness.","source":"Encyclopædia Britannica, “Saint Odilo”; Nominis (French Bishops' Conference), “Saint Odilon”"},"savaisTu":{"titre":"“Cemetery” means “dormitory”","accroche":"The word itself carries the hope of the first Christians.","texte":"The word “cemetery” comes from the Greek koimētērion, meaning “sleeping place”, “dormitory”. The first Christians chose it for the places where their dead were laid to rest.\n\nFor them, death was like sleep while awaiting the resurrection. Saint Paul already speaks of “them that are asleep” (1 Thessalonians 4).","source":"Oxford English Dictionary, “cemetery”; Merriam-Webster, “cemetery”; 1 Thessalonians 4"},"enfant":{"evangile":{"explication":"Jesus said: “Him that cometh to me, I will not cast out.” Jesus keeps a place close to him for everyone, forever."},"citation":{"texte":"I am not dying; I am entering into life.","auteur":"Saint Thérèse of Lisieux","auteurId":"therese-de-lisieux"},"reflexion":{"titre":"When we miss someone","texte":"Today the Church prays for everyone who has died. It is normal to be sad when someone we love dies. Christians believe that God welcomes those who have died and that we will be able to see them again. We can pray for them: it is a way of going on loving them.","question":"Is there someone you would like to think of in your prayer tonight?"},"histoire":{"titre":"The monks who prayed for everyone","texte":"A very long time ago, in a big monastery called Cluny, lived many monks. Their abbot, Odilo, decided that one day each year they would pray for everyone who had died, even those everyone had forgotten. That day is today."},"portrait":{"nom":"Saint Odilo","texte":"Odilo was the abbot of a big monastery. One year there was not enough food and people were hungry. Odilo had the monastery's precious objects sold to buy food for the poor.","idee":"Today you can light a candle with your parents and say the name of someone who has died."},"sources":"Diocese of Paris, “Talking with children about prayer for the dead”; Catechism of the Catholic Church, no. 958"}}}},"lectionnaire":{"_note":"Évangile de la messe du jour (références AELF, zone France). Le texte vient de la Bible de chaque langue.","jours":{"2026-11-01":{"ref":"Mt 5, 1-12a","osis":"Matt","v":[[5,1],[5,2],[5,3],[5,4],[5,5],[5,6],[5,7],[5,8],[5,9],[5,10],[5,11],[5,12]],"fete":"Solennité","couleur":"blanc"},"2026-11-02":{"ref":"Jn 6, 37-40","osis":"John","v":[[6,37],[6,38],[6,39],[6,40]],"fete":"","couleur":"violet"},"2026-11-03":{"ref":"Lc 14, 15-24","osis":"Luke","v":[[14,15],[14,16],[14,17],[14,18],[14,19],[14,20],[14,21],[14,22],[14,23],[14,24]],"fete":"S. Martin de Porrès, religieux","couleur":"vert"},"2026-11-04":{"ref":"Lc 14, 25-33","osis":"Luke" ,"osis":"John","v":[[20,1],[20,11],[20,12],[20,13],[20,14],[20,15],[20,16],[20,17],[20,18]],"fete":"Fête","couleur":"blanc"},"2027-07-23":{"ref":"Jn 15, 1-8","osis":"John","v":[[15,1],[15,2],[15,3],[15,4],[15,5],[15,6],[15,7],[15,8]],"fete":"Fête","couleur":"blanc"},"2027-07-24":{"ref":"Mt 13, 24-30","osis":"Matt","v":[[13,24],[13,25],[13,26],[13,27],[13,28],[13,29],[13,30]],"fete":"S. Charbel Maklouf, prêtre","couleur":"vert"},"2027-07-25":{"ref":"Jn 6, 1-15","osis":"John","v":[[6,1],[6,2],[6,3],[6,4],[6,5],[6,6],[6,7],[6,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[6,15]],"fete":"","couleur":"vert"},"2027-07-26":{"ref":"Mt 13, 31-35","osis":"Matt","v":[[13,31],[13,32],[13,33],[13,34],[13,35]],"fete":"Ste Anne et S. Joachim, parents de la Vierge Marie Mémoire","couleur":"blanc"}}},"prieresJour":{"_note":"Ora — prières du jour et du soir, pour les adultes et pour les enfants.\nRègle absolue : aucune prière n'est inventée. Deux sources seulement :\n  1. des prières de la Bible (psaumes, cantiques, paroles adressées à Dieu), dont le texte est lu\n     dans la Bible de chaque langue (Crampon, Straubinger, Douay-Rheims) ;\n  2. des prières de la tradition de l'Église, dans leurs versions en usage en France, en Espagne\n     et aux États-Unis.\nDans les prières, le nom divin « Yahweh / Yahvé » est remplacé par « le Seigneur / el Señor »,\ncomme le demande la Congrégation pour le culte divin (lettre du 29 juin 2008).","jours":{"2026-11-01":{"jour":{"id":"litanie-saints","fr":"Vous tous, saints et saintes de Dieu, priez pour nous.","es":"Santos y santas de Dios, rogad por nosotros.","en":"All you holy men and women, saints of God, pray for us.","src":{"fr":"Litanie des saints","es":"Letanías de los santos","en":"Litany of the Saints"}},"soir":{"id":"ps16-11","fr":"Tu me feras connaître le sentier de la vie ; il y a plénitude de joie devant ta face, des délices éternelles dans ta droite.","es":"Tú me harás conocer la senda de la vida, la plenitud del gozo a la vista de tu rostro, las eternas delicias de tu diestra.","en":"Thou hast made known to me the ways of life, thou shalt fill me with joy with thy countenance: at thy right hand are delights even to the end.","src":{"fr":"Ps 16, 11","es":"Sal 16, 11","en":"Ps 16:11"}},"enfantJour":{"id":"signe-de-croix","fr":"Au nom du Père, et du Fils, et du Saint-Esprit. Amen.","es":"En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.","en":"In the name of the Father, and of the Son, and of the Holy Spirit. Amen.","src":{"fr":"Le signe de croix","es":"La señal de la cruz","en":"The Sign of the Cross"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2026-11-02":{"jour":{"id":"requiem","fr":"Seigneur, donne-leur le repos éternel,\net que brille sur eux la lumière sans fin.\nQu'ils reposent en paix. Amen.","es":"Dales, Señor, el descanso eterno,\ny brille para ellos la luz perpetua.\nDescansen en paz. Amén.","en":"Eternal rest grant unto them, O Lord,\nand let perpetual light shine upon them.\nMay they rest in peace. Amen.","src":{"fr":"Prière traditionnelle pour les défunts (Requiem æternam)","es":"Oración tradicional por los difuntos (Requiem æternam)","en":"Traditional prayer for the dead (Requiem æternam)"}},"soir":{"id":"ps130-1","fr":"Du fond de l’abîme je crie vers toi, Seigneur. Seigneur, écoute ma voix ; que tes oreilles soient attentives aux accents de ma prière !","es":"Desde lo más profundo clamo a Ti, Señor, Señor, oye mi voz. Estén tus oídos atentos al grito de mi súplica.","en":"Out of the depths I have cried to thee, O Lord: Lord, hear my voice. Let thy ears be attentive to the voice of my supplication.","src":{"fr":"Ps 130, 1-2","es":"Sal 130, 1-2","en":"Ps 130:1-2"}},"enfantJour":{"id":"1s3-10","fr":"Parlez, car votre serviteur écoute.","es":"Habla, tu siervo escucha.","en":"Speak, Lord, for thy servant heareth.","src":{"fr":"1 S 3, 10","es":"1 Sam 3, 10","en":"1 Sm 3:10"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2026-11-03":{"jour":{"id":"ps5-4","fr":"Seigneur, dès le matin, tu entends ma voix ; dès le matin, je t’offre mes vœux et j’attends.","es":"Desde la mañana va mi voz hacia Ti; temprano te presento mi oración y aguardo.","en":"O Lord, in the morning thou shalt hear my voice.","src":{"fr":"Ps 5, 4","es":"Sal 5, 4","en":"Ps 5:4"}},"soir":{"id":"ps31-6","fr":"Entre tes mains je remets mon esprit ; tu me délivreras, Seigneur, Dieu de vérité !","es":"En tus manos encomiendo mi espíritu. ¡Tú me redimirás, oh Señor, Dios fiel!","en":"Into thy hands I commend my spirit: thou hast redeemed me, O Lord, the God of truth.","src":{"fr":"Ps 31, 6","es":"Sal 31, 6","en":"Ps 31:6"}},"enfantJour":{"id":"ps118-24","fr":"Voici le jour que le Seigneur a fait ; livrons-nous à l’allégresse et à la joie.","es":"Este es el día que hizo Señor; alegrémonos por él y celebrémoslo.","en":"This is the day which the Lord hath made: let us be glad and rejoice therein.","src":{"fr":"Ps 118, 24","es":"Sal 118, 24","en":"Ps 118:24"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2026-11-04":{"jour":{"id":"ps63-2","fr":"Ô Dieu, tu es mon Dieu, je te cherche dès l’aurore ; mon âme a soif de toi, ma chair languit après toi, dans une terre aride, desséchée et sans eau.","es":"Oh Dios, Tú eres el Dios mío, a Ti te busco ansioso; mi alma tiene sed de Ti, y mi carne sin Ti languidece, como (esta) tierra árida y yerma, falta de agua.","en":"O God, my God, to thee do I watch at break of day. For thee my soul hath thirsted; for thee my flesh, O how many ways!","src":{"fr":"Ps 63, 2","es":"Sal 63, 2","en":"Ps 63:2"}},"soir":{"id":"ps91-1","fr":"Celui qui s’abrite sous la protection du Très-Haut repose à l’ombre du Tout-Puissant. Je dis au Seigneur : « Tu es mon refuge et ma forteresse, mon Dieu en qui je me confie.","es":"Tú que te abrigas en el retiro del Altísimo, y descansas a la sombra del Omnipotente, di al Señor: “¡Refugio mío y fortaleza mía, mi Dios, en quien confío!","en":"He that dwelleth in the aid of the most High, shall abide under the protection of the God of Jacob. He shall say to the Lord: Thou art my protector, and my refuge: my God, in him will I trust.","src":{"fr":"Ps 91, 1-2","es":"Sal 91, 1-2","en":"Ps 91:1-2"}},"enfantJour":{"id":"ps136-1","fr":"Célébrez Seigneur, car il est bon, car sa miséricorde est éternelle.","es":"¡Hallelú Yah! Alabad al Señor porque es bueno, porque su misericordia es para siempre.","en":"Alleluia. Praise the Lord, for he is good: for his mercy endureth for ever.","src":{"fr":"Ps 136, 1","es":"Sal 136, 1","en":"Ps 136:1"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2026-11-05":{"jour":{"id":"ps25-4","fr":"Seigneur, fais-moi connaître tes voies, enseigne-moi tes sentiers. Conduis-moi dans ta vérité, et instruis-moi, car tu es le Dieu de mon salut ; tout le jour en toi j’espère.","es":"Muéstrame tus caminos, oh Señor, indícame tus sendas; condúceme a tu verdad e instrúyeme, porque Tú eres el Dios que me salva, y estoy siempre esperándote.","en":"Direct me in thy truth, and teach me; for thou art God my Saviour; and on thee have I waited all the day long. Remember, O Lord, thy bowels of compassion; and thy mercies that are from the beginning of the world.","src":{"fr":"Ps 25, 4-5","es":"Sal 25, 4-5","en":"Ps 25:5-6"}},"soir":{"id":"ps16-1","fr":"Garde-moi ô Dieu, car près de toi je me réfugie.","es":"Presérvame, oh Dios, pues me refugio en Ti.","en":"Preserve me, O Lord, for I have put my trust in thee.","src":{"fr":"Ps 16, 1","es":"Sal 16, 1","en":"Ps 16:1"}},"enfantJour":{"id":"ps139-14","fr":"Je te loue d’avoir fait de moi une créature si merveilleuse ; tes œuvres sont admirables, et mon âme se plaît à le reconnaître.","es":"Te alabo porque te has mostrado maravilloso, porque tus obras son admirables; largamente conoces mi alma.","en":"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.","src":{"fr":"Ps 139, 14","es":"Sal 139, 14","en":"Ps 139:14"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2026-11-06":{"jour":{"id":"ps51-12","fr":"Ô Dieu, crée en moi un cœur pur, et renouvelle au dedans de moi un esprit ferme.","es":"Crea en mí, oh Dios, un corazón sencillo, y renueva en mi interior un espíritu recto.","en":"Create a clean heart in me, O God: and renew a right spirit within my bowels.","src":{"fr":"Ps 51, 12","es":"Sal 51, 12","en":"Ps 51:12"}},"soir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}},"enfantJour":{"id":"gloire-au-pere","fr":"Gloire au Père, et au Fils, et au Saint-Esprit,\ncomme il était au commencement, maintenant et toujours,\net pour les siècles des siècles. Amen.","es":"Gloria al Padre, y al Hijo, y al Espíritu Santo.\nComo era en el principio, ahora y siempre,\npor los siglos de los siglos. Amén.","en":"Glory be to the Father, and to the Son, and to the Holy Spirit,\nas it was in the beginning, is now, and ever shall be,\nworld without end. Amen.","src":{"fr":"Gloire au Père","es":"Gloria","en":"Glory Be"}},"enfantSoir":{"id":"ps121-8","fr":"Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 8","es":"Sal 121, 8","en":"Ps 121:8"}}},"2026-11-07":{"jour":{"id":"ps86-11","fr":"Enseigne-moi tes voies Seigneur ; je veux marcher dans ta fidélité ; attache mon cœur à la crainte de ton nom.","es":"Enséñame, Señor, tu camino para que ande en tu verdad; que mi corazón se alegre en temer tu Nombre.","en":"Conduct me, O Lord, in thy way, and I will walk in thy truth: let my heart rejoice that it may fear thy name.","src":{"fr":"Ps 86, 11","es":"Sal 86, 11","en":"Ps 86:11"}},"soir":{"id":"ps63-7","fr":"Quand je pense à toi sur ma couche, je médite sur toi pendant les veilles de la nuit. Car tu es mon secours, et je suis dans l’allégresse à l’ombre de tes ailes.","es":"Cada vez que me acuerde de Ti en mi lecho y en mis insomnios medite sobre Ti; porque en verdad Tú te hiciste mi amparo, y a la sombra de tus alas me siento feliz.","en":"If I have remembered thee upon my bed, I will meditate on thee in the morning: Because thou hast been my helper. And I will rejoice under the cover of thy wings.","src":{"fr":"Ps 63, 7-8","es":"Sal 63, 7-8","en":"Ps 63:7-8"}},"enfantJour":{"id":"ps150-6","fr":"Que tout ce qui respire loue Seigneur ! Alleluia.","es":"¡Todo lo que respira alabe al Señor! ¡Hallelú Yah!","en":"Let every spirit praise the Lord. Alleluia.","src":{"fr":"Ps 150, 6","es":"Sal 150, 6","en":"Ps 150:5"}},"enfantSoir":{"id":"ps56-4","fr":"Quand je suis dans la crainte, je me confie en toi.","es":"El día en que me invada el temor, confiaré en Ti.","en":"I will trust in thee.","src":{"fr":"Ps 56, 4","es":"Sal 56, 4","en":"Ps 56:4"}}},"2026-11-08":{"jour":{"id":"ps90-14","fr":"Rassasie-nous le matin de ta bonté, et nous serons tous nos jours dans la joie et l’allégresse.","es":"Sácianos con tu misericordia desde temprano, para que nos gocemos y nos alegremos todos nuestros días.","en":"We are filled in the morning with thy mercy: and we have rejoiced, and are delighted all our days.","src":{"fr":"Ps 90, 14","es":"Sal 90, 14","en":"Ps 90:14"}},"soir":{"id":"ps119-55","fr":"La nuit je me rappelle ton nom, Seigneur, et j’observe ta loi.","es":"Durante la noche me acuerdo de tu nombre, oh Señor, y guardaré tu Ley.","en":"In the night I have remembered thy name, O Lord: and have kept thy law.","src":{"fr":"Ps 119, 55","es":"Sal 119, 55","en":"Ps 119:55"}},"enfantJour":{"id":"ps23-1","fr":"Le Seigneur est mon pasteur ; je ne manquerai de rien.","es":"El Señor es mi pastor, nada me faltará.","en":"The Lord ruleth me: and I shall want nothing.","src":{"fr":"Ps 23, 1","es":"Sal 23, 1","en":"Ps 23:1"}},"enfantSoir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el día.","en":"Stay with us, because it is towards evening and the day is now far spent.","src":{"fr":"Lc 24, 29","es":"Lc 24, 29","en":"Lk 24:29"}}},"2026-11-09":{"jour":{"id":"ps143-8","fr":"Fais-moi de bonne heure sentir ta bonté, car c’est en toi que j’espère ; fais-moi connaître la voie où je dois marcher, car c’est vers toi que j’élève mon âme.","es":"Hazme sentir al punto tu misericordia, pues en Ti coloco mi confianza. Muéstrame el camino que debo seguir, ya que hacia Ti levanto mi alma.","en":"Cause me to hear thy mercy in the morning; for in thee have I hoped. Make the way known to me, wherein I should walk: for I have lifted up my soul to thee.","src":{"fr":"Ps 143, 8","es":"Sal 143, 8","en":"Ps 143:8"}},"soir":{"id":"ps121-7","fr":"Le Seigneur te gardera de tout mal, il gardera ton âme : Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"Presérvete el Señor de todo mal; Él guarde tu alma. El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"The Lord keepeth thee from all evil: may the Lord keep thy soul. May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 7-8","es":"Sal 121, 7-8","en":"Ps 121:7-8"}},"enfantJour":{"id":"ps121-2","fr":"Mon secours viendra de Seigneur, qui a fait le ciel et la terre.","es":"Mi socorro viene del Señor que creó el cielo y la tierra.","en":"My help is from the Lord, who made heaven and earth.","src":{"fr":"Ps 121, 2","es":"Sal 121, 2","en":"Ps 121:2"}},"enfantSoir":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}}},"2026-11-10":{"jour":{"id":"ps119-105","fr":"Ta parole est un flambeau devant mes pas, une lumière sur mon sentier.","es":"Antorcha para mis pies es tu palabra, y luz para mi senda.","en":"Thy word is a lamp to my feet, and a light to my paths.","src":{"fr":"Ps 119, 105","es":"Sal 119, 105","en":"Ps 119:105"}},"soir":{"id":"ps134","fr":"Voici donc, bénissez Seigneur, vous tous, serviteurs de Seigneur, qui êtes de service dans la maison de Seigneur, pendant les nuits !… Levez les mains vers le sanctuaire, et bénissez le Seigneur.","es":"Ea, bendecid a Señor, todos los siervos de Señor, los que estáis en la casa de Señor, en las horas de la noche. Alzad vuestras manos hacia el Santuario, y bendecid al Señor.","en":"Behold now bless ye the Lord, all ye servants of the Lord: Who stand in the house of the Lord, in the courts of the house of our God. In the nights lift up your hands to the holy places, and bless ye the Lord.","src":{"fr":"Ps 134, 1-2","es":"Sal 134, 1-2","en":"Ps 134:1-2"}},"enfantJour":{"id":"jn21-17","fr":"Seigneur, vous connaissez toutes choses, vous savez bien que je vous aime.","es":"Señor, Tú lo sabes todo. Tú sabes que yo te quiero.","en":"Lord, thou knowest all things: thou knowest that I love thee.","src":{"fr":"Jn 21, 17","es":"Jn 21, 17","en":"Jn 21:17"}},"enfantSoir":{"id":"ps91-11","fr":"Car il ordonnera à ses anges de te garder dans toutes tes voies.","es":"Pues Él te ha encomendado a sus ángeles, para que te guarden en todos tus caminos.","en":"For he hath given his angels charge over thee; to keep thee in all thy ways.","src":{"fr":"Ps 91, 11","es":"Sal 91, 11","en":"Ps 91:11"}}},"2026-11-11":{"jour":{"id":"ps16-11","fr":"Tu me feras connaître le sentier de la vie ; il y a plénitude de joie devant ta face, des délices éternelles dans ta droite.","es":"Tú me harás conocer la senda de la vida, la plenitud del gozo a la vista de tu rostro, las eternas delicias de tu diestra.","en":"Thou hast made known to me the ways of life, thou shalt fill me with joy with thy countenance: at thy right hand are delights even to the end.","src":{"fr":"Ps 16, 11","es":"Sal 16, 11","en":"Ps 16:11"}},"soir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}},"enfantJour":{"id":"ps8-2","fr":"Seigneur, notre Seigneur, que ton nom est glorieux sur toute la terre ! Toi qui as revêtu les cieux de ta majesté !","es":"¡Oh Señor, Señor nuestro, cuán admirable es tu Nombre en toda la tierra! Tú, cuya gloria cantan los cielos.","en":"O Lord, our Lord, how admirable is thy name in the whole earth! For thy magnificence is elevated above the heavens.","src":{"fr":"Ps 8, 2","es":"Sal 8, 2","en":"Ps 8:2"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2026-11-12":{"jour":{"id":"ps27-1","fr":"Le Seigneur est ma lumière et mon salut : qui craindrais-je ? Le Seigneur est le rempart de ma vie : de qui aurais-je peur ?","es":"El Señor es mi luz y mi socorro; ¿a quién temeré? La defensa de mi vida es Señor; ¿ante quién podré temblar?","en":"The Lord is my light and my salvation, whom shall I fear? The Lord is the protector of my life: of whom shall I be afraid?","src":{"fr":"Ps 27, 1","es":"Sal 27, 1","en":"Ps 27:1"}},"soir":{"id":"ps51-3","fr":"Aie pitié de moi, ô Dieu, selon ta bonté ; selon ta grande miséricorde efface mes transgressions. Lave-moi complètement de mon iniquité, et purifie-moi de mon péché.","es":"Ten compasión de mí, oh Dios, en la medida de tu misericordia; según la grandeza de tus bondades, borra mi iniquidad. Lávame a fondo de mi culpa, límpiame de mi pecado.","en":"Have mercy on me, O God, according to thy great mercy. And according to the multitude of thy tender mercies blot out my iniquity. Wash me yet more from my iniquity, and cleanse me from my sin.","src":{"fr":"Ps 51, 3-4","es":"Sal 51, 3-4","en":"Ps 51:3-4"}},"enfantJour":{"id":"ps100-2","fr":"Servez le Seigneur avec joie, venez en sa présence avec allégresse !","es":"Aclamad a Señor, tierras todas, servid al Señor con alegría, llegaos a su presencia con exultación.","en":"Sing joyfully to God, all the earth: serve ye the Lord with gladness. Come in before his presence with exceeding great joy.","src":{"fr":"Ps 100, 2","es":"Sal 100, 2","en":"Ps 100:2"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2026-11-13":{"jour":{"id":"ps19-15","fr":"Accueille avec faveur les paroles de ma bouche, et les sentiments de mon cœur, devant toi, Seigneur, mon rocher et mon libérateur !","es":"Hallen favor ante Ti estas palabras de mi boca y los anhelos de mi corazón, oh Señor, Roca mía y Redentor mío.","en":"And the words of my mouth shall be such as may please: and the meditation of my heart always in thy sight. O Lord, my helper and my Redeemer.","src":{"fr":"Ps 19, 15","es":"Sal 19, 15","en":"Ps 19:15"}},"soir":{"id":"ps86-1","fr":"Prête l’oreille, Seigneur, exauce-moi, car je suis malheureux et indigent. Garde mon âme, car je suis pieux ; sauve ton serviteur, ô mon Dieu ; il met sa confiance en toi.","es":"Inclina, Señor, tu oído y escúchame, porque soy desvalido y necesitado. Preserva mi vida porque soy santo; salva a tu siervo que espera en Ti.","en":"Incline thy ear, O Lord, and hear me: for I am needy and poor. Preserve my soul, for I am holy: save thy servant, O my God, that trusteth in thee.","src":{"fr":"Ps 86, 1-2","es":"Sal 86, 1-2","en":"Ps 86:1-2"}},"enfantJour":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2026-11-14":{"jour":{"id":"ps139-23","fr":"Sonde-moi, ô Dieu, et connais mon cœur ; éprouve-moi, et connais mes pensées. Regarde si je suis sur une voie funeste, et conduis-moi dans la voie éternelle.","es":"Escudríñame, oh Dios, y explora mi corazón, examíname y observa mi intimidad; mira si ando por el falso camino, y condúceme por la senda antigua.","en":"Prove me, O God, and know my heart: examine me, and know my paths. And see if there be in me the way of iniquity: and lead me in the eternal way.","src":{"fr":"Ps 139, 23-24","es":"Sal 139, 23-24","en":"Ps 139:23-24"}},"soir":{"id":"ps88-2","fr":"Seigneur, Dieu de mon salut, quand je crie la nuit devant toi, que ma prière arrive en ta présence, prête l’oreille à mes supplications !","es":"Señor, Dios de mi salud, día y noche clamo en tu presencia. Llegue hasta Ti mi oración, inclina tu oído a mi clamor.","en":"O Lord, the God of my salvation: I have cried in the day, and in the night before thee. Let my prayer come in before thee: incline thy ear to my petition.","src":{"fr":"Ps 88, 2-3","es":"Sal 88, 2-3","en":"Ps 88:2-3"}},"enfantJour":{"id":"ps34-2","fr":"Je veux bénir le Seigneur en tout temps ; sa louange sera toujours dans ma bouche.","es":"Quiero bendecir al Señor en todo tiempo, tener siempre en mi boca su alabanza.","en":"I will bless the Lord at all times, his praise shall be always in my mouth.","src":{"fr":"Ps 34, 2","es":"Sal 34, 2","en":"Ps 34:2"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2026-11-15":{"jour":{"id":"ps145-1","fr":"Je veux t’exalter, mon Dieu, ô Roi, et bénir ton nom à jamais et toujours. Je veux chaque jour te bénir, et célébrer ton nom toujours et à jamais.","es":"A Ti, mi Dios Rey, ensalzaré, y por los siglos de los siglos bendeciré tu Nombre. Te bendeciré cada día; y alabaré tu Nombre por los siglos de los siglos.","en":"I will extol thee, O God my king: and I will bless thy name for ever; yea, for ever and ever. Every day will I bless thee: and I will praise thy name for ever; yea, for ever and ever.","src":{"fr":"Ps 145, 1-2","es":"Sal 145, 1-2","en":"Ps 145:1-2"}},"soir":{"id":"ps103-13","fr":"Comme un père a compassion de ses enfants, Seigneur a compassion de ceux qui le craignent.","es":"Como un padre que se apiada de sus hijos, así el Señor se compadece de los que le temen.","en":"As a father hath compassion on his children, so hath the Lord compassion on them that fear him.","src":{"fr":"Ps 103, 13","es":"Sal 103, 13","en":"Ps 103:13"}},"enfantJour":{"id":"signe-de-croix","fr":"Au nom du Père, et du Fils, et du Saint-Esprit. Amen.","es":"En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.","en":"In the name of the Father, and of the Son, and of the Holy Spirit. Amen.","src":{"fr":"Le signe de croix","es":"La señal de la cruz","en":"The Sign of the Cross"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2026-11-16":{"jour":{"id":"ps92-2","fr":"Il est bon de louer Seigneur, et de célébrer ton nom, ô Très-Haut, de publier le matin ta bonté, et ta fidélité pendant la nuit.","es":"Bueno es alabar a Señor, y cantar a tu Nombre, oh Altísimo; anunciar al alba tu misericordia y por las noches tu fidelidad.","en":"It is good to give praise to the Lord: and to sing to thy name, O most High. To shew forth thy mercy in the morning, and thy truth in the night.","src":{"fr":"Ps 92, 2-3","es":"Sal 92, 2-3","en":"Ps 92:2-3"}},"soir":{"id":"ps116-7","fr":"Mon âme, retourne à ton repos ; car le Seigneur te comble de biens.","es":"Vuelve, alma mía, a tu sosiego, porque el Señor te ha favorecido.","en":"Turn, O my soul, into thy rest: for the Lord hath been bountiful to thee.","src":{"fr":"Ps 116, 7","es":"Sal 116, 7","en":"Ps 116:7"}},"enfantJour":{"id":"1s3-10","fr":"Parlez, car votre serviteur écoute.","es":"Habla, tu siervo escucha.","en":"Speak, Lord, for thy servant heareth.","src":{"fr":"1 S 3, 10","es":"1 Sam 3, 10","en":"1 Sm 3:10"}},"enfantSoir":{"id":"ps121-8","fr":"Le Seigneur gardera ton départ et ton arrivée maintenant et à jamais.","es":"El Señor custodiará tu salida y tu llegada, ahora y para siempre.","en":"May the Lord keep thy coming in and thy going out; from henceforth now and for ever.","src":{"fr":"Ps 121, 8","es":"Sal 121, 8","en":"Ps 121:8"}}},"2026-11-17":{"jour":{"id":"ps59-17","fr":"Et moi, je chanterai ta force, et le matin je célébrerai ta bonté ; car tu es ma forteresse, un refuge au jour de mon angoisse.","es":"Entretanto, yo cantaré tu potencia, y desde la mañana saltaré de gozo por tu misericordia; porque fuiste mi protector, y mi refugio en el día de la tribulación.","en":"But I will sing thy strength: and will extol thy mercy in the morning. For thou art become my support, and my refuge, in the day of my trouble.","src":{"fr":"Ps 59, 17","es":"Sal 59, 17","en":"Ps 59:17"}},"soir":{"id":"ps130-1","fr":"Du fond de l’abîme je crie vers toi, Seigneur. Seigneur, écoute ma voix ; que tes oreilles soient attentives aux accents de ma prière !","es":"Desde lo más profundo clamo a Ti, Señor, Señor, oye mi voz. Estén tus oídos atentos al grito de mi súplica.","en":"Out of the depths I have cried to thee, O Lord: Lord, hear my voice. Let thy ears be attentive to the voice of my supplication.","src":{"fr":"Ps 130, 1-2","es":"Sal 130, 1-2","en":"Ps 130:1-2"}},"enfantJour":{"id":"ps118-24","fr":"Voici le jour que le Seigneur a fait ; livrons-nous à l’allégresse et à la joie.","es":"Este es el día que hizo Señor; alegrémonos por él y celebrémoslo.","en":"This is the day which the Lord hath made: let us be glad and rejoice therein.","src":{"fr":"Ps 118, 24","es":"Sal 118, 24","en":"Ps 118:24"}},"enfantSoir":{"id":"ps56-4","fr":"Quand je suis dans la crainte, je me confie en toi.","es":"El día en que me invada el temor, confiaré en Ti.","en":"I will trust in thee.","src":{"fr":"Ps 56, 4","es":"Sal 56, 4","en":"Ps 56:4"}}},"2026-11-18":{"jour":{"id":"ps18-2","fr":"Il dit : Je t’aime, Seigneur, ma force ! Le Seigneur mon rocher, ma forteresse, mon libérateur, mon Dieu, mon roc où je trouve un asile, mon bouclier, la corne de mon salut, ma citadelle !","es":"Y dijo: Te amo, Señor, fortaleza mía, mi peña, mi baluarte, mi libertador, Dios mío, mi roca, mi refugio, broquel mío, cuerno de mi salud, asilo mío.","en":"I will love thee, O Lord, my strength: The Lord is my firmament, my refuge, and my deliverer. My God is my helper, and in him will I put my trust. My protector, and the horn of my salvation, and my support.","src":{"fr":"Ps 18, 2-3","es":"Sal 18, 2-3","en":"Ps 18:2-3"}},"soir":{"id":"ps130-5","fr":"J’espère dans le Seigneur ; mon âme espère, et j’attends sa parole. Mon âme aspire après le Seigneur plus que les guetteurs n’aspirent après l’aurore.","es":"Espero en el Señor, mi alma confía en su palabra. Aguardando está mi alma al Señor, más que los centinelas el alba. Más que los centinelas con la aurora.","en":"My soul hath hoped in the Lord. From the morning watch even until night, let Israel hope in the Lord.","src":{"fr":"Ps 130, 5-6","es":"Sal 130, 5-6","en":"Ps 130:5-6"}},"enfantJour":{"id":"ps136-1","fr":"Célébrez Seigneur, car il est bon, car sa miséricorde est éternelle.","es":"¡Hallelú Yah! Alabad al Señor porque es bueno, porque su misericordia es para siempre.","en":"Alleluia. Praise the Lord, for he is good: for his mercy endureth for ever.","src":{"fr":"Ps 136, 1","es":"Sal 136, 1","en":"Ps 136:1"}},"enfantSoir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el día.","en":"Stay with us, because it is towards evening and the day is now far spent.","src":{"fr":"Lc 24, 29","es":"Lc 24, 29","en":"Lk 24:29"}}},"2026-11-19":{"jour":{"id":"ps23-1","fr":"Le Seigneur est mon pasteur ; je ne manquerai de rien.","es":"El Señor es mi pastor, nada me faltará.","en":"The Lord ruleth me: and I shall want nothing.","src":{"fr":"Ps 23, 1","es":"Sal 23, 1","en":"Ps 23:1"}},"soir":{"id":"ps131-2","fr":"Non ! Je tiens mon âme dans le calme et le silence. Comme un enfant sevré sur le sein de sa mère, comme l’enfant sevré mon âme est en moi.","es":"Lejos de eso, he hecho a mi alma quieta y apaciguada como un niño que se recuesta sobre el pecho de su madre; como ese niño, está mi alma en mí.","en":"As a child that is weaned is towards his mother, so reward in my soul.","src":{"fr":"Ps 131, 2","es":"Sal 131, 2","en":"Ps 131:2"}},"enfantJour":{"id":"ps139-14","fr":"Je te loue d’avoir fait de moi une créature si merveilleuse ; tes œuvres sont admirables, et mon âme se plaît à le reconnaître.","es":"Te alabo porque te has mostrado maravilloso, porque tus obras son admirables; largamente conoces mi alma.","en":"I will praise thee, for thou art fearfully magnified: wonderful are thy works, and my soul knoweth right well.","src":{"fr":"Ps 139, 14","es":"Sal 139, 14","en":"Ps 139:14"}},"enfantSoir":{"id":"je-vous-salue-marie","fr":"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort. Amen.","es":"Dios te salve, María, llena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.","en":"Hail Mary, full of grace, the Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death. Amen.","src":{"fr":"Je vous salue Marie","es":"Avemaría","en":"Hail Mary"}}},"2026-11-20":{"jour":{"id":"ps62-2","fr":"Oui, à Dieu mon âme en paix s’abandonne, de lui vient mon secours. Oui, il est mon rocher et mon salut ; il est ma forteresse : je ne serai pas tout à fait ébranlé.","es":"Solo en Dios se descansa, oh alma mía, porque la salud viene de Él. Él solo es mi roca, mi salvación, mi defensa: nunca seré conmovido.","en":"Shall not my soul be subject to God? for from him is my salvation. For he is my God and my saviour: he is my protector, I shall be moved no more.","src":{"fr":"Ps 62, 2-3","es":"Sal 62, 2-3","en":"Ps 62:2-3"}},"soir":{"id":"ps143-1","fr":"Seigneur, écoute ma prière ; prête l’oreille à mes supplications ; exauce-moi dans ta vérité et dans ta justice.","es":"Señor, escucha mi oración, presta oído a mi súplica según tu fidelidad; óyeme por tu justicia.","en":"Hear, O Lord, my prayer: give ear to my supplication in thy truth: hear me in thy justice.","src":{"fr":"Ps 143, 1","es":"Sal 143, 1","en":"Ps 143:1"}},"enfantJour":{"id":"gloire-au-pere","fr":"Gloire au Père, et au Fils, et au Saint-Esprit,\ncomme il était au commencement, maintenant et toujours,\net pour les siècles des siècles. Amen.","es":"Gloria al Padre, y al Hijo, y al Espíritu Santo.\nComo era en el principio, ahora y siempre,\npor los siglos de los siglos. Amén.","en":"Glory be to the Father, and to the Son, and to the Holy Spirit,\nas it was in the beginning, is now, and ever shall be,\nworld without end. Amen.","src":{"fr":"Gloire au Père","es":"Gloria","en":"Glory Be"}},"enfantSoir":{"id":"ps91-11","fr":"Car il ordonnera à ses anges de te garder dans toutes tes voies.","es":"Pues Él te ha encomendado a sus ángeles, para que te guarden en todos tus caminos.","en":"For he hath given his angels charge over thee; to keep thee in all thy ways.","src":{"fr":"Ps 91, 11","es":"Sal 91, 11","en":"Ps 91:11"}}},"2026-11-21":{"jour":{"id":"ps73-25","fr":"Quel autre que toi ai-je au ciel ? Avec toi, je ne désire rien sur la terre. Ma chair et mon cœur se consument : le rocher de mon cœur et mon partage, c’est Dieu à jamais.","es":"¿Quién hay para mí en el cielo sino Tú? Y si contigo estoy ¿qué podrá deleitarme en la tierra? La carne y el corazón mío desfallecen, la roca de mi corazón es Dios, herencia mía para siempre.","en":"For what have I in heaven? and besides thee what do I desire upon earth? For thee my flesh and my heart hath fainted away: thou art the God of my heart, and the God that is my portion for ever.","src":{"fr":"Ps 73, 25-26","es":"Sal 73, 25-26","en":"Ps 73:25-26"}},"soir":{"id":"ps143-10","fr":"Apprends-moi à faire ta volonté, car tu es mon Dieu. Que ton bon esprit me conduise dans la voie droite !","es":"Enséñame a hacer tu voluntad, porque Tú eres mi Dios. Tu Espíritu es bueno; guíame, pues, por camino llano.","en":"Teach me to do thy will, for thou art my God. Thy good spirit shall lead me into the right land.","src":{"fr":"Ps 143, 10","es":"Sal 143, 10","en":"Ps 143:10"}},"enfantJour":{"id":"ps150-6","fr":"Que tout ce qui respire loue Seigneur ! Alleluia.","es":"¡Todo lo que respira alabe al Señor! ¡Hallelú Yah!","en":"Let every spirit praise the Lord. Alleluia.","src":{"fr":"Ps 150, 6","es":"Sal 150, 6","en":"Ps 150:5"}},"enfantSoir":{"id":"ange-de-dieu","fr":"Ange de Dieu, qui êtes mon gardien,\net à qui j'ai été confié par la bonté divine,\néclairez-moi, protégez-moi,\ndirigez-moi et gouvernez-moi. Amen.","es":"Ángel de la guarda, dulce compañía,\nno me desampares ni de noche ni de día. Amén.","en":"Angel of God, my guardian dear,\nto whom God's love commits me here,\never this day be at my side,\nto light and guard, to rule and guide. Amen.","src":{"fr":"Prière à l'ange gardien","es":"Oración al ángel de la guarda","en":"Prayer to the guardian angel"}}},"2026-11-22":{"jour":{"id":"ps84-2","fr":"Que tes demeures sont aimables, Seigneur des armées ! Mon âme s’épuise en soupirant après les parvis de Seigneur ; mon cœur et ma chair tressaillent vers le Dieu vivant.","es":"¡Oh cuan amable es tu morada, Señor de los ejércitos! Suspirando, desfalleciendo, anhela mi alma los atrios del Señor. Mi corazón y mi carne claman ansiosos hacia el Dios vivo.","en":"How lovely are thy tabernacles, O Lord of hosts! my soul longeth and fainteth for the courts of the Lord. My heart and my flesh have rejoiced in the living God.","src":{"fr":"Ps 84, 2-3","es":"Sal 84, 2-3","en":"Ps 84:2-3"}},"soir":{"id":"ps145-18","fr":"Le Seigneur est près de tous ceux qui l’invoquent, de tous ceux qui l’invoquent d’un cœur sincère.","es":"El Señor cerca está de cuantos le invocan, de todos los que le invocan de veras.","en":"The Lord is nigh unto all them that call upon him: to all that call upon him in truth.","src":{"fr":"Ps 145, 18","es":"Sal 145, 18","en":"Ps 145:18"}},"enfantJour":{"id":"ps23-1","fr":"Le Seigneur est mon pasteur ; je ne manquerai de rien.","es":"El Señor es mi pastor, nada me faltará.","en":"The Lord ruleth me: and I shall want nothing.","src":{"fr":"Ps 23, 1","es":"Sal 23, 1","en":"Ps 23:1"}},"enfantSoir":{"id":"ps4-9","fr":"En paix je me coucherai et je m’endormirai aussitôt ; car toi, Seigneur, toi seul, tu me fais habiter dans la sécurité.","es":"Apenas me acuesto, me duermo en paz, porque Tú me das seguridad, oh Señor.","en":"In peace in the self same I will sleep, and I will rest.","src":{"fr":"Ps 4, 9","es":"Sal 4, 9","en":"Ps 4:9"}}},"2026-11-23":{"jour":{"id":"ps103-1","fr":"Mon âme, bénis Seigneur, et que tout ce qui est en moi bénisse son saint nom ! Mon âme, bénis Seigneur, et n’oublie pas ses nombreux bienfaits.","es":"Bendice a Señor, alma mía, y todo cuanto hay en mí bendiga su santo Nombre. Bendice a Señor, alma mía, y no quieras olvidar todos sus favores.","en":"Bless the Lord, O my soul: and let all that is within me bless his holy name. Bless the Lord, O my soul, and never forget all he hath done for thee.","src":{"fr":"Ps 103, 1-2","es":"Sal 103, 1-2","en":"Ps 103:1-2"}},"soir":{"id":"ps147-3","fr":"Il guérit ceux qui ont le cœur brisé, et il panse leurs blessures.","es":"Él quien sana a los de corazón llagado, y venda sus heridas.","en":"Who healeth the broken of heart, and bindeth up their bruises.","src":{"fr":"Ps 147, 3","es":"Sal 147, 3","en":"Ps 147:3"}},"enfantJour":{"id":"ps121-2","fr":"Mon secours viendra de Seigneur, qui a fait le ciel et la terre.","es":"Mi socorro viene del Señor que creó el cielo y la tierra.","en":"My help is from the Lord, who made heaven and earth.","src":{"fr":"Ps 121, 2","es":"Sal 121, 2","en":"Ps 121:2"}},"enfantSoir":{"id":"ps3-6","fr":"Je me suis couché et me suis endormi ; je me suis réveillé, car le Seigneur est mon soutien.","es":"Me acuesto y me duermo, y despierto incólume, porque el Señor me sostiene.","en":"I have slept and have taken my rest: and I have risen up, because the Lord hath protected me.","src":{"fr":"Ps 3, 6","es":"Sal 3, 6","en":"Ps 3:6"}}},"2026-11-24":{"jour":{"id":"ps104-1","fr":"Mon âme, bénis Seigneur ! Seigneur, mon Dieu, tu es infiniment grand, Tu es revêtu de majesté et de splendeur !","es":"¡Bendice a Señor, alma mía! ¡Señor, Dios mío, cuán grande eres! Te has vestido de majestad y de belleza.","en":"Bless the Lord, O my soul: O Lord my God, thou art exceedingly great. Thou hast put on praise and beauty.","src":{"fr":"Ps 104, 1","es":"Sal 104, 1","en":"Ps 104:1"}},"soir":{"id":"lc2-29","fr":"Maintenant, ô Maître, vous laissez partir votre serviteur En paix, selon votre parole ; Puisque mes yeux ont vu votre salut, Que vous avez préparé à la face de tous les peuples : Lumière qui doit dissiper les ténèbres des Nations Et gloire d’Israël, votre peuple.","es":"Ahora, Señor, despides a tu siervo en paz, según tu palabra, porque han visto mis ojos tu salvación, que preparaste a la faz de todos los pueblos. Luz para revelarse a los gentiles, y para gloria de Israel, tu pueblo.","en":"Now thou dost dismiss thy servant, O Lord, according to thy word in peace: Because my eyes have seen thy salvation, Which thou hast prepared before the face of all peoples: A light to the revelation of the Gentiles and the glory of thy people Israel.","src":{"fr":"Lc 2, 29-32","es":"Lc 2, 29-32","en":"Lk 2:29-32"}},"enfantJour":{"id":"jn21-17","fr":"Seigneur, vous connaissez toutes choses, vous savez bien que je vous aime.","es":"Señor, Tú lo sabes todo. Tú sabes que yo te quiero.","en":"Lord, thou knowest all things: thou knowest that I love thee.","src":{"fr":"Jn 21, 17","es":"Jn 21, 17","en":"Jn 21:17"}},"enfantSoir":{"id":"ps17-8","fr":"Garde-moi comme la prunelle de l’œil ; à l’ombre de tes ailes mets-moi à couvert .","es":"Cuídame como a la niña de tus ojos, escóndeme bajo la sombra de tus alas.","en":"Keep me, as the apple of thy eye. Protect me under the shadow of thy wings.","src":{"fr":"Ps 17, 8","es":"Sal 17, 8","en":"Ps 17:8"}}},"2026-11-25":{"jour":{"id":"ps113-1","fr":"Alleluia ! Louez, serviteurs de Seigneur, louez le nom de Seigneur, Que le nom du Seigneur soit béni, dès maintenant et à jamais ! Du lever du soleil jusqu’à son couchant, loué soit le nom de Seigneur !","es":"¡Hallelú Yah! Alabad, siervos de Señor, alabad el Nombre del Señor. Sea bendito el Nombre de Señor, desde ahora y para siempre. Desde el nacimiento del sol hasta su ocaso sea ensalzado el Nombre del Señor.","en":"Praise the Lord, ye children: praise ye the name of the Lord. Blessed be the name of the Lord, from henceforth now and for ever. From the rising of the sun unto the going down of the same, the name of the Lord is worthy of praise.","src":{"fr":"Ps 113, 1-3","es":"Sal 113, 1-3","en":"Ps 113:1-3"}},"soir":{"id":"lc23-46","fr":"Père, je remets mon esprit entre vos mains.","es":"Padre, en tus manos entrego mi espíritu.","en":"Father, into thy hands I commend my spirit.","src":{"fr":"Lc 23, 46","es":"Lc 23, 46","en":"Lk 23:46"}},"enfantJour":{"id":"ps8-2","fr":"Seigneur, notre Seigneur, que ton nom est glorieux sur toute la terre ! Toi qui as revêtu les cieux de ta majesté !","es":"¡Oh Señor, Señor nuestro, cuán admirable es tu Nombre en toda la tierra! Tú, cuya gloria cantan los cielos.","en":"O Lord, our Lord, how admirable is thy name in the whole earth! For thy magnificence is elevated above the heavens.","src":{"fr":"Ps 8, 2","es":"Sal 8, 2","en":"Ps 8:2"}},"enfantSoir":{"id":"notre-pere","fr":"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal. Amen.","es":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos a los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.","en":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done on earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil. Amen.","src":{"fr":"Notre Père (Mt 6, 9-13)","es":"Padrenuestro (Mt 6, 9-13)","en":"The Our Father (Mt 6:9-13)"}}},"2026-11-26":{"jour":{"id":"ps117","fr":"Nations, louez toutes Seigneur ; peuples, célébrez-le tous ! Car sa bonté pour nous est grande, et la vérité du Seigneur subsiste à jamais. Alleluia !","es":"¡Hallelú Yah! Alabad a Señor, naciones todas, celebradle todos los pueblos; pues su misericordia se ha confirmado sobre nosotros, y la fidelidad del Señor permanece para siempre.","en":"O Praise the Lord, all ye nations: praise him, all ye people. For his mercy is confirmed upon us: and the truth of the Lord remaineth for ever.","src":{"fr":"Ps 117, 1-2","es":"Sal 117, 1-2","en":"Ps 117:1-2"}},"soir":{"id":"lc24-29","fr":"Reste avec nous, car il se fait tard, et déjà le jour baisse.","es":"Quédate con nosotros, porque es tarde, y ya ha declinado el
