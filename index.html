<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ora</title>
<meta name="description" content="Ora, une app des premiers pas vers Dieu : la fête du jour, une prière, une idée simple.">
<meta name="theme-color" content="#FFFBF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* Ora — feuille de style. Palette « aube » (jour) et « veille » (soir). */
:root {
  --fond: #FFFBF5;
  --encre: #2F2924;
  --doux: #62554B;
  --discret: #6E6056;
  --or: #80612F;
  --anneau: rgba(196, 152, 84, .6);
  --filet: rgba(47, 41, 36, .1);
  --verre: rgba(255, 251, 245, .72);
  --puce: #2F2924;
  --puce-texte: #FFFBF5;
  --carte: rgba(255, 255, 255, .55);
  --logo-anneau: #D4AE6A;
  --logo-ombre: rgba(214, 170, 104, .6);
  --astre: #F2E5C6;
  --police: 'Sora', system-ui, -apple-system, sans-serif;
  --lent: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
:root.nuit {
  --fond: #161E35;
  --encre: #EFE9DE;
  --doux: #B9BECB;
  --discret: #B9BECB;
  --or: #E6C98F;
  --anneau: rgba(230, 201, 143, .55);
  --filet: rgba(239, 233, 222, .14);
  --verre: rgba(30, 40, 68, .72);
  --puce: #EFE9DE;
  --puce-texte: #161E35;
  --carte: rgba(255, 255, 255, .05);
  --logo-anneau: #E6C98F;
  --logo-ombre: rgba(230, 196, 140, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
html, body { margin: 0; background: var(--fond); color: var(--encre); }
body {
  font-family: var(--police); font-weight: 300; line-height: 1.55;
  -webkit-font-smoothing: antialiased; min-height: 100dvh;
  transition: background-color 1.2s ease, color 1.2s ease;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--or); }
:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; border-radius: 6px; }

/* Ciel peint */
.ciel { position: absolute; inset: 0 0 auto 0; height: 470px; pointer-events: none; z-index: 0; overflow: hidden; }
.couches { position: absolute; inset: 0; }
.couche { position: absolute; }
.couche canvas { display: block; }
:root:not(.nuit) .couches { opacity: .6; } /* le jour : des lavis plus légers, plus lumineux */
.ciel .fondu { position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(180deg, transparent, var(--fond)); }
.ciel.efface { opacity: .0; transition: opacity 1s ease; }
.ciel.discret { opacity: .35; transition: opacity 1s ease; }
.astre { position: absolute; width: 56px; height: 56px; right: calc(50% - 109px); top: 140px; animation: monte 6s var(--lent) .3s both; }
:root.nuit .astre { top: 126px; }
.astre .aura { position: absolute; left: -52px; top: -52px; width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(232,190,120,.42) 0%, rgba(232,190,120,.16) 40%, rgba(232,190,120,0) 70%); }
:root.nuit .astre .aura { background: radial-gradient(circle, rgba(232,200,140,.32) 0%, rgba(232,200,140,.12) 40%, rgba(232,200,140,0) 70%); }
.astre .halo { position: absolute; inset: -20px; border-radius: 50%; border: 1px solid var(--anneau); animation: halo 9s ease-in-out infinite; } /* le fin cercle respire lentement */
.astre .disque { position: absolute; inset: 0; border-radius: 50%; background: var(--astre); box-shadow: -2px 1.5px 0 0 rgba(214,170,104,.5); }
:root.nuit .astre .disque { box-shadow: -2px 1.5px 0 0 rgba(230,196,140,.45); }
.etoile { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #EFE9DE; opacity: .6; }
@keyframes monte { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
@keyframes respire { 0%,100% { opacity: .8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes halo { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes scintille { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
@keyframes apparait { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Mise en page */
.app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100dvh; padding: 0; display: flex; flex-direction: column; }
.app main { flex: 1; }
.entete { position: sticky; top: 0; z-index: 8; display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 22px) 24px 0; min-height: 80px; pointer-events: none; }
.entete > * { pointer-events: auto; }
.logo { display: inline-flex; color: var(--encre); border-radius: 999px; transition: width .6s var(--lent), background-color .6s ease; }
.logo .logo-ra { transition: opacity .5s ease; }
/* Au défilement : il ne reste que le « O », qui ramène en haut ; les réglages s'effacent. */
:root.defile .logo .logo-ra { opacity: 0; }
.logo { width: 68px; overflow: hidden; padding: 6px; margin: -6px; box-sizing: content-box; }
.logo svg { flex: 0 0 auto; }
:root.defile .logo { width: 26px; background: var(--verre); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 16px rgba(60,45,30,.08); }
.puce-niveau { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; overflow: hidden; transition: padding .6s var(--lent), width .6s var(--lent); }
.puce-niveau .menu-icone { position: absolute; left: 50%; top: 50%; margin: -10px 0 0 -10px; opacity: 0; transform: scale(.7); transition: opacity .5s ease, transform .6s var(--lent); }
.puce-niveau .menu-mot { transition: opacity .4s ease; }
/* Au défilement, « Menu » devient une petite icône : trois traits dont le premier porte une croix dorée. */
:root.defile .puce-niveau { width: 44px; padding: 0; }
:root.defile .puce-niveau .menu-mot { opacity: 0; }
:root.defile .puce-niveau .menu-icone { opacity: 1; transform: none; }

/* La mer de nuages, en bas de chaque page */
.mer-bas { position: relative; height: 180px; margin-top: 56px; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 45%); mask-image: linear-gradient(180deg, transparent 0, #000 45%); }
.mer-bas .couche { position: absolute; }
.mer-bas .couche canvas { display: block; }
:root:not(.nuit) .mer-bas { opacity: .7; }
.logo svg { overflow: visible; display: block; }

.puce-niveau { font-size: .75rem; font-weight: 500; height: 44px; width: 72px; padding: 0 16px; border-radius: 999px;
  background: var(--verre); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--filet); }
.vue { padding: 0 28px; }
.vue.entre > * { animation: apparait 1.2s var(--lent) both; }
.vue.entre > *:nth-child(2) { animation-delay: .12s; } .vue.entre > *:nth-child(3) { animation-delay: .24s; }
.vue.entre > *:nth-child(4) { animation-delay: .36s; } .vue.entre > *:nth-child(5) { animation-delay: .48s; }
.accueil { padding-top: 300px; }
.accueil.anime > * { animation-delay: 1.6s; }
.accueil.anime > *:nth-child(2) { animation-delay: 1.8s; } .accueil.anime > *:nth-child(3) { animation-delay: 2s; } .accueil.anime > *:nth-child(4) { animation-delay: 2.2s; }
.surtitre { margin: 0 0 12px; font-size: .6875rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--discret); }
h1 { margin: 0; font-weight: 200; font-size: 2.75rem; line-height: 1.1; letter-spacing: -.02em; }
h2 { margin: 0 0 8px; font-weight: 300; font-size: 1.75rem; line-height: 1.15; letter-spacing: -.01em; }
.chapeau { margin: 12px 0 0; font-size: .9375rem; line-height: 1.6; color: var(--doux); max-width: 330px; }
.couleur-lit { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .8125rem; color: var(--discret); }
.couleur-lit i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(120,100,80,.45); display: inline-block; }

/* Rubriques numérotées */
.rubriques { margin-top: 28px; border-top: 1px solid var(--filet); }
.rubrique { display: flex; gap: 16px; align-items: baseline; width: 100%; text-align: left; padding: 16px 0; min-height: 56px; border-bottom: 1px solid var(--filet); text-decoration: none; color: var(--encre); }
.rubrique .num { flex: 0 0 auto; min-width: 22px; white-space: nowrap; font-size: .6875rem; font-weight: 600; letter-spacing: .1em; color: var(--or); }
.rubrique .corps { flex: 1; min-width: 0; }
.rubrique .titre-r { display: block; font-weight: 500; font-size: .9375rem; }
.rubrique .texte-r { display: block; margin-top: 2px; font-size: .9375rem; color: var(--doux); }
.rubrique .priere-r { display: block; font-weight: 400; font-size: 1.0625rem; line-height: 1.45; }
.rubrique .ref { font-size: .75rem; color: var(--discret); white-space: nowrap; }
.rubrique .fleche { color: var(--discret); align-self: center; }
.bientot { font-size: .6875rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); border: 1px solid var(--filet); border-radius: 999px; padding: 2px 8px; white-space: nowrap; align-self: center; }

.ajuster { display: block; margin: 22px 0 0; min-height: 44px; font-size: .8125rem; color: var(--discret); text-decoration: underline dotted; text-underline-offset: 4px; }


/* Sections du jour */
.sections { margin-top: 30px; }
.section-jour { padding: 26px 0 28px; border-top: 1px solid var(--filet); }
.etiquette { margin: 0 0 12px; font-size: .6875rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--or); }
.s-priere { margin: 0; font-weight: 400; font-size: 1.1875rem; line-height: 1.5; }
.s-evangile { margin: 0; white-space: pre-line; font-weight: 400; font-size: 1.0625rem; line-height: 1.65; }
.s-evangile.grand { font-size: 1.1875rem; margin-top: 18px; }
.s-citation { margin: 0; font-weight: 300; font-size: 1.375rem; line-height: 1.4; letter-spacing: -.005em; }
.page .s-citation { margin-top: 26px; font-size: 1.25rem; }
.s-ref { margin: 10px 0 0; font-size: .8125rem; color: var(--discret); }
.s-titre { margin: 0; font-weight: 500; font-size: 1.0625rem; line-height: 1.4; }
.s-dates { font-weight: 300; color: var(--discret); font-size: .875rem; }
.s-accroche { margin: 6px 0 0; font-size: .9375rem; line-height: 1.6; color: var(--doux); }
.lire { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin-top: 8px; font-size: .875rem; font-weight: 500; color: var(--or); }
.texte-lecture p { margin: 18px 0 0; font-size: 1.0625rem; line-height: 1.7; }

/* Pages intérieures */
.page { padding-top: 24px; }
.retour { display: inline-flex; align-items: center; gap: 6px; height: 44px; font-size: .875rem; font-weight: 500; color: var(--doux); margin-bottom: 12px; }
.texte-priere { white-space: pre-line; font-weight: 400; font-size: 1.1875rem; line-height: 1.7; margin: 24px 0 8px; }
.texte-priere.variante { font-size: 1rem; color: var(--doux); }
.bloc { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--filet); }
.bloc h3 { margin: 0 0 6px; font-size: .6875rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--discret); }
.bloc p { margin: 0; font-size: .9375rem; color: var(--doux); }
.source { margin-top: 8px; font-size: .75rem; color: var(--discret); }
.groupe { margin: 32px 0 0; font-size: .6875rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--discret); }

/* Prière guidée */
.guide { min-height: 60dvh; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-top: 40px; }
.guide .etape-mot { font-weight: 200; font-size: 3rem; line-height: 1.1; margin: 0 0 18px; }
.guide .etape-texte { font-size: 1.0625rem; line-height: 1.65; color: var(--doux); margin: 0 auto; max-width: 320px; }
.guide .points { display: flex; gap: 8px; justify-content: center; margin: 36px 0 24px; }
.guide .points i { width: 6px; height: 6px; border-radius: 50%; background: var(--filet); }
.guide .points i.on { background: var(--or); }
.bouton { display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 28px; border-radius: 26px; background: var(--puce); color: var(--puce-texte); font-weight: 500; font-size: .9375rem; }
.bouton.leger { background: none; color: var(--encre); border: 1px solid var(--filet); }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Lexique */
.lex { color: inherit; text-decoration: underline dotted; text-decoration-color: var(--or); text-underline-offset: 4px; font: inherit; }
.recherche { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); padding: 0 16px; font: inherit; font-size: 1rem; margin: 16px 0 8px; }
.mot-def { padding: 16px 0; border-bottom: 1px solid var(--filet); }
.mot-def b { font-weight: 500; display: block; margin-bottom: 2px; }
.mot-def span { font-size: .9375rem; color: var(--doux); }
.voile { position: fixed; inset: 0; z-index: 20; background: rgba(20, 16, 12, .25); animation: fondu .4s ease both; }
.feuille { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 480px; margin: 0 auto; background: var(--fond); color: var(--encre);
  border-radius: 24px 24px 0 0; padding: 26px 28px calc(env(safe-area-inset-bottom, 0px) + 28px); box-shadow: 0 -10px 40px rgba(0,0,0,.12); animation: glisse .6s var(--lent) both; }
.feuille .poignee { width: 36px; height: 4px; border-radius: 2px; background: var(--filet); margin: -10px auto 16px; }
.feuille p { color: var(--doux); font-size: 1rem; }
@keyframes fondu { from { opacity: 0; } }
@keyframes glisse { from { transform: translateY(100%); } }

/* Choix du niveau et réglages */
.niveaux { margin-top: 24px; display: grid; gap: 10px; }
.niveau { width: 100%; text-align: left; padding: 18px 20px; border-radius: 18px; border: 1px solid var(--filet); background: var(--carte); display: flex; gap: 14px; align-items: flex-start; }
.niveau.on { border-color: var(--or); box-shadow: 0 0 0 1px var(--or) inset; }
.niveau .rond { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--anneau); margin-top: 2px; position: relative; }
.niveau.on .rond::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--or); }
.niveau b { display: block; font-weight: 500; }
.niveau small { display: block; color: var(--doux); font-size: .8125rem; margin-top: 2px; }
.segments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 16px; border: 1px solid var(--filet); margin-top: 10px; }
.segments.deux { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.segments button { height: 44px; border-radius: 12px; font-size: .875rem; font-weight: 500; color: var(--doux); }
.segments button.on { background: var(--puce); color: var(--puce-texte); }
.note { font-size: .8125rem; color: var(--discret); margin-top: 10px; }

/* Barre de navigation flottante */
.barre { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); z-index: 10;
  height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; border-radius: 30px;
  background: var(--verre); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--filet); box-shadow: 0 10px 30px rgba(60,45,30,.1); }
.barre[hidden] { display: none; }
.barre button { white-space: nowrap; height: 44px; min-width: 48px; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 22px; color: var(--doux); font-size: .8125rem; font-weight: 500; }
.barre button .lib { display: none; }
.barre button.on { background: var(--puce); color: var(--puce-texte); }
.barre button.on .lib { display: inline; }

/* Évangile verset par verset */
.versets { margin: 0; font-weight: 400; font-size: 1.0625rem; line-height: 1.65; }
.versets sup { font-size: .625rem; font-weight: 600; color: var(--or); margin-right: 3px; vertical-align: .45em; }
.versets .saut { color: var(--discret); }
.page .versets { font-size: 1.1875rem; margin-top: 18px; }

/* Bible */
.livres { margin-top: 10px; border-top: 1px solid var(--filet); }
.livre { border-bottom: 1px solid var(--filet); }
.livre-tete { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 12px 2px; text-align: left; }
.livre-nom { flex: 1; min-width: 0; font-weight: 500; font-size: 1rem; }
.livre-abr { font-size: .75rem; color: var(--discret); }
.livre-signe { position: relative; width: 14px; height: 14px; flex: 0 0 auto; }
.livre-signe::before, .livre-signe::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; margin-top: -.75px; border-radius: 1px; background: var(--or); transition: transform .5s var(--lent); }
.livre-signe::after { transform: rotate(90deg); }
.livre.ouvert .livre-signe::after { transform: rotate(0deg); }
.livre-corps { padding: 0 2px 22px; animation: apparait .8s var(--lent) both; }
.livre-res { margin: 0; font-size: .9375rem; line-height: 1.65; color: var(--doux); }
.livre-info { margin: 12px 0 0; font-size: .6875rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--discret); }
.livre-corps .chapitres { margin-top: 10px; }
.chapitres { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin-top: 20px; }
.chapitres button { height: 52px; border-radius: 14px; border: 1px solid var(--filet); background: var(--carte); font-weight: 500; }
.texte-bible { margin-top: 18px; font-size: 1.125rem; line-height: 1.75; font-weight: 300; }
.texte-bible p { margin: 0 0 1.1em; }
.texte-bible .v { border-radius: 6px; transition: background-color .4s ease; cursor: pointer; }
.texte-bible .v sup { font-size: .625rem; font-weight: 600; color: var(--or); margin: 0 3px 0 2px; vertical-align: .45em; }
.texte-bible .v.surligne { background: rgba(232, 190, 120, .22); }
.texte-bible .v.marque { background: rgba(232, 190, 120, .12); box-shadow: inset 0 -1px 0 var(--or); }
.nav-chap { display: flex; justify-content: space-between; margin-top: 28px; gap: 10px; }
.favori { display: block; width: 100%; text-align: left; padding: 16px 0; border-bottom: 1px solid var(--filet); }
.favori b { display: block; font-size: .75rem; font-weight: 600; color: var(--or); letter-spacing: .04em; margin-bottom: 4px; }
.favori span { font-size: 1rem; line-height: 1.6; }
.resultat { display: block; width: 100%; text-align: left; padding: 14px 0; border-bottom: 1px solid var(--filet); }
.resultat b { display: block; font-size: .75rem; font-weight: 600; color: var(--or); letter-spacing: .04em; }
.resultat span { font-size: .9375rem; color: var(--doux); }
.resultat mark { background: rgba(232, 190, 120, .3); color: inherit; border-radius: 3px; }
.charge { margin-top: 30px; color: var(--discret); font-size: .9375rem; }

/* En famille */
.enfant .s-priere, .enfant .versets { font-size: 1.1875rem; }
.question { margin: 14px 0 0; font-weight: 500; font-size: 1rem; color: var(--or); }

/* Réglages : présentation */
.presentation { margin-top: 10px; font-size: 1rem; line-height: 1.65; color: var(--doux); }
.presentation strong { color: var(--encre); font-weight: 500; }

/* ==========================================================================
   CIEL VIVANT — animation d'ambiance, après l'animation d'entrée.
   Elle n'agit que lorsque la classe « vivant » est posée sur <html>
   (réglage « Ciel : vivant », le jour). Sans elle, on retrouve le ciel fixe
   d'origine. Pour la supprimer complètement : effacer ce bloc.
   ========================================================================== */
:root.vivant .couche.n0 { animation: flotte-a 19s ease-in-out infinite alternate; }
:root.vivant .couche.n1 { animation: flotte-b 23s ease-in-out infinite alternate; }
:root.vivant .couche.n2 { animation: flotte-a 15s ease-in-out -6s infinite alternate-reverse; }
:root.vivant .couche.n3 { animation: flotte-b 17s ease-in-out -3s infinite alternate; }
:root.vivant .couche.mer, :root.vivant .mer-bas .couche { animation: onde 9s ease-in-out infinite alternate; }
:root.vivant .couche.mer.m1 { animation-duration: 11s; animation-delay: -4s; }
:root.vivant .couche.mer canvas, :root.vivant .mer-bas .couche canvas { animation: defile 150s linear infinite; }
:root.vivant .couche.mer.m1 canvas, :root.vivant .mer-bas .m1 canvas { animation-duration: 100s; }
@keyframes chauffe {
  from { transform: none; opacity: 1; border-color: rgba(122, 86, 44, .55); box-shadow: 0 0 0 0 rgba(240, 200, 120, 0); }
  to   { transform: none; opacity: 1; border-color: rgba(236, 196, 116, .95); box-shadow: 0 0 14px 2px rgba(240, 200, 120, .45), inset 0 0 10px rgba(240, 200, 120, .3); }
}
@keyframes chauffe-trait { from { stroke: #9A7444; opacity: .8; } to { stroke: #EBC57A; opacity: 1; } }
@keyframes lueur { from { opacity: .8; transform: none; } to { opacity: 1; transform: none; } }
@keyframes flotte-a { from { transform: translate(0, 0); } to { transform: translate(5px, -4px); } }
@keyframes flotte-b { from { transform: translate(0, 0); } to { transform: translate(-6px, 3px); } }
@keyframes onde { from { transform: translateY(-2px) scaleY(.98); } to { transform: translateY(3px) scaleY(1.03); } }
@keyframes defile { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  *, *::before, *::after { animation: none !important; transition: none !important; }
