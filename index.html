ible":"Buscar en la Biblia","ex-bible":"Por ejemplo: buen pastor","ancien-testament":"Antiguo Testamento","nouveau-testament":"Nuevo Testamento","chapitre":"Capítulo","chapitres":"capítulos","psaume":"Salmo","psaumes":"salmos","versets-trouves":"{n} versículo(s)","premiers-60":" · los 60 primeros","aucun-verset":"No se ha encontrado ningún versículo.","ouverture-bible":"Abriendo la Biblia…","bible-erreur":"No se ha podido abrir la Biblia. Comprueba tu conexión la primera vez; después se queda en tu teléfono.","toucher-favori":"Toca un versículo para añadirlo a tus pasajes favoritos.","presentation-verifiee":"Presentación verificada según la introducción de la Biblia publicada por los obispos de Estados Unidos (USCCB).","famille-titre":"Con tu hijo","famille-chapeau":"Para niños de 4 a 8 años. Léele en voz alta lo que te guste: bastan unos minutos, lo que cuenta es estar juntos.","prier-ensemble":"Rezar juntos","rituel-soir":"La oración de la noche","rituel-soir-desc":"Un pequeño ritual antes de dormir","ange-desc":"La oración al ángel de la guarda","benedicite-desc":"Antes de comer","menu-titre":"Bienvenido a Ora","presentation":"\u003cstrong>Ora es la app que te ayuda a caminar hacia Dios\u003c/strong>, tanto si das tus primeros pasos hacia Él como si caminas desde hace tiempo en la fe. Cada día: una oración, el Evangelio, una cita, una reflexión, una historia, un retrato y un descubrimiento.","favoris":"Mis pasajes favoritos","favoris-vide":"Los versículos que guardas en la Biblia","favoris-nb":"{n} versículo(s) guardado(s)","favoris-aucun":"Todavía no has guardado ningún pasaje. En la Biblia, toca un versículo para añadirlo aquí; tócalo de nuevo para quitarlo.","favoris-chapeau":"Toca un pasaje para volver a leerlo en la Biblia.","niveau":"Tu nivel","niveau-note":"Elige la profundidad de los textos. Ningún nivel vale más que otro, y puedes cambiarlo cuando quieras.","niveau.debutant":"Principiante","niveau.debutant.desc":"Para dar los primeros pasos: textos breves, palabras sencillas, todo explicado.","niveau.initie":"Iniciado","niveau.initie.desc":"Conoces lo básico y quieres ir un poco más lejos: referencias para entender mejor.","niveau.erudit":"Erudito","niveau.erudit.desc":"Para profundizar: los Padres de la Iglesia, el Catecismo y preguntas que piden algo más.","ambiance":"Ambiente","selon-heure":"Según la hora","jour":"Día","soir":"Noche","ambiance-note":"Según la hora: la noche empieza con la puesta de sol, allí donde estés, y el día vuelve a las 5 h.","taille":"Tamaño del texto","normale":"Normal","grande":"Grande","tres-grande":"Muy grande","langue":"Idioma","langue-note":"Ora elige primero el idioma de tu teléfono. Si lo cambias aquí, se guarda tu elección.","donnees":"Ora no pide ninguna cuenta ni envía ningún dato: tus ajustes y tus pasajes favoritos se quedan en este teléfono.","traduction-bible":"Los textos de la Biblia son los de la traducción de Mons. Juan Straubinger (Biblia Platense, 1948-1951), hoy de dominio público.","oups":"Vaya","oups-texte":"No se han podido cargar los contenidos. Inténtalo de nuevo en un momento.","commencer":"Empezar","precedent":"Anterior","suivant":"Siguiente","terminer":"Terminar","revenir":"Volver","amen":"Amén"},"en":{"onglet.accueil":"Today","onglet.prier":"Pray","onglet.bible":"The Bible","onglet.famille":"Family","menu":"Menu","retour":"Back","haut":"Ora · back to top","ce-soir":"this evening","en-savoir-plus":"Learn more","solennite":"Solemnity","couleur":"color","priere-jour":"Prayer of the day","priere-soir":"Evening prayer","evangile-jour":"Gospel of the day","citation-jour":"Quote of the day","reflexion-jour":"Reflection of the day","histoire-jour":"Story of the day","portrait-jour":"Portrait of the day","savais-tu":"Did you know?","idee-jour":"An idea for today","mediter":"Reflect","lire":"Read","lire-suite":"Read more","pour-mediter":"To reflect on","pour-reflechir":"To think about","une-priere":"A prayer","aller-plus-loin":"Going further","sources":"Sources","passage-messe":"The passage read at Mass","lire-chapitre":"Read the whole chapter in the Bible","ce-que-cest":"What it is","pourquoi-important":"Why it matters","idee-vivre":"An idea to live it","fermer":"Close","prier":"Pray","les-prieres":"Prayers","prieres-toujours":"Traditional prayers","mots-foi":"Words of faith","lexique":"Glossary","lexique-desc":"Every word explained simply","lexique-chapeau":"The words of faith, explained simply.","chercher-mot":"Look up a word","ex-mot":"For example: Eucharist","aucun-mot":"No word found.","le-geste":"The gesture","quand-dire":"When to pray it","pourquoi":"Why","autre-version":"Another version","lire-bible":"Read","bible-chapeau":"The whole Bible, to read even offline.","chercher-bible":"Search the Bible","ex-bible":"For example: good shepherd","ancien-testament":"Old Testament","nouveau-testament":"New Testament","chapitre":"Chapter","chapitres":"chapters","psaume":"Psalm","psaumes":"psalms","versets-trouves":"{n} verse(s)","premiers-60":" · first 60 shown","aucun-verset":"No verse found.","ouverture-bible":"Opening the Bible…","bible-erreur":"The Bible could not be opened. Check your connection the first time; after that it stays on your phone.","toucher-favori":"Tap a verse to add it to your favorite passages.","presentation-verifiee":"Introduction checked against the Bible published by the U.S. Conference of Catholic Bishops (USCCB).","famille-titre":"With your child","famille-chapeau":"For children aged 4 to 8. Read aloud whatever you like: a few minutes are enough, what matters is being together.","prier-ensemble":"Praying together","rituel-soir":"Bedtime prayer","rituel-soir-desc":"A small ritual before sleep","ange-desc":"The prayer to the guardian angel","benedicite-desc":"Before meals","menu-titre":"Welcome to Ora","presentation":"\u003cstrong>Ora is the app that helps you walk toward God\u003c/strong>, whether you are taking your first steps toward him or have walked with faith for a long time. Every day: a prayer, the Gospel, a quote, a reflection, a story, a portrait and something to discover.","favoris":"My favorite passages","favoris-vide":"The verses you keep in the Bible","favoris-nb":"{n} verse(s) saved","favoris-aucun":"You haven't saved any passage yet. In the Bible, tap a verse to add it here; tap it again to remove it.","favoris-chapeau":"Tap a passage to read it again in the Bible.","niveau":"Your level","niveau-note":"Choose how deep the texts go. No level is worth more than another, and you can change it anytime.","niveau.debutant":"Beginner","niveau.debutant.desc":"For first steps: short texts, simple words, everything explained.","niveau.initie":"Initiated","niveau.initie.desc":"You know the basics and want to go a little further: pointers to understand more.","niveau.erudit":"Scholar","niveau.erudit.desc":"To go deeper: the Church Fathers, the Catechism and questions that ask a little more.","ambiance":"Atmosphere","selon-heure":"By time of day","jour":"Day","soir":"Evening","ambiance-note":"By time of day: evening starts at sunset, wherever you are, and day returns at 5 am.","taille":"Text size","normale":"Normal","grande":"Large","tres-grande":"Very large","langue":"Language","langue-note":"Ora first follows your phone's language. If you change it here, your choice is kept.","donnees":"Ora asks for no account and sends no data: your settings and favorite passages stay on this phone.","traduction-bible":"Bible texts are from the Douay-Rheims Bible, Challoner revision (1899 American edition), in the public domain.","oups":"Oops","oups-texte":"The content could not be loaded. Please try again in a moment.","commencer":"Start","precedent":"Previous","suivant":"Next","terminer":"Finish","revenir":"Back","amen":"Amen"}},"i18n":{"es":{"_note":"Contenidos de Ora en español (traducción de los textos franceses; oraciones en sus versiones oficiales en España).","explications":{"saisons":{"avent":{"quoi":"Las cuatro semanas que preparan la Navidad. La palabra viene del latín adventus, «venida».","pourquoi":"Nos preparamos para acoger a Jesús que viene: en Navidad, en nuestra vida de hoy y al final de los tiempos.","idee":"Encender una vela más cada domingo en una corona de Adviento."},"noel":{"quoi":"El tiempo que va de Navidad al Bautismo del Señor, a principios de enero.","pourquoi":"Dios se hace muy cercano: se hace niño, uno de nosotros.","idee":"Dejar el belén puesto hasta el Bautismo del Señor y detenerse ante él un momento."},"ordinaire":{"quoi":"El tiempo «ordinario» es el de las semanas que se cuentan una a una (ordo significa «orden» en latín), entre las grandes fiestas.","pourquoi":"Es el tiempo en que seguimos a Jesús en lo cotidiano, en el Evangelio, sin acontecimientos extraordinarios: ahí se vive la mayor parte de la fe.","idee":"Leer cada domingo el Evangelio del día antes de ir a misa, con calma."},"careme":{"quoi":"Los cuarenta días entre el Miércoles de Ceniza y la Pascua, en recuerdo de los cuarenta días de Jesús en el desierto.","pourquoi":"Un tiempo para volver a Dios, aligerar lo que estorba y preparar el corazón para la alegría de la Pascua.","idee":"Elegir una sola cosa: una oración, un gesto de compartir o una pantalla menos, y mantenerla con suavidad."},"triduum":{"quoi":"Los tres días que van desde la tarde del Jueves Santo hasta el domingo de Pascua: el corazón de todo el año.","pourquoi":"En ellos vivimos la última cena de Jesús, su muerte en la cruz y su resurrección.","idee":"Participar al menos en una de las celebraciones, aunque sea en parte, por ejemplo el vía crucis del Viernes Santo."},"paques":{"quoi":"Los cincuenta días de Pascua a Pentecostés, vividos como un solo gran domingo.","pourquoi":"Cristo ha resucitado: la muerte no tiene la última palabra. Es el tiempo de la alegría.","idee":"Añadir «Aleluya» a la oración de la noche, como un gracias."}},"fetes":{"toussaint":{"quoi":"La fiesta de todos los santos: los que la Iglesia ha reconocido y la inmensa multitud de los que solo Dios conoce.","pourquoi":"Recuerda que la santidad no está reservada a unos pocos héroes: es la vocación de cada uno, y estamos rodeados de esta gran familia.","idee":"Contarle a un niño la historia del santo cuyo nombre lleva, o de un santo que le guste."},"defunts":{"quoi":"Al día siguiente de Todos los Santos, la Iglesia reza por todos los difuntos.","pourquoi":"Creemos que la muerte no es una ruptura definitiva: la oración nos une todavía a los que amamos.","idee":"Decir el nombre de una persona fallecida y confiarla a Dios, o llevar flores a una tumba."},"christ-roi":{"quoi":"El último domingo del año litúrgico, antes del Adviento.","pourquoi":"Jesús es rey, pero un rey que sirve, que perdona y que se entrega: su reino está hecho de amor.","idee":"Hacer un favor discreto a alguien, sin decirlo."},"immaculee-conception":{"quoi":"La fiesta que celebra a María, preservada de todo pecado desde el primer instante de su vida, en el seno de su madre.","pourquoi":"Dios preparó a María para que pudiera decir sí con todo su ser a la venida de Jesús.","idee":"Rezar un Avemaría por alguien que lo necesite."},"noel":{"quoi":"El nacimiento de Jesús en Belén.","pourquoi":"Dios no se queda lejos: viene a vivir entre nosotros, pobre y pequeño, para que nadie tenga miedo de acercarse.","idee":"Antes de abrir los regalos, detenerse en familia ante el belén y dar gracias."},"sainte-famille":{"quoi":"El domingo después de Navidad se celebra a Jesús, María y José.","pourquoi":"Jesús creció en una familia, con sus alegrías y sus dificultades: toda familia puede encontrar en ella un modelo y una ayuda.","idee":"Rezar juntos un minuto antes de comer, y que cada uno diga un gracias."},"marie-mere-de-dieu":{"quoi":"El 1 de enero, la Iglesia celebra a María, Madre de Jesús, verdadero Dios y verdadero hombre. Es también la Jornada Mundial de la Paz.","pourquoi":"Empezamos el año bajo la mirada de una madre, pidiendo la paz.","idee":"Confiar a María una intención para el año que comienza."},"epiphanie":{"quoi":"La visita de los Magos venidos de Oriente, guiados por una estrella, hasta el niño Jesús.","pourquoi":"Jesús no vino para un solo pueblo: se manifiesta a todos, vengan de donde vengan.","idee":"Compartir el roscón de Reyes y rezar por alguien que está lejos."},"bapteme":{"quoi":"Jesús es bautizado por Juan en el Jordán. Una voz dice: «Este es mi Hijo amado».","pourquoi":"Por nuestro bautismo, también nosotros somos llamados hijos amados de Dios.","idee":"Buscar la fecha del propio bautismo y apuntarla en algún sitio."},"cendres":{"quoi":"El primer día de la Cuaresma. El sacerdote traza una cruz de ceniza en la frente o la impone sobre la cabeza.","pourquoi":"Un signo de humildad y de nuevo comienzo: somos frágiles, y Dios nos espera.","idee":"Elegir el esfuerzo de Cuaresma que nos gustaría vivir: uno solo, sencillo."},"rameaux":{"quoi":"Jesús entra en Jerusalén aclamado por la multitud que agita ramas. Es el comienzo de la Semana Santa.","pourquoi":"La misma multitud que aclama gritará pronto «Crucifícalo»: es el misterio de nuestros corazones divididos.","idee":"Llevar a casa una rama bendecida y colocarla junto a una cruz."},"jeudi-saint":{"quoi":"La última cena de Jesús con sus amigos, en la que les lava los pies y les da su Cuerpo y su Sangre.","pourquoi":"Es el nacimiento de la Eucaristía y del mandamiento del amor que sirve.","idee":"Hacer en casa un servicio humilde, sin esperar nada."},"vendredi-saint":{"quoi":"El día en que Jesús muere en la cruz.","pourquoi":"Entrega su vida por amor, hasta el final, para salvarnos.","idee":"Guardar un momento de silencio a las tres de la tarde, la hora de su muerte."},"samedi-saint":{"quoi":"El día del gran silencio: Jesús reposa en el sepulcro. Por la noche, la Vigilia pascual abre la fiesta de Pascua.","pourquoi":"Es el día de la espera, como nuestros momentos en que Dios parece ausente.","idee":"Vivir un día tranquilo y encender una vela por la noche."},"paques":{"quoi":"La resurrección de Jesús, en la mañana del tercer día.","pourquoi":"Es el corazón de la fe cristiana: el amor es más fuerte que la muerte.","idee":"Decirle a alguien: «¡Cristo ha resucitado!», como los primeros cristianos."},"misericorde":{"quoi":"El domingo siguiente a Pascua, dedicado a la misericordia de Dios.","pourquoi":"Dios perdona sin cansarse: no hay falta más grande que su amor.","idee":"Perdonar una pequeña cosa a alguien, o perdonarse a uno mismo."},"ascension":{"quoi":"Cuarenta días después de Pascua, Jesús vuelve junto a su Padre.","pourquoi":"No nos abandona: nos confía la misión de continuar su obra y promete el Espíritu Santo.","idee":"Levantar un instante la mirada al cielo y dar gracias."},"pentecote":{"quoi":"Cincuenta días después de Pascua, el Espíritu Santo desciende sobre los apóstoles reunidos.","pourquoi":"Es el nacimiento de la Iglesia: el Espíritu da la fuerza y la alegría de dar testimonio.","idee":"Decir sencillamente «Ven, Espíritu Santo» antes de una decisión o de un día difícil."},"trinite":{"quoi":"La fiesta de Dios único en tres personas: el Padre, el Hijo y el Espíritu Santo.","pourquoi":"Dios no es solitario: es amor, relación, comunión.","idee":"Hacer la señal de la cruz despacio, pensando en cada palabra."},"saint-sacrement":{"quoi":"La fiesta del Cuerpo y la Sangre de Cristo, presente en la Eucaristía.","pourquoi":"Jesús se da como alimento para quedarse con nosotros cada día.","idee":"Entrar en una iglesia y quedarse un minuto ante el sagrario."},"sacre-coeur":{"quoi":"La fiesta del amor de Jesús, representado por su corazón.","pourquoi":"Recuerda que Dios nos ama con un corazón humano, tierno y paciente.","idee":"Confiar a Jesús lo que pesa en el corazón."},"assomption":{"quoi":"María, al final de su vida terrena, es elevada en cuerpo y alma a la gloria del cielo.","pourquoi":"Lo que le sucedió a María es una promesa para nosotros: también nuestro cuerpo está llamado a la vida.","idee":"Rezar un Avemaría por la propia familia."},"joseph":{"quoi":"La fiesta de José, el esposo de María, que cuidó de Jesús niño.","pourquoi":"Un hombre discreto, justo y valiente: patrono de los padres y de los trabajadores.","idee":"Para un padre: confiar a san José su papel de padre."},"annonciation":{"quoi":"El ángel Gabriel anuncia a María que será la madre del Hijo de Dios, y ella responde que sí.","pourquoi":"El «sí» de María abre la puerta a Dios en la historia humana.","idee":"Rezar el Ángelus, la oración que recuerda ese momento."},"nativite-jean-baptiste":{"quoi":"El nacimiento de Juan, pariente de Jesús, que lo anunció y lo bautizó.","pourquoi":"Juan prepara el camino: señala a Jesús y se retira. Es uno de los pocos nacimientos que celebra la Iglesia.","idee":"En Cataluña, la noche de Sant Joan se celebra con hogueras: una ocasión para hablar de Juan a un niño."},"pierre-paul":{"quoi":"La fiesta de los dos grandes apóstoles, Pedro el pescador y Pablo el convertido, que murieron en Roma.","pourquoi":"Dos hombres muy distintos, con sus debilidades, sobre los que se apoya la Iglesia.","idee":"Rezar por el papa, sucesor de Pedro."}}},"conseils":["Antes de mirar el teléfono esta mañana, puedes hacer la señal de la cruz, solo una.","Piensa en una persona que te importa y confíasela a Dios en una frase.","Entra en una iglesia al pasar, aunque sea dos minutos, y siéntate sin más.","A la hora de comer, da gracias interiormente por lo que hay en tu plato.","Si alguien te irrita hoy, intenta rezar por él una pequeña oración.","Tómate un minuto de silencio, sin hacer nada. Dios también está ahí.","Apunta en algún sitio algo por lo que hoy estás agradecido.","Haz un pequeño favor sin que nadie lo sepa.","Esta noche, cuéntale a tu hijo un momento feliz de tu día.","Lee despacio una frase del Evangelio y llévala contigo todo el día.","Perdona una pequeña cosa, a alguien o a ti mismo.","En el momento más cargado del día, di: «Jesús, en Ti confío»."],"prieres":{"signe-de-croix":{"titre":"La señal de la cruz","texte":"En el nombre del Padre,\ny del Hijo,\ny del Espíritu Santo.\nAmén.","geste":"Con la mano derecha se toca la frente (el Padre), el pecho (el Hijo) y luego el hombro izquierdo y el derecho (el Espíritu Santo).","quand":"Al principio y al final de toda oración, al entrar en una iglesia, antes de comer o simplemente para ponerse bajo la mirada de Dios.","pourquoi":"Es la oración más breve y más antigua: en pocas palabras se dice la fe en Dios Padre, Hijo y Espíritu, y se traza sobre uno mismo la cruz de Cristo."},"notre-pere":{"titre":"Padrenuestro","texte":"Padre nuestro, que estás en el cielo,\nsantificado sea tu Nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad\nen la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos\na los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal.\nAmén.","quand":"Cada día, por la mañana o por la noche, en misa, o cuando no sabemos qué decirle a Dios.","pourquoi":"Es la oración que el mismo Jesús enseñó a sus discípulos (Mt 6, 9-13). Lo contiene todo: la confianza, el pan de cada día, el perdón y la protección.","source":"Mt 6, 9-13; Lc 11, 2-4. Texto del Misal Romano de la Conferencia Episcopal Española."},"je-vous-salue-marie":{"titre":"Avemaría","texte":"Dios te salve, María,\nllena eres de gracia;\nel Señor es contigo.\nBendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte.\nAmén.","quand":"En cualquier momento, solo o con un niño. Se repite diez veces en cada misterio del rosario.","pourquoi":"La primera parte recoge las palabras del ángel Gabriel y de Isabel a María (Lc 1, 28.42). En la segunda, pedimos a María que rece por nosotros, como se lo pediríamos a una madre.","source":"Lc 1, 28; Lc 1, 42"},"gloire-au-pere":{"titre":"Gloria","texte":"Gloria al Padre, y al Hijo,\ny al Espíritu Santo.\nComo era en el principio,\nahora y siempre,\npor los siglos de los siglos.\nAmén.","quand":"Al final de un misterio del rosario, de un salmo, o como una pequeña oración de alabanza durante el día.","pourquoi":"Es una alabanza muy sencilla: no se pide nada, se da gloria a Dios por lo que es."},"credo":{"titre":"Credo (Símbolo de los Apóstoles)","texte":"Creo en Dios, Padre todopoderoso,\nCreador del cielo y de la tierra.\nCreo en Jesucristo, su único Hijo, nuestro Señor,\nque fue concebido por obra y gracia del Espíritu Santo,\nnació de santa María Virgen,\npadeció bajo el poder de Poncio Pilato,\nfue crucificado, muerto y sepultado,\ndescendió a los infiernos,\nal tercer día resucitó de entre los muertos,\nsubió a los cielos\ny está sentado a la derecha de Dios, Padre todopoderoso.\nDesde allí ha de venir a juzgar a vivos y muertos.\nCreo en el Espíritu Santo,\nla santa Iglesia católica,\nla comunión de los santos,\nel perdón de los pecados,\nla resurrección de la carne\ny la vida eterna.\nAmén.","quand":"Al comienzo del rosario, en la misa del domingo, o para repetir la propia fe cuando vacila.","pourquoi":"El Credo resume lo esencial de la fe cristiana, tal como la Iglesia la transmite desde los primeros siglos. Rezarlo es unirse a todos los creyentes de ayer y de hoy."},"ange-de-dieu":{"titre":"Ángel de Dios","texte":"Ángel de Dios,\nque eres mi custodio,\npues la bondad divina\nme ha encomendado a ti,\nilumíname, guárdame,\nrígeme y gobiérname.\nAmén.","variante":"Ángel de la guarda,\ndulce compañía,\nno me desampares\nni de noche ni de día.\nAmén.","quand":"Por la noche antes de dormir, o por la mañana al salir. Una oración muy bonita para rezar con un niño.","pourquoi":"La Iglesia cree que cada uno está acompañado por un ángel custodio, un amigo invisible que Dios pone a nuestro lado (Catecismo, n. 336)."},"angelus":{"titre":"El Ángelus","texte":"El Ángel del Señor anunció a María.\n— Y concibió por obra del Espíritu Santo.\nDios te salve, María…\n\nHe aquí la esclava del Señor.\n— Hágase en mí según tu palabra.\nDios te salve, María…\n\nY el Verbo se hizo carne.\n— Y habitó entre nosotros.\nDios te salve, María…\n\nRuega por nosotros, santa Madre de Dios.\n— Para que seamos dignos de alcanzar las promesas de nuestro Señor Jesucristo.\n\nOremos.\nDerrama, Señor, tu gracia sobre nosotros,\nque, por el anuncio del ángel,\nhemos conocido la encarnación de tu Hijo,\npara que lleguemos, por su pasión y su cruz,\na la gloria de la resurrección.\nPor Jesucristo, nuestro Señor.\nAmén.","quand":"Tradicionalmente tres veces al día: a las 6, a las 12 y a las 18 horas, cuando suenan las campanas.","pourquoi":"Recuerda el momento en que Dios se hizo hombre, gracias al «sí» de María. Rezarla a mediodía es hacer una pausa en medio del día para acordarse de Dios."},"acte-de-contrition":{"titre":"Acto de contrición","texte":"Señor mío Jesucristo,\nDios y Hombre verdadero,\nCreador, Padre y Redentor mío;\npor ser vos quien sois, bondad infinita,\ny porque os amo sobre todas las cosas,\nme pesa de todo corazón haberos ofendido;\ntambién me pesa porque podéis castigarme\ncon las penas del infierno.\nAyudado de vuestra divina gracia,\npropongo firmemente nunca más pecar,\nconfesarme y cumplir la penitencia\nque me fuere impuesta.\nAmén.","quand":"Por la noche, después de repasar el día, o durante la confesión, después de decir los pecados.","pourquoi":"Decimos a Dios que lamentamos el mal que hemos hecho y que queremos cambiar, contando con su ayuda más que con nuestras propias fuerzas."},"benedicite":{"titre":"Bendición de la mesa","texte":"Bendícenos, Señor,\ny bendice estos alimentos\nque por tu bondad vamos a recibir.\nPor Jesucristo, nuestro Señor.\nAmén.","quand":"Antes de comer, en familia o solo.","pourquoi":"Damos gracias a Dios por el alimento que recibimos de su bondad. Es la traducción de la antigua bendición latina «Benedic, Domine»."},"nunc-dimittis":{"titre":"Cántico de Simeón","quand":"Por la noche, antes de dormir. La Iglesia lo reza cada noche en la oración de Completas.","pourquoi":"Son las palabras del anciano Simeón cuando tomó en brazos al niño Jesús en el Templo (Lc 2, 29-32). Terminar el día con ellas es confiarse a Dios en paz."}},"guide-famille":{"titre":"La oración de la noche con tu hijo","duree":"3 minutos","intro":"Un pequeño ritual para terminar el día juntos, para leer en voz alta.","etapes":[{"mot":"Nos sentamos","invitation":"Bajad la luz, sentaos el uno junto al otro y haced juntos la señal de la cruz."},{"mot":"Gracias","invitation":"Pregúntale: «¿Qué te ha hecho feliz hoy?». Dad gracias a Dios juntos por ello."},{"mot":"Perdón","invitation":"¿Hay algo que lamentamos? Se puede decir en voz baja a Jesús. Le gusta perdonar."},{"mot":"Por favor","invitation":"¿Por quién queremos rezar esta noche? Un amigo, un abuelo, alguien enfermo…"},{"mot":"Ángel de Dios","invitation":"Rezad juntos la oración al ángel de la guarda."},{"mot":"Buenas noches","invitation":"Puedes trazar una pequeña cruz en su frente con el pulgar, como una bendición."}],"fin":"Buenas noches."},"lexique":{"mots":[{"id":"alleluia","mot":"Aleluya","formes":["aleluya","Aleluya"],"def":"Una palabra hebrea que significa «alabad a Dios». Es un grito de alegría, que se canta sobre todo en el tiempo de Pascua. No se canta durante la Cuaresma."},{"id":"amen","mot":"Amén","formes":["Amén","amén"],"def":"Una palabra hebrea que significa «es verdad», «así lo creo», «así sea». Se dice al final de una oración para expresar nuestro acuerdo."},{"id":"ange-gardien","mot":"Ángel de la guarda","formes":["ángel de la guarda","ángel custodio","ángeles custodios"],"def":"Un ángel que Dios da a cada persona para acompañarla y protegerla durante toda su vida. Se le puede hablar como a un amigo invisible."},{"id":"annonciation","mot":"Anunciación","formes":["Anunciación"],"def":"El momento en que el ángel Gabriel anuncia a María que será la madre de Jesús. María responde «sí». Se celebra el 25 de marzo."},{"id":"apotre","mot":"Apóstol","formes":["apóstol","apóstoles","Apóstoles"],"def":"Los doce amigos elegidos por Jesús para acompañarle y después anunciar el Evangelio al mundo. Pedro, Juan, Santiago y Tomás son algunos de ellos."},{"id":"avent","mot":"Adviento","formes":["Adviento"],"def":"Las cuatro semanas que preparan la Navidad. La palabra viene del latín adventus, que significa «venida»."},{"id":"bapteme","mot":"Bautismo","formes":["bautismo","Bautismo","bautizado","bautizados"],"def":"El primer sacramento, que hace entrar en la familia de los cristianos. Por el agua y el Espíritu Santo se llega a ser hijo de Dios. Se recibe una sola vez y es para siempre."},{"id":"beatitudes","mot":"Bienaventuranzas","formes":["Bienaventuranzas","bienaventuranzas"],"def":"Las palabras de Jesús que empiezan por «Bienaventurados…»: los mansos, los limpios de corazón, los que trabajan por la paz… (Mt 5, 1-12). Describen la verdadera felicidad según Dios."},{"id":"bible","mot":"Biblia","formes":["Biblia"],"def":"El libro sagrado de los cristianos, formado por 73 libros escritos a lo largo de más de mil años. El Antiguo Testamento cuenta la historia de Dios con su pueblo; el Nuevo Testamento cuenta la vida de Jesús y de los primeros cristianos."},{"id":"careme","mot":"Cuaresma","formes":["Cuaresma","cuaresma"],"def":"Los cuarenta días que preparan la Pascua, desde el Miércoles de Ceniza hasta el Jueves Santo. Un tiempo para volver a Dios mediante la oración, el compartir y el ayuno."},{"id":"catechisme","mot":"Catecismo","formes":["Catecismo","catecismo"],"def":"La enseñanza de la fe cristiana. El Catecismo de la Iglesia Católica, publicado en 1992, es el libro que reúne todo lo que cree la Iglesia."},{"id":"chapelet","mot":"Rosario","formes":["rosario","rosarios"],"def":"Un collar de cuentas que ayuda a rezar: en cada cuenta se dice una oración. Un misterio consta de un Padrenuestro, diez Avemarías y un Gloria. Una parte completa tiene cinco misterios."},{"id":"communion","mot":"Comunión","formes":["comunión","comulgar"],"def":"El momento de la misa en que se recibe la hostia, el Cuerpo de Cristo. La palabra significa «unión con»: con Jesús y con los demás creyentes."},{"id":"communion-des-saints","mot":"Comunión de los santos","formes":["comunión de los santos"],"def":"La gran familia que une a todos los creyentes: los que viven en la tierra, los que han muerto y los que ya están junto a Dios. Podemos rezar unos por otros."},{"id":"confession","mot":"Confesión","formes":["confesión","confesarse","reconciliación"],"def":"El sacramento del perdón, también llamado sacramento de la reconciliación. Se dicen los pecados a un sacerdote, que da el perdón de Dios. El sacerdote no puede repetir jamás lo que ha oído."},{"id":"credo","mot":"Credo","formes":["Credo"],"def":"Una palabra latina que significa «creo». Es el texto que resume la fe cristiana y que se reza el domingo en misa."},{"id":"croix","mot":"Cruz","formes":["cruz","Cruz"],"def":"El instrumento de la muerte de Jesús, convertido en el signo de los cristianos. Recuerda que Jesús dio su vida por amor y que resucitó."},{"id":"defunts","mot":"Difuntos","formes":["difuntos","difunto","difunta"],"def":"Las personas que han muerto. La Iglesia reza por ellas, sobre todo el 2 de noviembre, con la esperanza de reencontrarlas junto a Dios."},{"id":"esprit-saint","mot":"Espíritu Santo","formes":["Espíritu Santo","el Espíritu"],"def":"La tercera persona de la Trinidad, con el Padre y el Hijo. Es el aliento de Dios que da fuerza, paz y alegría, y que ayuda a rezar."},{"id":"eucharistie","mot":"Eucaristía","formes":["Eucaristía","eucaristía"],"def":"El sacramento del Cuerpo y la Sangre de Cristo, que se celebra en la misa. La palabra griega significa «acción de gracias», es decir, «gracias»."},{"id":"evangile","mot":"Evangelio","formes":["Evangelio","evangelio","Evangelios","evangelios"],"def":"La palabra significa «buena noticia». Son los cuatro libros de la Biblia (Mateo, Marcos, Lucas y Juan) que cuentan la vida, las palabras, la muerte y la resurrección de Jesús."},{"id":"grace","mot":"Gracia","formes":["gracia","gracias"],"def":"Un regalo gratuito de Dios: su amor y su ayuda, que no merecemos pero que Él da con gusto. «Dar gracias» es decir gracias."},{"id":"hostie","mot":"Hostia","formes":["hostia","hostias"],"def":"El pan pequeño, redondo y plano, sin levadura, que se convierte en el Cuerpo de Cristo durante la misa."},{"id":"incarnation","mot":"Encarnación","formes":["encarnación","Encarnación"],"def":"El misterio de Dios que se hace hombre en Jesús. La palabra viene del latín caro, «carne»: Dios tomó un cuerpo como el nuestro."},{"id":"laudes","mot":"Laudes","formes":["Laudes","laudes"],"def":"La oración de la mañana de la Iglesia, hecha de salmos, lecturas y cantos. La palabra viene del latín laus, «alabanza»."},{"id":"liturgie","mot":"Liturgia","formes":["liturgia","litúrgico","litúrgica","litúrgicos"],"def":"El conjunto de las celebraciones de la Iglesia: la misa, los sacramentos, la Liturgia de las Horas. El tiempo litúrgico es el año organizado en torno a la vida de Jesús."},{"id":"messe","mot":"Misa","formes":["misa","misas"],"def":"La principal celebración de los cristianos, en la que se escucha la Palabra de Dios y se comparte la Eucaristía. Tiene lugar cada domingo, y a menudo cada día."},{"id":"misericorde","mot":"Misericordia","formes":["Misericordia","misericordia"],"def":"El amor de Dios que perdona y levanta. La palabra viene del latín: un corazón (cor) que se inclina sobre la miseria."},{"id":"mystere","mot":"Misterio","formes":["misterio","misterios"],"def":"En la fe, un misterio no es un enigma que resolver: es una realidad tan grande que nunca se termina de descubrir. En el rosario, los misterios son escenas de la vida de Jesús y de María."},{"id":"paques","mot":"Pascua","formes":["Pascua"],"def":"La mayor fiesta cristiana: la resurrección de Jesús. Su fecha cambia cada año: es el domingo siguiente a la primera luna llena de primavera."},{"id":"peche","mot":"Pecado","formes":["pecado","pecados","pecadores"],"def":"Un acto, una palabra o un pensamiento que daña nuestra relación con Dios, con los demás o con nosotros mismos. Dios está siempre dispuesto a perdonar."},{"id":"pentecote","mot":"Pentecostés","formes":["Pentecostés"],"def":"La fiesta, cincuenta días después de Pascua, en la que el Espíritu Santo desciende sobre los apóstoles. Se dice que es el nacimiento de la Iglesia."},{"id":"psaume","mot":"Salmo","formes":["Salmo","salmo","salmos"],"def":"Una oración cantada de la Biblia. El libro de los Salmos tiene 150, que expresan todas las emociones humanas: la alegría, el miedo, la ira, la confianza."},{"id":"resurrection","mot":"Resurrección","formes":["resurrección","Resurrección","resucitado"],"def":"La vuelta a la vida de Jesús, tres días después de su muerte, con un cuerpo transformado. Es también la promesa hecha a todos: la muerte no es el final."},{"id":"sacrement","mot":"Sacramento","formes":["sacramento","sacramentos"],"def":"Un signo visible por el que Dios da su gracia. Hay siete: bautismo, confirmación, eucaristía, reconciliación, unción de los enfermos, matrimonio y orden sacerdotal."},{"id":"saint","mot":"Santo","formes":["santo","santa","santos","santas"],"def":"Una persona que vivió en gran amistad con Dios y que está junto a Él. La Iglesia ha reconocido miles, pero todos los cristianos están llamados a la santidad."},{"id":"solennite","mot":"Solemnidad","formes":["Solemnidad","solemnidad","solemnidades"],"def":"El grado más alto de fiesta en el año litúrgico, como Navidad, Pascua o Todos los Santos. En la misa se canta el Gloria y se reza el Credo."},{"id":"temps-ordinaire","mot":"Tiempo Ordinario","formes":["tiempo ordinario","Tiempo Ordinario"],"def":"Las semanas del año que no son ni Adviento, ni Navidad, ni Cuaresma, ni Pascua. «Ordinario» viene del latín ordo: semanas que se cuentan una a una."},{"id":"toussaint","mot":"Todos los Santos","formes":["Todos los Santos"],"def":"La fiesta de todos los santos, el 1 de noviembre: los santos conocidos y todos los demás, que solo Dios conoce."},{"id":"trinite","mot":"Trinidad","formes":["Trinidad"],"def":"El misterio de un solo Dios en tres personas: el Padre, el Hijo (Jesús) y el Espíritu Santo. Dios es amor, y el amor es siempre relación."},{"id":"vepres","mot":"Vísperas","formes":["Vísperas","vísperas"],"def":"La oración de la tarde de la Iglesia, al ponerse el sol. La palabra viene del latín vesper, «la tarde»."},{"id":"vierge-marie","mot":"Virgen María","formes":["Virgen María","María"],"def":"La madre de Jesús. Los cristianos la aman y le rezan como a una madre: no sustituye a Dios, sino que lleva a su Hijo."},{"id":"yahweh","mot":"Yahvé","formes":["Yahvé"],"def":"El nombre que Dios revela a Moisés en la zarza ardiente (Ex 3, 14), que significa más o menos «Yo soy». Por respeto, los judíos no lo pronuncian, y la Iglesia pide decir «el Señor» en la oración y en la misa. Algunas Biblias lo escriben tal cual."},{"id":"purgatoire","mot":"Purgatorio","formes":["purgatorio","purificación"],"def":"Para la Iglesia, una purificación después de la muerte para los que se salvan pero aún no están del todo preparados para ver a Dios. No es un castigo, sino una última preparación del amor. Se puede ayudar a los difuntos con la oración."},{"id":"defunt","mot":"Difunto","formes":["difunto"],"def":"Una persona que ha muerto. El 2 de noviembre, la Iglesia reza por todos los difuntos."},{"id":"memento-mori","mot":"Memento mori","formes":["memento mori"],"def":"Una expresión latina: «recuerda que morirás». Para los cristianos no es un pensamiento triste, sino una invitación a vivir plenamente cada día y a no dejar lo esencial para más tarde."}]}},"en":{"_note":"Ora content in English (translated from the French texts; prayers in their official versions used in the United States).","explications":{"saisons":{"avent":{"quoi":"The four weeks that prepare for Christmas. The word comes from the Latin adventus, “coming”.","pourquoi":"We get ready to welcome Jesus who comes: at Christmas, in our lives today, and at the end of time.","idee":"Light one more candle each Sunday on an Advent wreath."},"noel":{"quoi":"The season from Christmas to the Baptism of the Lord, in early January.","pourquoi":"God comes very close: he becomes a child, one of us.","idee":"Leave the nativity scene up until the Baptism of the Lord and pause before it for a moment."},"ordinaire":{"quoi":"“Ordinary” Time is made of weeks counted one by one (ordo means “order” in Latin), between the great feasts.","pourquoi":"It is the time when we follow Jesus day to day in the Gospel, without extraordinary events: where most of the life of faith is lived.","idee":"Read the Sunday Gospel before going to Mass, calmly."},"careme":{"quoi":"The forty days between Ash Wednesday and Easter, in memory of Jesus' forty days in the desert.","pourquoi":"A time to return to God, let go of what weighs us down and prepare our hearts for the joy of Easter.","idee":"Choose just one thing: a prayer, an act of sharing or one less screen, and keep to it gently."},"triduum":{"quoi":"The three days from Holy Thursday evening to Easter Sunday: the heart of the whole year.","pourquoi":"We live Jesus' Last Supper, his death on the cross and his resurrection.","idee":"Take part in at least one of the celebrations, even partly, for example the Stations of the Cross on Good Friday."},"paques":{"quoi":"The fifty days from Easter to Pentecost, lived as one great Sunday.","pourquoi":"Christ is risen: death does not have the last word. It is the season of joy.","idee":"Add “Alleluia” to your evening prayer, as a thank you."}},"fetes":{"toussaint":{"quoi":"The feast of all the saints: those the Church has recognized, and the immense crowd of those known to God alone.","pourquoi":"It reminds us that holiness is not reserved for a few heroes: it is everyone's calling, and we are surrounded by this great family.","idee":"Tell a child the story of the saint whose name they bear, or of a saint they love."},"defunts":{"quoi":"The day after All Saints, the Church prays for all the dead.","pourquoi":"We believe death is not a final break: prayer still binds us to those we love.","idee":"Say the name of someone who has died and entrust them to God, or bring flowers to a grave."},"christ-roi":{"quoi":"The last Sunday of the liturgical year, before Advent.","pourquoi":"Jesus is king, but a king who serves, forgives and gives himself: his kingdom is made of love.","idee":"Do someone a quiet favor, without telling them."},"immaculee-conception":{"quoi":"The feast celebrating Mary, preserved from all sin from the first moment of her life, in her mother's womb.","pourquoi":"God prepared Mary so she could say yes with her whole being to the coming of Jesus.","idee":"Pray a Hail Mary for someone who needs it."},"noel":{"quoi":"The birth of Jesus in Bethlehem.","pourquoi":"God does not stay far away: he comes to live among us, poor and small, so that no one is afraid to come near.","idee":"Before opening presents, stop as a family in front of the nativity scene and say thank you."},"sainte-famille":{"quoi":"On the Sunday after Christmas we celebrate Jesus, Mary and Joseph.","pourquoi":"Jesus grew up in a family, with its joys and difficulties: every family can find a model and a help there.","idee":"Pray together for a minute before a meal, each saying a thank you."},"marie-mere-de-dieu":{"quoi":"On January 1, the Church celebrates Mary, Mother of Jesus, true God and true man. It is also the World Day of Peace.","pourquoi":"We begin the year under a mother's gaze, asking for peace.","idee":"Entrust to Mary an intention for the new year."},"epiphanie":{"quoi":"The visit of the Magi from the East, guided by a star, to the child Jesus.","pourquoi":"Jesus did not come for one people only: he shows himself to all, wherever they come from.","idee":"Pray for someone far away."},"bapteme":{"quoi":"Jesus is baptized by John in the Jordan. A voice says: “This is my beloved Son.”","pourquoi":"Through our baptism, we too are called God's beloved children.","idee":"Find the date of your baptism and write it down somewhere."},"cendres":{"quoi":"The first day of Lent. The priest marks a cross of ashes on the forehead.","pourquoi":"A sign of humility and of starting again: we are fragile, and God is waiting for us.","idee":"Choose the Lenten effort you would like to live: just one, simple."},"rameaux":{"quoi":"Jesus enters Jerusalem, acclaimed by the crowd waving branches. It is the beginning of Holy Week.","pourquoi":"The same crowd that cheers will soon shout “Crucify him”: the mystery of our divided hearts.","idee":"Bring home a blessed palm and place it near a crucifix."},"jeudi-saint":{"quoi":"Jesus' last meal with his friends, where he washes their feet and gives his Body and Blood.","pourquoi":"It is the birth of the Eucharist and of the commandment of love that serves.","idee":"Do a humble service at home, expecting nothing."},"vendredi-saint":{"quoi":"The day Jesus dies on the cross.","pourquoi":"He gives his life out of love, to the very end, to save us.","idee":"Keep a moment of silence at 3 pm, the hour of his death."},"samedi-saint":{"quoi":"The day of great silence: Jesus lies in the tomb. In the evening, the Easter Vigil opens the feast of Easter.","pourquoi":"It is the day of waiting, like our own moments when God seems absent.","idee":"Keep a quiet day, then light a candle in the evening."},"paques":{"quoi":"The resurrection of Jesus, on the morning of the third day.","pourquoi":"It is the heart of the Christian faith: love is stronger than death.","idee":"Tell someone: “Christ is risen!”, like the first Christians."},"misericorde":{"quoi":"The Sunday after Easter, dedicated to God's mercy.","pourquoi":"God never tires of forgiving: there is no fault greater than his love.","idee":"Forgive someone a small thing, or forgive yourself."},"ascension":{"quoi":"Forty days after Easter, Jesus returns to his Father.","pourquoi":"He does not abandon us: he entrusts us with continuing his work and promises the Holy Spirit.","idee":"Look up at the sky for a moment and say thank you."},"pentecote":{"quoi":"Fifty days after Easter, the Holy Spirit comes down on the gathered apostles.","pourquoi":"It is the birth of the Church: the Spirit gives the strength and joy to bear witness.","idee":"Simply say “Come, Holy Spirit” before a decision or a hard day."},"trinite":{"quoi":"The feast of the one God in three persons: the Father, the Son and the Holy Spirit.","pourquoi":"God is not solitary: he is love, relationship, communion.","idee":"Make the Sign of the Cross slowly, thinking about each word."},"saint-sacrement":{"quoi":"The feast of the Body and Blood of Christ, present in the Eucharist.","pourquoi":"Jesus gives himself as food to stay with us every day.","idee":"Step into a church and stay a minute before the tabernacle."},"sacre-coeur":{"quoi":"The feast of Jesus' love, represented by his heart.","pourquoi":"It reminds us that God loves us with a human heart, tender and patient.","idee":"Entrust to Jesus whatever weighs on your heart."},"assomption":{"quoi":"At the end of her earthly life, Mary is taken up body and soul into the glory of heaven.","pourquoi":"What happened to Mary is a promise for us: our body too is called to life.","idee":"Pray a Hail Mary for your family."},"joseph":{"quoi":"The feast of Joseph, Mary's husband, who watched over the child Jesus.","pourquoi":"A quiet, just and courageous man: patron of fathers and workers.","idee":"For a dad: entrust to Saint Joseph your role as a father."},"annonciation":{"quoi":"The angel Gabriel announces to Mary that she will be the mother of the Son of God, and she says yes.","pourquoi":"Mary's “yes” opens the door to God in human history.","idee":"Pray the Angelus, the prayer that recalls this moment."},"nativite-jean-baptiste":{"quoi":"The birth of John, Jesus' relative, who announced and baptized him.","pourquoi":"John prepares the way: he points to Jesus and steps aside. It is one of the few births the Church celebrates.","idee":"In many countries, Saint John's Eve is celebrated with bonfires: a chance to tell a child about John."},"pierre-paul":{"quoi":"The feast of the two great apostles, Peter the fisherman and Paul the convert, who died in Rome.","pourquoi":"Two very different men, with their weaknesses, on whom the Church rests.","idee":"Pray for the pope, Peter's successor."}}},"conseils":["Before picking up your phone this morning, you can make the Sign of the Cross, just once.","Think of someone who matters to you and entrust them to God in one sentence.","Step into a church as you pass by, even for two minutes, and simply sit down.","At mealtime, give thanks inwardly for what is on your plate.","If someone annoys you today, try saying a short prayer for them.","Take a minute of silence, doing nothing. God is there too.","Write down somewhere one thing you are grateful for today.","Do someone a small favor without letting it be known.","Tonight, tell your child about a happy moment of your day.","Read one sentence of the Gospel slowly and carry it with you all day.","Forgive one small thing, to someone else or to yourself.","At the busiest moment of your day, say: “Jesus, I trust in you.”"],"prieres":{"signe-de-croix":{"titre":"The Sign of the Cross","texte":"In the name of the Father,\nand of the Son,\nand of the Holy Spirit.\nAmen.","geste":"With the right hand, touch the forehead (the Father), the chest (the Son), then the left shoulder and the right shoulder (the Holy Spirit).","quand":"At the beginning and end of every prayer, when entering a church, before a meal, or simply to place yourself before God.","pourquoi":"It is the shortest and oldest prayer: in a few words we profess our faith in God, Father, Son and Spirit, and trace on ourselves the cross of Christ."},"notre-pere":{"titre":"The Our Father","texte":"Our Father, who art in heaven,\nhallowed be thy name;\nthy kingdom come,\nthy will be done\non earth as it is in heaven.\nGive us this day our daily bread,\nand forgive us our trespasses,\nas we forgive those who trespass against us;\nand lead us not into temptation,\nbut deliver us from evil.\nAmen.","quand":"Every day, morning or evening, at Mass, or when you don't know what to say to God.","pourquoi":"It is the prayer Jesus himself taught his disciples (Mt 6:9-13). It contains everything: trust, daily bread, forgiveness and protection.","source":"Mt 6:9-13; Lk 11:2-4"},"je-vous-salue-marie":{"titre":"The Hail Mary","texte":"Hail Mary, full of grace,\nthe Lord is with thee.\nBlessed art thou among women,\nand blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God,\npray for us sinners,\nnow and at the hour of our death.\nAmen.","quand":"At any time, alone or with a child. It is repeated ten times in each decade of the Rosary.","pourquoi":"The first part repeats the words of the angel Gabriel and of Elizabeth to Mary (Lk 1:28.42). In the second, we ask Mary to pray for us, as we would ask a mother.","source":"Lk 1:28; Lk 1:42"},"gloire-au-pere":{"titre":"Glory Be","texte":"Glory be to the Father,\nand to the Son,\nand to the Holy Spirit,\nas it was in the beginning,\nis now, and ever shall be,\nworld without end.\nAmen.","quand":"At the end of a decade of the Rosary, of a psalm, or as a short prayer of praise during the day.","pourquoi":"A very simple praise: we ask for nothing, we give glory to God for who he is."},"credo":{"titre":"The Apostles' Creed","texte":"I believe in God,\nthe Father almighty,\nCreator of heaven and earth,\nand in Jesus Christ, his only Son, our Lord,\nwho was conceived by the Holy Spirit,\nborn of the Virgin Mary,\nsuffered under Pontius Pilate,\nwas crucified, died and was buried;\nhe descended into hell;\non the third day he rose again from the dead;\nhe ascended into heaven,\nand is seated at the right hand of God the Father almighty;\nfrom there he will come to judge the living and the dead.\nI believe in the Holy Spirit,\nthe holy catholic Church,\nthe communion of saints,\nthe forgiveness of sins,\nthe resurrection of the body,\nand life everlasting.\nAmen.","quand":"At the start of the Rosary, at Sunday Mass, or to restate your faith when it wavers.","pourquoi":"The Creed sums up the essentials of the Christian faith, as the Church has handed it on since the first centuries. Praying it unites us with all believers, past and present."},"ange-de-dieu":{"titre":"Angel of God","texte":"Angel of God,\nmy guardian dear,\nto whom God's love\ncommits me here,\never this day\nbe at my side,\nto light and guard,\nto rule and guide.\nAmen.","quand":"In the evening before sleeping, or in the morning when heading out. A beautiful prayer to say with a child.","pourquoi":"The Church believes each person is accompanied by a guardian angel, an invisible friend God places at our side (Catechism, no. 336)."},"angelus":{"titre":"The Angelus","texte":"The Angel of the Lord declared unto Mary,\n— And she conceived of the Holy Spirit.\nHail Mary…\n\nBehold the handmaid of the Lord.\n— Be it done unto me according to thy word.\nHail Mary…\n\nAnd the Word was made flesh,\n— And dwelt among us.\nHail Mary…\n\nPray for us, O holy Mother of God,\n— That we may be made worthy of the promises of Christ.\n\nLet us pray.\nPour forth, we beseech thee, O Lord,\nthy grace into our hearts,\nthat we, to whom the Incarnation of Christ, thy Son,\nwas made known by the message of an angel,\nmay by his Passion and Cross\nbe brought to the glory of his Resurrection.\nThrough the same Christ our Lord.\nAmen.","quand":"Traditionally three times a day: at 6 am, noon and 6 pm, when the bells ring.","pourquoi":"It recalls the moment God became man, thanks to Mary's “yes”. Praying it at noon is a pause in the middle of the day to remember God."},"acte-de-contrition":{"titre":"Act of Contrition","texte":"My God,\nI am sorry for my sins with all my heart.\nIn choosing to do wrong\nand failing to do good,\nI have sinned against you\nwhom I should love above all things.\nI firmly intend, with your help,\nto do penance,\nto sin no more,\nand to avoid whatever leads me to sin.\nOur Savior Jesus Christ\nsuffered and died for us.\nIn his name, my God, have mercy.\nAmen.","variante":"O my God, I am heartily sorry for having offended thee,\nand I detest all my sins because of thy just punishments,\nbut most of all because they offend thee, my God,\nwho art all good and deserving of all my love.\nI firmly resolve, with the help of thy grace,\nto sin no more and to avoid the near occasion of sin.\nAmen.","quand":"In the evening after looking back on the day, or during confession, after naming your sins.","pourquoi":"We tell God we regret the wrong we have done and want to change, counting on his help more than on our own strength."},"benedicite":{"titre":"Grace Before Meals","texte":"Bless us, O Lord,\nand these thy gifts,\nwhich we are about to receive\nfrom thy bounty,\nthrough Christ our Lord.\nAmen.","quand":"Before a meal, as a family or alone.","pourquoi":"We thank God for our food, a gift of his goodness. It translates the ancient Latin grace “Benedic, Domine”."},"nunc-dimittis":{"titre":"The Canticle of Simeon","quand":"In the evening before sleep. The Church prays it every night at Night Prayer (Compline).","pourquoi":"These are the words of the old man Simeon when he took the child Jesus in his arms in the Temple (Lk 2:29-32). Ending the day with them is entrusting oneself to God in peace."}},"guide-famille":{"titre":"Bedtime prayer with your child","duree":"3 minutes","intro":"A small ritual to end the day together, to read aloud.","etapes":[{"mot":"Settle down","invitation":"Dim the lights, sit close together and make the Sign of the Cross together."},{"mot":"Thank you","invitation":"Ask: “What made you happy today?” Then thank God for it together."},{"mot":"Sorry","invitation":"Is there something we regret? We can tell Jesus quietly. He loves to forgive."},{"mot":"Please","invitation":"Who do we want to pray for tonight? A friend, a grandparent, someone who is sick…"},{"mot":"Angel of God","invitation":"Pray the guardian angel prayer together."},{"mot":"Good night","invitation":"You can trace a small cross on their forehead with your thumb, as a blessing."}],"fin":"Good night."},"lexique":{"mots":[{"id":"alleluia","mot":"Alleluia","formes":["alleluia","Alleluia"],"def":"A Hebrew word meaning “praise God”. It is a cry of joy, sung especially in Easter Time. It is not sung during Lent."},{"id":"amen","mot":"Amen","formes":["Amen","amen"],"def":"A Hebrew word meaning “it is true”, “I believe it”, “so be it”. We say it at the end of a prayer to give our agreement."},{"id":"ange-gardien","mot":"Guardian angel","formes":["guardian angel","guardian angels","guardian"],"def":"An angel God gives to each person to accompany and protect them throughout life. You can talk to your angel like an invisible friend."},{"id":"annonciation","mot":"Annunciation","formes":["Annunciation"],"def":"The moment when the angel Gabriel announces to Mary that she will be the mother of Jesus. Mary says “yes”. It is celebrated on March 25."},{"id":"apotre","mot":"Apostle","formes":["apostle","apostles","Apostles","Apostle"],"def":"The twelve friends Jesus chose to be with him and then to proclaim the Gospel to the world. Peter, John, James and Thomas are among them."},{"id":"avent","mot":"Advent","formes":["Advent"],"def":"The four weeks that prepare for Christmas. The word comes from the Latin adventus, meaning “coming”."},{"id":"bapteme","mot":"Baptism","formes":["baptism","Baptism","baptized"],"def":"The first sacrament, which brings us into the family of Christians. Through water and the Holy Spirit we become children of God. It is received only once and lasts forever."},{"id":"beatitudes","mot":"Beatitudes","formes":["Beatitudes","beatitudes"],"def":"Jesus' words that begin with “Blessed are…”: the meek, the clean of heart, the peacemakers… (Mt 5:1-12). They describe true happiness according to God."},{"id":"bible","mot":"Bible","formes":["Bible"],"def":"The holy book of Christians, made of 73 books written over more than a thousand years. The Old Testament tells the story of God with his people; the New Testament tells of Jesus and the first Christians."},{"id":"careme","mot":"Lent","formes":["Lent","Lenten"],"def":"The forty days that prepare for Easter, from Ash Wednesday to Holy Thursday. A time to return to God through prayer, sharing and fasting."},{"id":"catechisme","mot":"Catechism","formes":["Catechism","catechism"],"def":"The teaching of the Christian faith. The Catechism of the Catholic Church, published in 1992, is the book that gathers everything the Church believes."},{"id":"chapelet","mot":"Rosary","formes":["Rosary","rosary","rosaries"],"def":"A string of beads that helps us pray: on each bead we say a prayer. A decade is one Our Father, ten Hail Marys and one Glory Be. A full set of mysteries has five decades."},{"id":"communion","mot":"Communion","formes":["Communion","communion"],"def":"The moment at Mass when we receive the host, the Body of Christ. The word means “union with”: with Jesus and with other believers."},{"id":"communion-des-saints","mot":"Communion of saints","formes":["communion of saints"],"def":"The great family that unites all believers: those living on earth, those who have died and those already with God. We can pray for one another."},{"id":"confession","mot":"Confession","formes":["confession","reconciliation"],"def":"The sacrament of forgiveness, also called the sacrament of reconciliation. We tell our sins to a priest, who gives God's forgiveness. The priest can never repeat what he has heard."},{"id":"credo","mot":"Creed","formes":["Creed"],"def":"From the Latin credo, “I believe”. It is the text that sums up the Christian faith, said on Sundays at Mass."},{"id":"croix","mot":"Cross","formes":["cross","Cross"],"def":"The instrument of Jesus' death, which became the sign of Christians. It recalls that Jesus gave his life out of love, and that he is risen."},{"id":"defunts","mot":"The faithful departed","formes":["departed","the dead"],"def":"People who have died. The Church prays for them, especially on November 2, hoping to meet them again with God."},{"id":"esprit-saint","mot":"Holy Spirit","formes":["Holy Spirit","the Spirit"],"def":"The third person of the Trinity, with the Father and the Son. He is the breath of God who gives strength, peace and joy, and who helps us pray."},{"id":"eucharistie","mot":"Eucharist","formes":["Eucharist","eucharist"],"def":"The sacrament of the Body and Blood of Christ, celebrated at Mass. The Greek word means “thanksgiving”, that is, “thank you”."},{"id":"evangile","mot":"Gospel","formes":["Gospel","gospel","Gospels","gospels"],"def":"The word means “good news”. These are the four books of the Bible (Matthew, Mark, Luke and John) that tell the life, words, death and resurrection of Jesus."},{"id":"grace","mot":"Grace","formes":["grace"],"def":"A free gift from God: his love and help, which we do not earn but which he gives gladly."},{"id":"hostie","mot":"Host","formes":["host","hosts"],"def":"The small, round, flat unleavened bread that becomes the Body of Christ during Mass."},{"id":"incarnation","mot":"Incarnation","formes":["Incarnation","incarnation"],"def":"The mystery of God becoming man in Jesus. The word comes from the Latin caro, “flesh”: God took on a body like ours."},{"id":"laudes","mot":"Morning Prayer (Lauds)","formes":["Lauds","Morning Prayer"],"def":"The Church's morning prayer, made of psalms, readings and hymns. Lauds comes from the Latin laus, “praise”."},{"id":"liturgie","mot":"Liturgy","formes":["liturgy","liturgical"],"def":"All the celebrations of the Church: the Mass, the sacraments, the Liturgy of the Hours. The liturgical year is the year organized around the life of Jesus."},{"id":"messe","mot":"Mass","formes":["Mass","Masses"],"def":"The main celebration of Christians, where we listen to the Word of God and share the Eucharist. It takes place every Sunday, and often every day."},{"id":"misericorde","mot":"Mercy","formes":["Mercy","mercy"],"def":"God's love that forgives and lifts up. In Latin, misericordia evokes a heart (cor) that bends down over misery."},{"id":"mystere","mot":"Mystery","formes":["mystery","mysteries"],"def":"In faith, a mystery is not a puzzle to solve: it is a reality so great that we never finish discovering it. In the Rosary, the mysteries are scenes from the life of Jesus and Mary."},{"id":"paques","mot":"Easter","formes":["Easter"],"def":"The greatest Christian feast: the resurrection of Jesus. Its date changes every year: it is the Sunday after the first full moon of spring."},{"id":"peche","mot":"Sin","formes":["sin","sins","sinners"],"def":"An act, word or thought that damages our relationship with God, with others or with ourselves. God is always ready to forgive."},{"id":"pentecote","mot":"Pentecost","formes":["Pentecost"],"def":"The feast, fifty days after Easter, when the Holy Spirit comes down on the apostles. It is called the birth of the Church."},{"id":"psaume","mot":"Psalm","formes":["Psalm","psalm","psalms","Psalms"],"def":"A sung prayer from the Bible. The Book of Psalms contains 150 of them, expressing every human emotion: joy, fear, anger, trust."},{"id":"resurrection","mot":"Resurrection","formes":["resurrection","Resurrection","risen"],"def":"Jesus' return to life three days after his death, with a transformed body. It is also the promise made to all: death is not the end."},{"id":"sacrement","mot":"Sacrament","formes":["sacrament","sacraments"],"def":"A visible sign through which God gives his grace. There are seven: baptism, confirmation, Eucharist, reconciliation, anointing of the sick, marriage and holy orders."},{"id":"saint","mot":"Saint","formes":["saint","saints"],"def":"A person who lived in deep friendship with God and is now with him. The Church has recognized thousands, but all Christians are called to holiness."},{"id":"solennite","mot":"Solemnity","formes":["Solemnity","solemnity","solemnities"],"def":"The highest rank of feast in the liturgical year, like Christmas, Easter or All Saints. At Mass the Gloria is sung and the Creed is said."},{"id":"temps-ordinaire","mot":"Ordinary Time","formes":["Ordinary Time"],"def":"The weeks of the year that are not Advent, Christmas, Lent or Easter. “Ordinary” comes from the Latin ordo: weeks that are counted one by one."},{"id":"toussaint","mot":"All Saints","formes":["All Saints"],"def":"The feast of all the saints on November 1: the well-known saints and all the others, known to God alone."},{"id":"trinite","mot":"Trinity","formes":["Trinity"],"def":"The mystery of one God in three persons: the Father, the Son (Jesus) and the Holy Spirit. God is love, and love is always relationship."},{"id":"vepres","mot":"Evening Prayer (Vespers)","formes":["Vespers","Evening Prayer"],"def":"The Church's evening prayer, at sunset. Vespers comes from the Latin vesper, “evening”."},{"id":"vierge-marie","mot":"Virgin Mary","formes":["Virgin Mary","Mary"],"def":"The mother of Jesus. Christians love her and pray to her as a mother: she does not replace God, she leads to her Son."},{"id":"yahweh","mot":"Yahweh","formes":["Yahweh"],"def":"The name God reveals to Moses in the burning bush (Ex 3:14), meaning roughly “I am”. Out of respect, Jews do not pronounce it, and the Church asks us to say “the Lord” in prayer and at Mass."},{"id":"purgatoire","mot":"Purgatory","formes":["purgatory","Purgatory"],"def":"For the Church, a purification after death for those who are saved but not yet fully ready to see God. It is not a punishment but a final preparation of love. We can help the dead by our prayer."},{"id":"defunt","mot":"Deceased","formes":["deceased"],"def":"A person who has died. On November 2, the Church prays for all the dead."},{"id":"memento-mori","mot":"Memento mori","formes":["memento mori"],"def":"A Latin phrase: “remember that you will die”. For Christians it is not a sad thought, but an invitation to live each day fully and not to put off what matters most."}]}}},"guideFamilleFr":{"titre":"La prière du soir avec ton enfant","duree":"3 minutes","intro":"Un petit rituel pour finir la journée ensemble, à lire à voix haute.","etapes":[{"mot":"On se pose","invitation":"Baissez la lumière, asseyez-vous l'un près de l'autre et faites ensemble le signe de croix."},{"mot":"Merci","invitation":"Demande-lui : « Qu'est-ce qui t'a rendu heureux aujourd'hui ? » Remerciez Dieu ensemble pour cela."},{"mot":"Pardon","invitation":"Y a-t-il quelque chose que l'on regrette ? On peut le dire tout bas à Jésus. Il aime pardonner."},{"mot":"S'il te plaît","invitation":"Pour qui veut-on prier ce soir ? Un ami, un grand-parent, quelqu'un de malade…"},{"mot":"Ange de Dieu","invitation":"Dites ensemble la prière à l'ange gardien."},{"mot":"Bonne nuit","invitation":"Tu peux tracer une petite croix sur son front avec ton pouce, comme une bénédiction."}],"fin":"Bonne nuit."},"auteurs":{"_note":"Courtes présentations des personnes citées. Faits vérifiés : Vatican (vatican.va), Encyclopædia Britannica, sanctuaire de Lisieux.","therese-de-lisieux":{"fr":{"nom":"Sainte Thérèse de Lisieux","bio":"Religieuse carmélite française (1873-1897), morte à 24 ans au carmel de Lisieux, en Normandie. Son autobiographie, Histoire d'une âme, a touché des millions de lecteurs par sa « petite voie » : faire confiance à Dieu comme un enfant. Elle a été proclamée sainte en 1925 et docteur de l'Église en 1997."},"es":{"nom":"Santa Teresa de Lisieux","bio":"Religiosa carmelita francesa (1873-1897), murió a los 24 años en el carmelo de Lisieux, en Normandía. Su autobiografía, Historia de un alma, ha conmovido a millones de lectores con su «caminito»: confiar en Dios como un niño. Fue proclamada santa en 1925 y doctora de la Iglesia en 1997."},"en":{"nom":"Saint Thérèse of Lisieux","bio":"French Carmelite nun (1873-1897) who died at 24 in the Carmel of Lisieux, in Normandy. Her autobiography, Story of a Soul, has touched millions of readers with her “little way”: trusting God like a child. She was canonized in 1925 and declared a Doctor of the Church in 1997."}},"benoit-xvi":{"fr":{"nom":"Benoît XVI","bio":"Joseph Ratzinger (1927-2022), théologien allemand, pape de 2005 à 2013. Il a écrit trois livres sur Jésus de Nazareth et trois encycliques, dont Deus caritas est (« Dieu est amour »). En 2013, il a renoncé à sa charge, ce qu'aucun pape n'avait fait depuis près de six siècles."},"es":{"nom":"Benedicto XVI","bio":"Joseph Ratzinger (1927-2022), teólogo alemán, papa de 2005 a 2013. Escribió tres libros sobre Jesús de Nazaret y tres encíclicas, entre ellas Deus caritas est («Dios es amor»). En 2013 renunció a su cargo, algo que ningún papa había hecho en casi seis siglos."},"en":{"nom":"Benedict XVI","bio":"Joseph Ratzinger (1927-2022), German theologian, pope from 2005 to 2013. He wrote three books on Jesus of Nazareth and three encyclicals, including Deus caritas est (“God is love”). In 2013 he resigned his office, something no pope had done in nearly six centuries."}},"bernard-de-clairvaux":{"fr":{"nom":"Saint Bernard de Clairvaux","bio":"Moine cistercien bourguignon (1090-1153). En 1115, il fonde l'abbaye de Clairvaux, en Champagne, qui essaimera dans toute l'Europe. Grand prédicateur, il a écrit sur l'amour de Dieu et sur la Vierge Marie. Il est docteur de l'Église."},"es":{"nom":"San Bernardo de Claraval","bio":"Monje cisterciense de Borgoña (1090-1153). En 1115 fundó la abadía de Claraval, en Champaña, que se extendió por toda Europa. Gran predicador, escribió sobre el amor de Dios y sobre la Virgen María. Es doctor de la Iglesia."},"en":{"nom":"Saint Bernard of Clairvaux","bio":"Cistercian monk from Burgundy (1090-1153). In 1115 he founded the abbey of Clairvaux, in Champagne, whose monks spread across Europe. A great preacher, he wrote about the love of God and about the Virgin Mary. He is a Doctor of the Church."}},"monique":{"fr":{"nom":"Sainte Monique","bio":"Née vers 331 à Thagaste, dans l'actuelle Algérie, morte en 387 à Ostie, près de Rome. Mère de saint Augustin, elle a prié pendant des années pour qu'il trouve la foi, et l'a vu se faire baptiser peu avant sa mort. Augustin raconte sa vie dans ses Confessions."},"es":{"nom":"Santa Mónica","bio":"Nacida hacia el año 331 en Tagaste, en la actual Argelia, murió en el 387 en Ostia, cerca de Roma. Madre de san Agustín, rezó durante años para que encontrara la fe, y lo vio bautizarse poco antes de morir. Agustín cuenta su vida en las Confesiones."},"en":{"nom":"Saint Monica","bio":"Born around 331 in Thagaste, in present-day Algeria, she died in 387 at Ostia, near Rome. The mother of Saint Augustine, she prayed for years that he would find faith, and saw him baptized shortly before her death. Augustine tells her story in his Confessions."}},"catechisme":{"fr":{"nom":"Catéchisme de l'Église catholique","bio":"Le résumé officiel de la foi catholique, publié en 1992 par le pape Jean-Paul II. Il explique en quatre parties ce que l'Église croit, célèbre, vit et prie. C'est la référence d'Ora pour tout ce qui touche à la doctrine."},"es":{"nom":"Catecismo de la Iglesia Católica","bio":"El resumen oficial de la fe católica, publicado en 1992 por el papa Juan Pablo II. Explica en cuatro partes lo que la Iglesia cree, celebra, vive y reza. Es la referencia de Ora para todo lo que toca a la doctrina."},"en":{"nom":"Catechism of the Catholic Church","bio":"The official summary of the Catholic faith, published in 1992 by Pope John Paul II. In four parts it explains what the Church believes, celebrates, lives and prays. It is Ora's reference for everything to do with doctrine."}}},"abreviations":{"fr":{"Gn":"Gen","Genèse":"Gen","Ex":"Exod","Exode":"Exod","Lv":"Lev","Lévitique":"Lev","Nb":"Num","Nombres":"Num","Dt":"Deut","Deutéronome":"Deut","Jos":"Josh","Josué":"Josh","Jg":"Judg","Juges":"Judg","Rt":"Ruth","Ruth":"Rut   function resultats(q) {
    q = (q || '').trim();

    var nq = norm(q), out = [], total = 0;
    BIBLE.livres.forEach(function (b) {
      b.ch.forEach(function (chap, ci) {
        chap.forEach(function (v, vi) {

        });
